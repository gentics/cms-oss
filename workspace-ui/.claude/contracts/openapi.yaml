                      Connector type dam does not allow more than one connection per user.
                      Patch the existing one instead.
                    genaix_code: mcp_connection_limit
                    instance: /api/v1/mcp/connections
                    request_id: 01K3N5Q8TQ2R9V5T0B6C3E8H61
                    connector: dam
                    limit: 1
        '422':
