<gtx-search-bar
  class="search-bar"
  data-action="search"
  [query]="query"
  [placeholder]="'shared.search' | gtxI18n"
  (change)="updateSearchQuery($event)"
  (search)="updateSearchQuery($event)"
  (clear)="updateSearchQuery('')"
></gtx-search-bar>

<gtx-progress-bar class="load-bar" [active]="loading"></gtx-progress-bar>

@if (searchTruncated) {
  <div class="search-truncated-hint" data-id="search-truncated">
    {{ 'shared.search_results_truncated' | gtxI18n:{ visible: searchVisibleMatchCount, total: searchMatchCount } }}
  </div>
}

<gtx-trable
  class="entity-trable"

  [selectable]="selectable"
  [hideActions]="hideActions"
  [multiple]="multiple"
  [inlineExpansion]="inlineExpansion"
  [inlineSelection]="inlineSelection"

  [columns]="columns"
  [rows]="rows"
  [actions]="actions"
  [active]="activeEntity"
  [selected]="selected"

  [renderers]="{
      name: nameRenderer
  }"

  (loadRow)="loadRow($event)"
  (rowClick)="handleRowClick($event)"
  (rowExpand)="updateRowExpansion($event)"
  (actionClick)="handleActionClick($event)"
  (selectedChange)="updateSelection($event)"
  (rowSelect)="forwardSelect($event)"
  (rowDeselect)="forwardDeselect($event)"
></gtx-trable>

<ng-template #nameRenderer let-value="value">
  <div class="name-wrapper">
    <gtx-icon class="gtx-type-icon type-icon" [name]="'group'"></gtx-icon>
    <span class="name">{{ value }}</span>
  </div>
</ng-template>
