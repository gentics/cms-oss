<div class="modal-title">
    <h5>{{ 'mesh.manage_user_token_title' | gtxI18n: { user: user | gtxMeshUsername } }}</h5>
</div>

<div class="modal-content">
    <gtx-mesh-user-token-table
        [user]="user"
    />
</div>

<div class="modal-footer">
    <gtx-button
        type="secondary"
        flat
        data-action="close"
        (click)="closeFn()"
    >
        {{ 'common.close_button' | gtxI18n }}
    </gtx-button>
</div>
