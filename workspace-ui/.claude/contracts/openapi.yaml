  /sessions/{session_id}/interactions/{interaction_id}:
    post:
      operationId: answerInteraction
      tags: [interactions]
      summary: Answer a pending agent question
      description: |
        Resolves a pending `interaction.requested`. The blocked run continues on the
        same event stream, which emits `interaction.resolved` and then carries on.

        The shape of `answer` depends on the interaction `kind`:

        | kind | answer |
        |---|---|
        | `ask_user` | `{"text": "..."}` - free text, at most 4000 characters |
        | `choice` | `{"selected": ["option-id", ...]}` - one id unless `multi` is true |
        | `confirm` | `{"approved": true, "comment": "..."}` |
        | `form` | `{"values": {...}}` - must validate against the interaction's `schema` |
        | `settings_review` | `{"settings": [ ... ]}` - one `setting` part per key |

        A `settings_review` is how a setting GenAIx inferred becomes a decision. `settings`
        carries one `setting` part for every key the review raised: each `proposed` value
        accepted or corrected, each `missing` value filled in. Unknown extra keys are allowed
        and are carried as constraints. GenAIx stores those exact parts as a **user message**
        with `interaction_id` pointing at the review, returns that message's id in
        `InteractionResolvedEvent.message_id`, and lists every confirmed key in the
        `corrected_by_user` of the next `derived_settings.updated`. Until the review is
        answered, no write-governing setting the run inferred from the user's text may reach
        a CMS write; a review that times out or is cancelled ends the run without one.

        A resolved review also updates `Session.context` with the confirmed `folder_id`,
        `template_id`, `language` and `publish_at`, announced by a `session.updated` with
        `context` in `changed`, so the next run starts from the decision (since
        `1.0.0-rc.2`). Answered through `reply_to_interaction` instead, the review yields
        **two** stored user messages: the confirmation (its `parts` the `setting` parts,
        `interaction_id` the review's) and the reply message itself, both with the same run.

        `409` with `interaction_already_answered` when it was already resolved. `410`
        with `interaction_expired` when `expires_at` has passed; the default lifetime is
        10 minutes and the agent has already been told the question timed out. `422`
        when the answer does not match the kind or fails the form schema; for a
        `settings_review`, `422` with `errors[].pointer` `/answer/settings` and detail
        `No setting part for '<key>'.` when a raised key is missing, and with a pointer
        ending in `/value` and `code: not_an_option` when a `missing` key's value is not
        one of its `options`.

        This route replaces the current `POST /responses/{response_id}/ask-user-answer`,
        which stays available for one release as a deprecated alias.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/InteractionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionAnswerRequest'
            examples:
              choice:
                summary: S1 - pick the campaign template
                value:
                  answer:
                    selected: [tpl-17]
              ask_user:
                summary: S1 - free-text answer about the webinar date
                value:
                  answer:
                    text: >-
                      The webinar is on 14 October 2026, 10:00 CEST, registration closes
                      on 12 October.
              confirm:
                summary: S1 - approve creating the page
                value:
                  answer:
                    approved: true
                    comment: Yes, create it as an unpublished draft.
              settings_review:
                summary: S1 - confirm the derived settings before the first write
                value:
                  answer:
                    settings:
                      - type: setting
                        key: folder
                        value: '42'
                        label: Richtlinien
                      - type: setting
                        key: language
                        value: de
                        label: Deutsch
                      - type: setting
                        key: template
                        value: '17'
                        label: Kampagnen-Landingpage
                    comment: Ordner und Sprache stimmen, nimm das Kampagnen-Template.
              form:
                summary: S3 - fill the construct metadata form
                value:
                  answer:
                    values:
                      keyword: terms_change_table
                      name_de: Aenderungstabelle Nutzungsbedingungen
                      name_en: Terms change table
                      category_id: 4
      responses:
        '200':
          description: The interaction was resolved; the run continues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
              examples:
                resolved:
                  value:
                    id: e3f7b1a9-2c64-4d08-95b7-1a8e0c5d7f36
                    kind: choice
                    prompt: >-
                      Two templates allow all four constructs. Which one should the
                      landing page use?
                    options:
                      - id: tpl-17
                        label: Kampagnen-Landingpage
                        description: Hero, text columns, quote, form embed. Used by 14 pages.
                      - id: tpl-21
                        label: Themenseite
                        description: Hero, text columns, quote. No form embed.
                    multi: false
                    blocking: true
                    requested_at: '2026-10-07T09:23:44Z'
                    expires_at: '2026-10-07T09:33:44Z'
                    status: answered
                    answer:
                      selected: [tpl-17]
                    answered_at: '2026-10-07T09:24:01Z'
                    answered_by: user
                    run_id: c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sessions/{session_id}/files:
    post:
      operationId: uploadSessionFile
      tags: [files]
      summary: Upload a file into the session
      description: |
        Multipart upload into the session's `uploads` directory
        (`<base>/sessions/<session_id>/uploads/`). The agent reads it with its
        `read_file` tool; the returned `id` is what the client puts into a message's
        `files` array or into a `ContextReference` of type `session_file`.

        `mode` decides how the file's wording is treated, and the two modes are exactly
        the two verbatim paths:

        - **`mode: verbatim`** declares the whole upload as verbatim. GenAIx extracts the
          file's text, splits it into blocks and hashes each block, and the
          `verbatim_identical` gate verifies that every block the agent reused appears
          unchanged in the produced CMS content. The resulting `Check` carries a
          `verification` with `unit: blocks`. Declaring the same file inline, as a
          `file_ref` part with `mode: verbatim`, means the same thing for that turn.
        - **`mode: source`** (the default) makes the file reference material. The agent
          may read, summarise and paraphrase it, and nothing about it is locked. A
          `verbatim` part whose `source` is the file's id still locks the passage it
          quotes, whatever the file's mode.

        Text extraction happens **in GenAIx**, not in the model: PDF, Word and HTML are
        converted to text before the agent sees anything, so the model never receives raw
        binary and the hashes are taken from the same extracted text the gate compares
        against.

        Limits: 25 MB per file by default, reported as `capabilities.upload_max_bytes`
        in `GET /me`. `413` above the limit, `422` for a media type that is not on
        `capabilities.upload_media_types`. ZIP is accepted but not unpacked in Phase
        One; it is reserved for Design Studio set uploads.

        **Name and media type** (since `1.0.0-rc.2`). The stored `File.name` is the
        uploaded filename kept verbatim, including spaces and brackets (it renders as
        `[[release \[draft\].md]]` in a message), with only path separators, control
        characters and leading dots removed; a second upload of the same name in one
        session is stored as `<name>-1`, `<name>-2`. The declared `Content-Type` of the
        part is authoritative for text types; for a declared binary type (PDF, PNG, JPEG,
        WEBP, ZIP, DOCX) GenAIx checks the magic number and answers `422` when the bytes
        are not what the type says.

        `409` with `genaix_code: session_released` when the session has moved past
        generation, that is when its status is `released`, `published`,
        `review_requested`, `discarded` or `archived`. Uploading is part of composing a
        turn, so it is allowed only while the session is `active` or
        `waiting_for_input`. Reopen the session first with
        `POST /sessions/{session_id}/transitions` `{"action": "reopen"}`.

        An active run does **not** block an upload: the client may stage the next turn's
        files while the agent is still working.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file content.
                mode:
                  $ref: '#/components/schemas/FileMode'
                purpose:
                  type: string
                  maxLength: 200
                  description: >-
                    Free-text hint for the agent. A client may show
                    it wherever it lists the file.
                  examples:
                    - Amendment text, quotes must stay word for word
              additionalProperties: false
            encoding:
              file:
                contentType: >-
                  application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document,
                  text/markdown, text/plain, text/html, application/json, text/csv,
                  image/png, image/jpeg, image/webp, application/zip
            examples:
              s1_pdf:
                summary: S1 - the update PDF from the legal team, verbatim
                value:
                  file: <binary content of neue-nutzungsbedingungen-ab-q3.pdf>
                  mode: verbatim
                  purpose: Amendment text, quotes must stay word for word
      responses:
        '201':
          description: Stored.
