{{- if .Values.cms.preUpgrade.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cms.fullname" . }}-pre-upgrade-config
  labels:
    {{- include "cms.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  preUpgrade.sh: |-
{{- $preUpgradeFile := .Files.Get "scripts/preUpgrade.sh" | indent 6 }}
{{- if .Values.cms.preUpgrade.script }}
{{ tpl .Values.cms.preUpgrade.script . | indent 6 }}
{{- else }}
{{ tpl $preUpgradeFile . }}
{{- end }}
{{- end }}
