          size: 14702
          kind: artifact

    # ------------------------------------------------------- user message parts

    UserPartType:
      type: string
      title: UserPartType
      description: |
        The part types a **client** may send on `POST /sessions/{session_id}/messages`,
        and that a user message carries back in the history.

        Unlike `PartType`, this registry is **closed**. A part whose `type` is not a
        member of it is rejected with `422` and `genaix_code: validation_failed`. The
        permissive `UnknownPart` fallback is an output rule only: on output an unknown
        part costs a client some presentation, on input it would silently drop something
        the user said.
      enum:
        - text
        - verbatim
        - reference
        - file_ref
        - setting
        - filter

    UserMessagePart:
      title: UserMessagePart
      description: |
        One element of a user message, in the order the user composed it. `parts` is the
        **canonical** structure of a user message: `content` is their plain rendering,
        `references` is derived from the `reference` parts and `files` from the
        `file_ref` parts.

        `type` discriminates, and this `oneOf` is **exhaustive**: an unknown `type` is a
        `422`, never a silently accepted extra. That is the deliberate asymmetry with
        `MessagePart`, which is open-ended because a client must keep rendering a stream
        it does not fully understand.

        Each schema below states how the part renders into `content` and what GenAIx does
        with it; the full rendering table is on the `postMessage` operation.
      oneOf:
        - $ref: '#/components/schemas/UserTextPart'
        - $ref: '#/components/schemas/UserVerbatimPart'
        - $ref: '#/components/schemas/UserReferencePart'
        - $ref: '#/components/schemas/UserFileRefPart'
        - $ref: '#/components/schemas/UserSettingPart'
        - $ref: '#/components/schemas/UserFilterPart'
      x-part-type-registry:
        $ref: '#/components/schemas/UserPartType'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/UserTextPart'
          verbatim: '#/components/schemas/UserVerbatimPart'
          reference: '#/components/schemas/UserReferencePart'
          file_ref: '#/components/schemas/UserFileRefPart'
          setting: '#/components/schemas/UserSettingPart'
          filter: '#/components/schemas/UserFilterPart'

    UserTextPart:
      type: object
      title: UserTextPart
      description: >-
        Plain text the user typed. It is the glue between the other parts and carries the
        spacing around them, because parts are concatenated with nothing inserted between
        them. Renders as the text itself, with `[` and `]` escaped.
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
          maxLength: 32000
      additionalProperties: false
      examples:
        - type: text
          text: 'Create a landing page in '

    UserVerbatimPart:
      type: object
      title: UserVerbatimPart
      description: |
        Text that must appear **character-identical** in the produced content. GenAIx
        hashes it and feeds the hash to the `verbatim_identical` quality gate, which
        compares it against what ended up in the CMS and publishes the outcome as a
        `Check` carrying `verification` with `unit: chars`.

        `source` says where the text came from.

        - `user`: the user typed or pasted it. The text is hashed as it stands.
        - a session file id: the text is a **passage quoted out of that upload**. GenAIx
          checks that it really occurs in the file's extracted text, rejecting the part
          with `422` if it does not, and then hashes it exactly as it hashes user-typed
          verbatim. This works whatever the file's own `mode`, so a passage of a `source`
          file can be locked without locking the whole document.

        Locking a whole upload instead is a `file_ref` part with `mode: verbatim`, or
        `mode: verbatim` at upload time; that path hashes the extracted text block by
        block and reports `unit: blocks`.

        Renders as the text itself, with `[` and `]` escaped, so a quote reads naturally
        in `content` and the lock lives in the part rather than in character offsets.
      required: [type, text, source]
      properties:
        type:
          type: string
          const: verbatim
        text:
          type: string
          maxLength: 32000
        source:
          type: string
          maxLength: 64
          description: >-
            `user` for text the user supplied directly, or the UUID of the session file
            the text was taken from.
          examples:
            - user
            - 6b0d9e31-44a8-4c57-9f2e-8d1a3c7b5e02
        label:
          type: string
          maxLength: 200
          description: What this quote is, for the check message and the audit trail.
      additionalProperties: false
      examples:
        - type: verbatim
          text: This is our Landingpage
          source: user
          label: Page title

    UserReferencePart:
      type: object
      title: UserReferencePart
      description: |
        A typed pointer the user placed in the message: an at-mention, a pick from a
        content tree, an attached guideline. GenAIx resolves it through the session's MCP
        connection and injects the resolved object into the run's context, so the agent
        reads the object rather than its name.

        Renders as `@[label]`, taking `ref.label` when present and the resolved object's
        name otherwise.
      required: [type, ref]
      properties:
        type:
          type: string
          const: reference
        ref:
          $ref: '#/components/schemas/ContextReference'
      additionalProperties: false
      examples:
        - type: reference
          ref:
            type: folder
            id: '4021'
            node_id: 3
            label: Campaigns

    UserFileRefPart:
      type: object
      title: UserFileRefPart
      description: |
        A session file the user attached to this message, uploaded beforehand with
        `POST /sessions/{session_id}/files`.

        `mode` says how its wording is treated, and it is the same choice as on the
        upload. `verbatim` locks the whole file: GenAIx extracts its text, splits it into
        blocks and hashes each one, and the `verbatim_identical` gate verifies that every
        block the agent reused appears unchanged in the produced CMS content, reporting a
        `Check` with `verification.unit: blocks`. `source` makes the file reference
        material the agent may read, summarise and paraphrase. To lock one passage of a
        `source` file rather than the whole of it, send a `verbatim` part with that file's
        id as its `source`.

        A PDF, a Word document and an HTML page are all verbatim-capable: extraction runs
        in GenAIx before the agent sees anything, so the model never receives raw binary
        and the hashes come from the same extracted text the gate compares against.

        Renders as `[[file name]]`, using the name GenAIx holds for that file rather than
        one the client supplies, with `[` and `]` in the name escaped.
      required: [type, file_id]
      properties:
        type:
          type: string
          const: file_ref
        file_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [source, verbatim]
          default: source
          description: >-
            Overrides the mode the file was uploaded with, for this message. Defaults to
            the file's own mode.
      additionalProperties: false
      examples:
        - type: file_ref
          file_id: 6b0d9e31-44a8-4c57-9f2e-8d1a3c7b5e02
          mode: verbatim

    UserSettingPart:
      type: object
      title: UserSettingPart
      description: |
        One constraint the user set for this request: the target folder, the language, the
        template, a publication date. A setting overrides or fills the session `context`
        for this run and is reflected in the run's `derived_settings`, where the field it
        set is listed in `corrected_by_user`, so the agent stops re-deriving what the user
        already decided.

        `key` names what is being set, `value` is the machine value as the CMS expresses
        it, and `label` is the wording the user saw. Renders as `#[key: value]`, with `[`
        and `]` in either escaped.
      required: [type, key, value]
      properties:
        type:
          type: string
          const: setting
        key:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: >-
            The setting name. `node`, `folder`, `template`, `language` and `publish_at`
            map onto `SessionContext` and `DerivedSettings`; any other key is carried as a
            constraint for the agent and echoed back unchanged.
          examples:
            - language
        value:
          type: string
          maxLength: 512
          description: >-
            The machine value, as a string whatever its domain: a CMS id, a language code,
            a timestamp, `true`.
          examples:
            - de
        label:
          type: string
          maxLength: 200
          description: The wording the user saw, for display and for the audit trail.
          examples:
            - German
      additionalProperties: false
      examples:
        - type: setting
          key: language
          value: de
          label: German

    UserFilterPart:
      type: object
      title: UserFilterPart
      description: |
        A structured selection the user made to narrow a search: a node, a folder subtree,
        a language set, a date range, an online flag. GenAIx passes `criteria` into the
        search tool inputs of the run rather than asking the model to re-infer them from
        prose, which is what makes a research answer reproducible.

        `criteria` is an open object whose keys are the search tool's own input fields,
        **in the tool's own spelling** (since `1.0.0-rc.2`): camelCase as `mcp/tools.json`
        declares them, list-typed inputs as lists (`folderId: [4021]`), and a date filter
        such as `filters.editedAfter` as the Unix seconds the tool takes. A key the
        connected server does not know is dropped, and what was actually searched comes
        back in `query_used` on the tool result and in the `api_call_log` part.

        Renders as `#[label]`, with `[` and `]` in the label escaped.
      required: [type, label, criteria]
      properties:
        type:
          type: string
          const: filter
        label:
          type: string
          maxLength: 200
          description: The wording the user saw, and the plain rendering of this part.
        criteria:
          type: object
          description: Search criteria, keyed by the search tool's input fields.
          additionalProperties: true
      additionalProperties: false
      examples:
        - type: filter
          label: Campaign pages, edited this year
          criteria:
            types: [page]
            folderId: [4021]
            recursive: true
            filters:
              editedAfter: 1767225600

    # -------------------------------------------------------- workflow view

    Workflow:
      type: object
      title: Workflow
      description: |
        One workflow **module** of the GenAIx harness. A module is a directory discovered at
        startup (`workflows/<id>/`) holding a manifest, prompts, agent skills, quality gate
        definitions and fixture tests. This schema is the manifest metadata a client needs:
        what the workflow is for, what it needs in order to run, the steps it will report,
        and the quality gates that will be enforced.

        Modules are **versioned**. `version` is recorded on every session as
        `workflow_version`, so a session keeps reporting against the module revision it
        started under even after the installation upgrades.

        The manifest format itself is specified outside this document, in
        `schemas/workflow-manifest.schema.json` and `08-workflow-modules.md`. This schema is
        the subset the API publishes; the manifest carries more, such as prompt and skill
        paths and gate implementation details, which no client needs.
      required: [id, version, title, description, roles, steps_template]
      properties:
        id:
          type: string
          examples:
            - content_create
        version:
          type: string
          description: >-
            Module version from the manifest, semantic versioning. Recorded on the session
            as `workflow_version`.
          examples:
            - 1.2.0
        title:
          type: string
        description:
          type: string
        scenario:
          type: [string, 'null']
          description: The showcase scenario this workflow implements.
          enum: [S1, S2, S3, S4, null]
        roles:
          type: array
          description: >-
            CMP roles the workflow is meant for. Informational: the CMS enforces
            authorization, this list is only a hint for clients.
          items:
            type: string
            enum: [content_creator, chief_content_creator, cmp_administrator, template_designer]
        optional:
          type: boolean
          default: false
          description: >-
            `true` for workflows that are not acceptance criteria in Phase One,
            currently only `admin_user`.
        steps_template:
          type: array
          description: >-
            The steps a client may show before the agent has reported
            anything. Step ids match the `Step.id` values the agent then
            reports.
          items:
            $ref: '#/components/schemas/StepTemplate'
        produces:
          type: array
          description: Kinds of object a successful run of this workflow yields.
          items:
            type: string
            enum: [page, construct, report, user, file, none]
        inputs_schema:
          type: object
          description: >-
            JSON Schema (draft 2020-12) for what this module needs beyond a prompt, for
            instance a required folder or an uploaded source document. A client may render
            it as a start form; `POST /sessions` still takes the generic `context`, and the
            harness validates the assembled inputs against this schema when the first
            message starts a run.
          additionalProperties: true
        required_connectors:
          type: array
          description: |
            The connector **types** this module needs, as objects rather than bare strings so
            a type can be declared optional. Same shape as `required_connectors` in
            `schemas/workflow-manifest.schema.json`, which is where the module declares it.

            A session **binds one connection per required type**: the connections named in
            `context.connection_ids`, and otherwise the user's `default` connection of that
            type. A type marked `optional: true` is used when an authorized connection exists
            and skipped when it does not, so the workflow still runs; a type that is not
            optional must be covered by an authorized connection or the workflow is absent
            from `capabilities.workflows`. This is the inverse of
            `McpConnector.required_by_workflows`.
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                pattern: '^[a-z][a-z0-9_]{1,31}$'
                description: A connector type from `GET /mcp/connectors`.
                examples:
                  - cms
              optional:
                type: boolean
                default: false
                description: >-
                  `true` means the module runs with or without an authorized connection of
                  this type, so it never narrows `capabilities.workflows`.
            additionalProperties: false
          examples:
            - - type: cms
                optional: false
        tool_groups:
          type: object
          description: |
            The allowlist of tool groups this module may use, **keyed by connector type**,
            plus the reserved key `genaix` for the in-process harness server. Same shape as
            `tool_groups` in `schemas/workflow-manifest.schema.json`.

            Every key is either a `type` of `required_connectors` or `genaix`. The harness
            enforces the allowlist, so a module cannot reach a tool its manifest does not
            declare even when the user's CMS permissions would allow it. Keying by connector
            type is what makes that enforceable when a session binds several connections: the
            groups allowed on a `cms` connection say nothing about any other connector.
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              type: string
            description: Tool group names the module may use on connections of this type.
          examples:
            - cms: [identity, search, content_read, content_write]
              genaix: [harness]
        quality_gates:
          type: array
          description: >-
            Gates the harness runs for this workflow. Declared here so a client can show
            what will be checked before anything has run.
          items:
            $ref: '#/components/schemas/QualityGate'
        models:
          type: array
          description: Model ids this module is validated against, in preference order.
          items:
            type: string
        available:
          type: boolean
          description: >-
            Whether the calling user may start this module right now. The same decision that
            puts the id into `capabilities.workflows` in `GET /me`, repeated here so a client
            that renders the catalogue can grey out what it cannot offer rather than hiding
            it.
        reason:
          type: string
          description: >-
            Why `available` is false, safe to show to the end user. For example a required
            MCP server that is not authorized, or a role the user does not hold.
          examples:
            - The cms server is not authorized for you yet.
      additionalProperties: false

    StepTemplate:
      type: object
      title: StepTemplate
      description: >-
        One step of a module's rail as the manifest declares it, before anything has run.
        Since `1.0.0-rc.2` a step may carry `substeps`, the nested steps the agent reports
        with `parent_step_id`; a client that renders the rail up front can show them from
        the catalogue instead of waiting for the first `step.updated`.
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        substeps:
          type: array
          description: Nested steps, reported later with `Step.parent_step_id` set to this id.
          items:
            $ref: '#/components/schemas/StepTemplate'
      additionalProperties: false

    QualityGate:
      type: object
      title: QualityGate
      description: |
        A check the **harness** runs, not something the model reports about itself. This
        distinction is the point of gates: a model claiming "the quotation is identical" is
        not evidence, a hash comparison is.

        Gate results are published as `Check` objects through `check.updated`, with
        `source.type: gate`, the `gate_id`, the gate `kind` and the `evidence` the gate
        produced. A blocking gate that has not passed stops `release`, `publish` and
        `request_review` with `409` and `genaix_code: quality_gate_failed`.
      required: [id, label, kind, blocking, when]
      properties:
        id:
          type: string
          examples:
            - verbatim-hash
        label:
          type: string
        kind:
          type: string
          description: |
            - `script`: deterministic code. A Handlebars compile, a verbatim hash
              comparison, a link check, a JSON Schema validation, a "page exists and is
              still unpublished" check. The only kind whose verdict needs no interpretation.
            - `subagent`: a separate reviewer agent with its own prompt and read-only tools
              that returns a structured verdict.
            - `prompt`: a model self-check. **Advisory only and never blocking**, because a
              model is not a witness to its own output.
            - `human`: explicit approval, raised as an `interaction.requested` of kind
              `confirm`.
          enum: [script, subagent, prompt, human]
        blocking:
          type: boolean
          description: >-
            Whether a non-passing result stops the transition. Always `false` for
            `kind: prompt`.
        when:
          type: string
          description: >-
            When the harness runs the gate: at the end of the step that produces what it
            inspects, or immediately before a transition. A gate may have several triggers;
            `when` and `step_id` carry the **first** one and `triggers` all of them.
          enum: [step_end, before_release, before_publish]
        description:
          type: string
        step_id:
          type: string
          description: >-
            The step this gate belongs to, for a gate with `when` equal to `step_end`. When
            the gate is bound to several steps this is the first; see `triggers`.
        triggers:
          type: array
          description: |
            Every trigger of the gate, since `1.0.0-rc.2`. A manifest may bind one gate to
            several steps and to a transition (`when: [step_end, before_release]`,
            `steps: [st-5, st-6]`); `when` / `step_id` alone cannot say so. Each item is one
            `when`, with the steps it applies to when `when` is `step_end`. A client that
            reads only `when` and `step_id` sees the first trigger and stays correct for a
            single-trigger gate.
          minItems: 1
          items:
            type: object
            required: [when]
            properties:
              when:
                type: string
                enum: [step_end, before_release, before_publish]
              step_ids:
                type: array
                minItems: 1
                items:
                  type: string
                description: >-
                  The steps, for a `step_end` trigger; absent for a transition trigger.
            additionalProperties: false
          examples:
            - - when: step_end
                step_ids: [st-5, st-6]
              - when: before_release
        timeout_seconds:
          type: integer
          minimum: 1
      additionalProperties: false

    GateResult:
      type: object
      title: GateResult
      description: |
        What happened to one quality gate in this session. The declaration lives in
        `Workflow.quality_gates`; this is the execution record.

        `status` is the execution outcome and `verdict` the judgement, and they deliberately
        differ: a gate configured to downgrade its own errors ends as `status: error` with
        `verdict: error` and a non-blocking `warn` check, rather than pretending to have
        passed.

        The full verdict a gate produces, including findings with `expected` and `actual`,
        metrics and a verification block, is specified in
        `schemas/gate-verdict.schema.json`. One verdict shape serves all four gate kinds.
        What reaches a client is the `Check` objects named in `check_ids` plus, for a
        `script` gate, the evidence file. A `subagent` gate's own activity, the reviewer's
        tool calls, never appears on the session stream: a client sees the `check.updated`
        and the `artifact.created` of the evidence file, whose `trace` holds every call the
        reviewer made (since `1.0.0-rc.2`).
      required: [gate_id, label, kind, blocking, when, status, attempt, check_ids]
      properties:
        gate_id:
          type: string
          description: Matches a `QualityGate.id` of the session's workflow module.
          examples:
            - verbatim_identical
        label:
          type: string
        kind:
          type: string
          enum: [script, subagent, prompt, human]
        blocking:
          type: boolean
        when:
          type: string
          enum: [step_end, before_release, before_publish]
        step_id:
          type: string
          description: >-
            The step that triggered this run of the gate, for a `step_end` gate.
        status:
          type: string
          description: >-
            Execution outcome. `pending` means the gate has not been reached yet, `skipped`
            that it did not apply, `error` that the gate itself failed to execute, which
            counts as not passing while it is blocking.
          enum: [pending, running, passed, failed, skipped, error]
        verdict:
          type: string
          description: >-
            The gate's judgement, absent until it has run. `warn` is a finding that does not
            fail the gate.
          enum: [pass, warn, fail, error]
        attempt:
          type: integer
          minimum: 0
          description: >-
            How many times this gate has run in this session, retries of an infrastructure
            failure included (since `1.0.0-rc.2`: every execution counts, the evidence file
            is written per execution as `gates/<gate>-<attempt>.json`, and the workflow view
            keeps the latest record per gate). A gate re-runs after the agent fixes what it
            reported, so a client can show "failed, then passed on the second attempt".
            0 while `status` is `pending`.
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        check_ids:
          type: array
          description: >-
            The `Check` objects this gate published, which is where the human-readable
            finding and the evidence live. Exactly one per execution (`chk-<gate id>`, the
            gate id with `_` as `-`), its findings folded into the check's `message`; the
            id is stable across attempts, so the check is replaced, not accumulated (since
            `1.0.0-rc.2`).
          items:
            type: string
        evidence_file_id:
          type: string
          format: uuid
          description: >-
            Session file holding the gate's raw evidence, with
            `artifact_type: gate_evidence`. Present for `script` and `subagent` gates, and
            the reason a script verdict can be re-derived rather than trusted.
        acknowledged_by:
          type: string
          description: >-
            The subject (the `X-GCMS-Subject` value) that accepted a non-blocking failure
            through `acknowledge_checks` on a transition. Never a login or user id.
        run_id:
          type: string
          format: uuid
          description: The run during which the gate last executed.
      additionalProperties: false
    WorkflowState:
      type: object
      title: WorkflowState
      description: >-
        The complete workflow state of a session. The snapshot counterpart of
        the `plan.updated`, `step.updated`, `check.updated`,
        `approval_chain.updated` and `derived_settings.updated` events.
      required: [workflow, state, plan, steps, checks, gates, approval_chain, cms_objects]
      properties:
        workflow:
          type: string
        workflow_version:
          type: string
          description: The module version this session runs under.
        workflow_version_drift:
          type: boolean
          description: >-
            `true` when the installation now has a different version of this module than the
            session started under. The session keeps running under its own version; this only
            tells a client that a newer one exists, which matters when a gate definition
            changed.
        state:
          type: string
          description: |
            Coarse phase of the workflow, derived from the session status and the run and
            step states, never stored. A one-word summary of where the session stands. The
            derivation, in order of precedence (since `1.0.0-rc.2`):

            | Condition | `state` |
            |---|---|
            | session `discarded` or `archived` | `discarded` |
            | session `published` | `done` |
            | session `released` or `review_requested` | `awaiting_approval` |
            | session `waiting_for_input` | `awaiting_feedback` |
            | a run is active and no plan exists yet | `planning` |
            | a run is active and a plan exists | `executing` |
            | no run has happened yet | `not_started` |
            | the last run `failed` | `failed` |
            | otherwise (the last run completed, the agent waits for the user) | `awaiting_feedback` |

            `awaiting_feedback` therefore means "the agent has finished its turn and waits for
            the user", not "executing".
          enum:
            - not_started
            - planning
            - executing
            - awaiting_feedback
            - awaiting_approval
            - done
            - failed
            - discarded
        updated_at:
          type: string
          format: date-time
        plan:
          oneOf:
            - $ref: '#/components/schemas/Plan'
            - type: 'null'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
        gates:
          type: array
          description: >-
            One entry per quality gate the workflow module declares, in manifest order,
            with what happened to it in this session. A client can render the gate list
            before anything has run, because every declared gate appears here with
            `status: pending`.
          items:
            $ref: '#/components/schemas/GateResult'
        approval_chain:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStep'
        derived_settings:
          oneOf:
            - $ref: '#/components/schemas/DerivedSettings'
            - type: 'null'
          description: >-
            `null` for workflows that write nothing: a module whose `produces` is empty or
            holds only `report`, such as `content_research`. Any other module carries the
            card from the start, empty until the run fills it.
        cms_objects:
          type: array
          items:
            $ref: '#/components/schemas/CmsObjectRef'
        preview:
          oneOf:
            - $ref: '#/components/schemas/Preview'
            - type: 'null'
        pending_interaction:
          oneOf:
            - $ref: '#/components/schemas/Interaction'
            - type: 'null'
          description: >-
            The interaction the run is currently blocked on, so a reconnecting client can
            re-render the question without replaying the stream.
        authorizations:
          type: array
          description: >-
            The session's authorizations for the connections this module requires, so one
            snapshot call says whether the session can still act. A reconnecting client that
            finds an entry `expired` or `invalid`, or a required connection missing
            entirely, registers a fresh credential before sending the next message instead
            of waiting for the run to fail.
          items:
            $ref: '#/components/schemas/SessionAuthorizationSummary'
      additionalProperties: false

    Plan:
      type: object
      title: Plan
      description: >-
        The visible work plan. Versioned: every change increments `version` and emits
        `plan.updated` with the whole plan, so clients never merge deltas.
      required: [version, summary, items]
      properties:
        version:
          type: integer
          minimum: 1
        summary:
          type: string
          description: One or two sentences the user can approve or correct.
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanItem'
        created_at:
          type: string
          format: date-time
        reason:
          type: string
          description: Why the plan changed, for versions after the first.
      additionalProperties: false

    PlanItem:
      type: object
      title: PlanItem
      required: [id, label, kind, status]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [create, update, link, translate, publish, construct, report, other]
        target:
          $ref: '#/components/schemas/ContextReference'
        status:
          type: string
          enum: [pending, running, done, skipped, failed]
        detail:
          type: string
      additionalProperties: false

    Step:
      type: object
      title: Step
      description: >-
        One step of the workflow. Always sent as a full object, so
        `step.updated` is idempotent and order-independent beyond the `seq`
        ordering.
      required: [id, label, status]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [pending, running, done, skipped, failed, waiting]
          description: >-
            `waiting` means the step is blocked on a user interaction, not on the model.
        detail:
          type: string
          description: One short line of evidence, shown under the label.
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        substeps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
          default: []
        tool_calls:
          type: integer
          minimum: 0
          description: How many MCP tool calls this step made, for transparency.
        error:
          $ref: '#/components/schemas/Problem'
      additionalProperties: false

    Check:
      type: object
      title: Check
      description: >-
        One quality, guideline or requirement finding. Blocking is a per-check property,
        not a property of the severity: a `fail` may be advisory and a `warn` may block,
        depending on where the rule comes from.
      required: [id, label, severity, blocking, message, source]
      properties:
        id:
          type: string
        label:
          type: string
        severity:
          type: string
          enum: [pass, info, warn, fail]
        blocking:
          type: boolean
          description: |
            `true` means release or publish is refused while this check stands. For a
            gate-sourced check (since `1.0.0-rc.2`): `blocking` is the manifest's `blocking`
            flag **and** the verdict is `fail`. A blocking gate that answers `warn` yields a
            non-blocking `warn` check, acknowledgeable like any other, so a session is never
            stuck behind a warning it cannot fix and cannot accept. A `prompt` gate's check
            and an agent self-report are never blocking. Every gate execution yields exactly
            one check (`chk-<gate id>`), its findings folded into `message`.
        message:
          type: string
        source:
          type: object
          required: [type]
          properties:
            type:
              type: string
              description: >-
                `gate` means a quality gate of the workflow module produced this check, and
                `gate_id` names it. The others are the agent's own findings against a
                guideline, an explicit requirement, or a system rule, reported through
                `report_check`; such a self-report carries `kind: prompt` and `blocking:
                false` so a client can tell it from a gate verdict.
              enum: [guideline, requirement, system, gate]
            id:
              type: string
            label:
              type: string
          additionalProperties: false
        suggested_actions:
          type: array
          description: >-
            Offered fixes. `prompt` is what a client sends as a normal user
            message when the user picks the action.
          items:
            type: object
            required: [label, prompt]
            properties:
              label:
                type: string
              prompt:
                type: string
            additionalProperties: false
        verification:
          $ref: '#/components/schemas/Verification'
        target:
          $ref: '#/components/schemas/ContextReference'
        gate_id:
          type: string
          description: >-
            The quality gate that produced this check, present when `source.type` is
            `gate`. Matches a `QualityGate.id` of the session's workflow module.
        kind:
          type: string
          description: >-
            The gate kind that produced it, present when `source.type` is `gate`, and
            `prompt` for an agent self-report (`source.type` other than `gate`). A client may
            weigh a `script` verdict differently from a `prompt` self-check, and a `prompt`
            check is never blocking.
          enum: [script, subagent, prompt, human]
        evidence:
          type: object
          description: |
            What the gate actually observed: script metrics, a reviewer sub-agent's verdict
            summary, the hashes compared. Shaped per gate, following the `metrics` and
            `findings` vocabulary of `schemas/gate-verdict.schema.json`, and the reason a
            gate result can be audited rather than taken on trust.

            Since `1.0.0-rc.2` the shape is fixed as the gate's own evidence object (its
            gate-specific keys, such as `unit`, `source_sha256`, `images_without_alt`) with
            the inline subset `gate_id`, `kind`, `verdict`, `summary`, `metrics`,
            `finding_count`, `evidence_file_id` and `duration_ms` laid on top; a key present
            in both is the subset's. The full record is the evidence artifact
            (`artifact_type: gate_evidence`) named by `evidence_file_id`.
          additionalProperties: true
        acknowledged_by:
          type: string
          description: >-
            The subject (the `X-GCMS-Subject` value) that accepted this non-blocking failing
            check through `acknowledge_checks` on a transition. Never a login or user id, and
            never set on a blocking check, which cannot be acknowledged.
        acknowledged_at:
          type: string
          format: date-time
        checked_at:
          type: string
          format: date-time
      additionalProperties: false

    Verification:
      type: object
      title: Verification
      description: |
        Proof that locked content was reproduced exactly. `identical` is the single
        boolean that says whether the lock held; `matched_units` and `total_units`
        explain it.

        `unit` says what was counted:

        - `chars` - a passage locked by a `verbatim` part, whether the user typed it or
          quoted it out of an upload with `source: <file id>`. Counted in characters of
          that passage and proven by hashing it against the text that reached the CMS.
        - `blocks` - blocks of extracted text. This is what a whole locked upload produces
          (`mode: verbatim` on the file or on its `file_ref` part): GenAIx splits the
          extracted text into blocks, hashes each one, and the gate verifies every reused
          block appears unchanged. It is also the unit for a `page_structure` block
          carrying `verbatim: true`.
        - `files` - a whole file reused as a file, compared by the `sha256` of its bytes.

        Extraction is a GenAIx step, not a model step: a PDF, a Word document or an HTML
        page becomes text before the agent sees it, so the model never handles raw binary
        and the hashes on both sides come from the same extracted text.
      required: [locked, matched_units, total_units, unit, identical]
      properties:
        locked:
          type: boolean
          description: Whether this content was declared verbatim in the first place.
        matched_units:
          type: integer
          minimum: 0
        total_units:
          type: integer
          minimum: 0
        unit:
          type: string
          enum: [chars, blocks, files]
        identical:
          type: boolean
        source_ref:
          $ref: '#/components/schemas/ContextReference'
        target_ref:
          $ref: '#/components/schemas/ContextReference'
        source_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash of the normalised source text or of the whole source file.
        target_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        deviations:
          type: array
          description: Present when `identical` is false. At most 20 entries.
          items:
            type: object
            required: [at, expected, actual]
            properties:
              at:
                type: integer
                description: Offset in units where the first difference occurs.
              expected:
                type: string
              actual:
                type: string
            additionalProperties: false
        checked_at:
          type: string
          format: date-time
      additionalProperties: false

    ApprovalStep:
      type: object
      title: ApprovalStep
      description: |
        One link of the approval chain, resolved server-side from the user's CMS
        permissions on the target folder. This is what lets a client state whether
        publishing is direct or goes to review, and why, instead of relaying a flat message.

        The chain is resolved twice (since `1.0.0-rc.2`): during a run, from the permission
        read on the target folder right after the page is created, and again at the
        `publish` / `request_review` transition, once more with the outcome. A module that
        produces no page emits no chain.
      required: [id, label, actor, status]
      properties:
        id:
          type: string
        label:
          type: string
        actor:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [user, group, workflow, system]
            id:
              type: string
              description: >-
                The CMS id of a `group` actor, taken from the publish answer or the
                permission read. Never set for a `user` actor: GenAIx does not expose the
                identity behind a subject, so the acting user is `{type: user}` without id
                or label (since `1.0.0-rc.2`).
            label:
              type: string
              description: >-
                Display name of a `group` actor (the approving group's name from the CMS),
                or a generic label such as "CMS approvers" before the group is known.
          additionalProperties: false
        status:
          type: string
          enum: [pending, done, not_required, rejected]
        reason:
          type: string
          description: Why this step applies, or why it is not required.
        at:
          type: string
          format: date-time
      additionalProperties: false

    DerivedSettings:
      type: object
      title: DerivedSettings
      description: |
        What the agent decided about where and how the content is created, and which
        permission it relied on. Every field is correctable: the user may override any of it
        through `PATCH /sessions/{id}` with a new `context`, and `corrected_by_user` records
        which fields they changed or confirmed, so the agent stops re-deriving them.

        **An inferred setting never governs a write on its own.** `node`, `folder`,
        `template`, `language` and `publish_at` are write-governing: before the first tool
        call that writes to the CMS, each of them the run uses must come from a `setting`
        part the user sent, from the session `context`, or from a `settings_review`
        interaction the user answered. A value GenAIx read out of the user's prose is a
        proposal until then. Read and search tools may run before the review, and any other
        setting key is advisory and never blocks.

        **When the review is raised.** At most one `settings_review` per run, batched, and
        only when at least one write-governing setting was inferred from the text
        (`source: text`) or is missing. A setting that came from a chip, from the session
        context, or that is already listed in `corrected_by_user` is not asked again: it may
        appear in `proposed` with `source: context` for completeness, but it does not by
        itself cause a review, and if everything is covered no review is raised at all. On
        resolution every confirmed key is listed here in `corrected_by_user`.

        **Which keys a run needs** (since `1.0.0-rc.2`): for a module that produces a page
        (`produces` contains `page`), `folder`, `template` and `language` are required before
        the first write and appear in `missing` when they cannot be derived; `node` follows
        from the folder and `publish_at` matters only for `publish`, so both are reviewed
        only when they were read out of the text. A module that produces no page needs none
        of them. `proposed[].source: default` names an installation default; no such
        default exists in Phase One, so the value is never produced and a client need not
        handle it.

        **A confirmed review becomes the session context**: on resolution `Session.context`
        carries the confirmed `folder_id`, `template_id`, `language` and `publish_at`
        (`session.updated` lists `context` in `changed`), so the next run starts from the
        user's decision. The other way round, a `PATCH` of `context` lists the changed keys
        here in `corrected_by_user`.
      properties:
        folder:
          $ref: '#/components/schemas/ContextReference'
        template:
          $ref: '#/components/schemas/ContextReference'
        language:
          type: string
        publish_at:
          type: string
          format: date-time
          description: >-
            When the page is to be published, once the user stated or confirmed it. Since
            `1.0.0-rc.2`; a write-governing setting like the others.
        filename:
          type: string
        url:
          type: string
          description: The path the page will have once published.
        permission_used:
          type: string
          description: >-
            Human-readable statement of the CMS permission the write relied on, for the
            audit trail.
        guidelines_applied:
          type: array
          items:
            type: string
        corrected_by_user:
          type: array
          description: Names of the fields the user overrode.
          items:
            type: string
        node:
          $ref: '#/components/schemas/ContextReference'
      additionalProperties: false

    Preview:
      type: object
      title: Preview
      description: >-
        The CMS preview of the object the session produced. Pages only in Phase One;
        preview is rendered by the CMS, so preview equals production.
      required: [cms_ref, preview_url, mode]
      properties:
        cms_ref:
          $ref: '#/components/schemas/CmsObjectRef'
        preview_url:
          type: string
          format: uri
          description: >-
            URL of the CMS preview. It is authenticated by the user's own
            CMS session, so a client that embeds it must be same-site with
            the CMS.
        mode:
          type: string
          enum: [edit, view]
        changed_elements:
          type: array
          description: Tag keywords that changed since the previous preview.
          items:
            type: string
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    # ----------------------------------------------------------- interactions

    InteractionKind:
      type: string
      title: InteractionKind
      enum: [ask_user, choice, confirm, form, settings_review]

    Interaction:
      type: object
      title: Interaction
      description: |
        A question the agent needs answered before it can continue. The run sits in
        `waiting_for_input` and the session in `waiting_for_input` until it is resolved,
        timed out or cancelled.

        `prompt` is always the human sentence. `kind` selects the fields that carry the
        question: `options` and `multi` for `choice`, `schema` for `form`, `proposed` and
        `missing` for `settings_review`.
      required: [id, kind, prompt, blocking, requested_at, expires_at, status]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/InteractionKind'
        prompt:
          type: string
        options:
          type: array
          description: Present for `choice`.
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
              description:
                type: string
              ref:
                $ref: '#/components/schemas/ContextReference'
            additionalProperties: false
        multi:
          type: boolean
          default: false
          description: 'For `choice`: whether several options may be selected.'
        schema:
          type: object
          description: >-
            For kind `form`, a JSON Schema (draft 2020-12) the `values` object must
            validate against. Keep it flat: one property is one answer field.
          additionalProperties: true
        proposed:
          type: array
          description: >-
            For `settings_review`: the settings GenAIx derived for this run, each with where
            the value came from, so the user can see what was assumed and on what grounds.
            A client renders them as prefilled, editable chips.
          items:
            type: object
            required: [key, value, label, source]
            properties:
              key:
                type: string
                maxLength: 64
                pattern: '^[a-z][a-z0-9_]{0,63}$'
                description: The setting name, exactly as in `UserSettingPart.key`.
              value:
                type: string
                maxLength: 512
                description: The machine value, exactly as in `UserSettingPart.value`.
              label:
                type: string
                maxLength: 200
                description: The wording to show, exactly as in `UserSettingPart.label`.
              source:
                type: string
                enum: [text, context, default]
                description: >-
                  Where the value came from. `text` means GenAIx inferred it from the user's
                  own words, `context` that it was taken from the session context, `default`
                  that it is the installation default.
              evidence:
                type: string
                maxLength: 500
                description: >-
                  The quoted fragment of the user's text the inference rests on. Present
                  only for `source: text`.
              options:
                type: array
                description: >-
                  The alternatives, when a choice exists - two templates that both fit, for
                  example. The proposed `value` is one of them.
                items:
                  type: object
                  required: [value, label]
                  properties:
                    value:
                      type: string
                      maxLength: 512
                    label:
                      type: string
                      maxLength: 200
                    ref:
                      $ref: '#/components/schemas/ContextReference'
                  additionalProperties: false
            additionalProperties: false
        missing:
          type: array
          description: >-
            For `settings_review`: the settings this run needs, could not derive, and asks
            the user to provide. A client renders them as empty chips waiting for a value.
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
                maxLength: 64
                pattern: '^[a-z][a-z0-9_]{0,63}$'
                description: The setting name, exactly as in `UserSettingPart.key`.
              label:
                type: string
                maxLength: 200
                description: The wording to show for the setting itself.
              options:
                type: array
                description: The values to choose from, when the set of them is known.
                items:
                  type: object
                  required: [value, label]
                  properties:
                    value:
                      type: string
                      maxLength: 512
                    label:
                      type: string
                      maxLength: 200
                    ref:
                      $ref: '#/components/schemas/ContextReference'
                  additionalProperties: false
            additionalProperties: false
        expires_at:
          type: string
          format: date-time
          description: Default 10 minutes after `requested_at`, configurable per interaction.
        requested_at:
          type: string
          format: date-time
        blocking:
          type: boolean
          const: true
          description: >-
            Always `true` in v1: every interaction blocks its run. Reserved so that
            non-blocking nudges can be added later without a new shape.
        status:
          type: string
          enum: [pending, answered, expired, cancelled]
        answer:
          $ref: '#/components/schemas/InteractionAnswer'
        answered_at:
          type: string
          format: date-time
        answered_by:
          type: string
          enum: [user, timeout, cancel]
        run_id:
          type: string
          format: uuid
        step_id:
          type: string
          description: The step that is waiting, so a client can associate the question
            with it.
      additionalProperties: false

    InteractionAnswer:
      title: InteractionAnswer
      description: |
        The answer to an interaction. Which member applies is determined by the
        interaction's `kind`, not by a discriminator field:

        | kind | member |
        |---|---|
        | `ask_user` | `{"text": "..."}` |
        | `choice` | `{"selected": [...]}` |
        | `confirm` | `{"approved": bool, "comment"?: "..."}` |
        | `form` | `{"values": {...}}` |
        | `settings_review` | `{"settings": [...], "comment"?: "..."}` |

        The `settings` of a `SettingsAnswer` are real `setting` parts: one per key the
        review raised, every `proposed` value accepted or corrected and every `missing`
        value filled in. Extra keys the user added are allowed and are carried as
        constraints on the run.
      oneOf:
        - type: object
          title: TextAnswer
          required: [text]
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 4000
          additionalProperties: false
        - type: object
          title: ChoiceAnswer
          required: [selected]
          properties:
            selected:
              type: array
              minItems: 1
              items:
                type: string
            comment:
              type: string
              maxLength: 4000
          additionalProperties: false
        - type: object
          title: ConfirmAnswer
          required: [approved]
          properties:
            approved:
              type: boolean
            comment:
              type: string
              maxLength: 4000
          additionalProperties: false
        - type: object
          title: FormAnswer
          required: [values]
          properties:
            values:
              type: object
              additionalProperties: true
          additionalProperties: false
        - type: object
          title: SettingsAnswer
          required: [settings]
          properties:
            settings:
              type: array
              minItems: 1
              description: >-
                The confirmed settings, as the parts a user message is made of. One entry
                per key the `settings_review` raised; unknown extra keys are allowed and
                become constraints. These exact parts become the user message GenAIx stores
                for the review.
              items:
                $ref: '#/components/schemas/UserSettingPart'
            comment:
              type: string
              maxLength: 4000
          additionalProperties: false

    InteractionAnswerRequest:
      type: object
      title: InteractionAnswerRequest
      required: [answer]
      properties:
        answer:
          $ref: '#/components/schemas/InteractionAnswer'
      additionalProperties: false

    # ----------------------------------------------------------------- events

    EventType:
      type: string
      title: EventType
      description: >-
        Every event type defined in v1.0. A client **MUST** ignore a `type` outside this
        list and **MUST NOT** close the stream because of one. New types are additive
        and are not a breaking change.
      enum:
        - session.updated
        - run.started
        - run.completed
        - run.failed
        - run.cancelled
        - message.started
        - message.completed
        - part.started
        - part.delta
        - part.completed
        - status
        - tool.started
        - tool.completed
        - tool.failed
        - plan.updated
        - step.updated
        - check.updated
        - derived_settings.updated
        - approval_chain.updated
        - artifact.created
        - artifact.updated
        - preview.updated
        - interaction.requested
        - interaction.resolved
        - auth.required
        - heartbeat
        - error

    BaseEvent:
      type: object
      title: BaseEvent
      description: >-
        Fields every event carries. `seq` is the total order within the session and the
        value of the SSE `id:` field, so it is also what a client sends back as
        `after=` or `Last-Event-ID`.
      required: [seq, ts, session_id, type]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Monotonic per session, starting at 1, gapless, never reused. Also the SSE
            `id:`.
        ts:
          type: string
          format: date-time
          description: >-
            When the event was produced on the server. Non-decreasing as `seq` increases,
            and never earlier than any timestamp carried inside the event itself, such as
            `run.started_at`, `step.started_at`, `step.ended_at`, `check.checked_at`,
            `file.created_at` or `interaction.requested_at`. The one exception is a
            deadline, `interaction.expires_at`, which is in the future by definition.
        session_id:
          type: string
          format: uuid
        run_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The run this event belongs to. Absent or `null` for session-level events
            (`session.updated`, `heartbeat`, and `error` raised outside a run).
        type:
          $ref: '#/components/schemas/EventType'
      additionalProperties: true

    Event:
      title: Event
      description: >-
        The `data:` payload of any SSE frame. `type` discriminates and matches the SSE
        `event:` field.
      oneOf:
        - $ref: '#/components/schemas/SessionUpdatedEvent'
        - $ref: '#/components/schemas/RunStartedEvent'
        - $ref: '#/components/schemas/RunCompletedEvent'
        - $ref: '#/components/schemas/RunFailedEvent'
        - $ref: '#/components/schemas/RunCancelledEvent'
        - $ref: '#/components/schemas/MessageStartedEvent'
        - $ref: '#/components/schemas/MessageCompletedEvent'
        - $ref: '#/components/schemas/PartStartedEvent'
        - $ref: '#/components/schemas/PartDeltaEvent'
        - $ref: '#/components/schemas/PartCompletedEvent'
        - $ref: '#/components/schemas/StatusEvent'
        - $ref: '#/components/schemas/ToolStartedEvent'
        - $ref: '#/components/schemas/ToolCompletedEvent'
        - $ref: '#/components/schemas/ToolFailedEvent'
        - $ref: '#/components/schemas/PlanUpdatedEvent'
        - $ref: '#/components/schemas/StepUpdatedEvent'
        - $ref: '#/components/schemas/CheckUpdatedEvent'
        - $ref: '#/components/schemas/DerivedSettingsUpdatedEvent'
        - $ref: '#/components/schemas/ApprovalChainUpdatedEvent'
        - $ref: '#/components/schemas/ArtifactCreatedEvent'
        - $ref: '#/components/schemas/ArtifactUpdatedEvent'
        - $ref: '#/components/schemas/PreviewUpdatedEvent'
        - $ref: '#/components/schemas/InteractionRequestedEvent'
        - $ref: '#/components/schemas/InteractionResolvedEvent'
        - $ref: '#/components/schemas/AuthRequiredEvent'
        - $ref: '#/components/schemas/HeartbeatEvent'
        - $ref: '#/components/schemas/ErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          session.updated: '#/components/schemas/SessionUpdatedEvent'
          run.started: '#/components/schemas/RunStartedEvent'
          run.completed: '#/components/schemas/RunCompletedEvent'
          run.failed: '#/components/schemas/RunFailedEvent'
          run.cancelled: '#/components/schemas/RunCancelledEvent'
          message.started: '#/components/schemas/MessageStartedEvent'
          message.completed: '#/components/schemas/MessageCompletedEvent'
          part.started: '#/components/schemas/PartStartedEvent'
          part.delta: '#/components/schemas/PartDeltaEvent'
          part.completed: '#/components/schemas/PartCompletedEvent'
          status: '#/components/schemas/StatusEvent'
          tool.started: '#/components/schemas/ToolStartedEvent'
          tool.completed: '#/components/schemas/ToolCompletedEvent'
          tool.failed: '#/components/schemas/ToolFailedEvent'
          plan.updated: '#/components/schemas/PlanUpdatedEvent'
          step.updated: '#/components/schemas/StepUpdatedEvent'
          check.updated: '#/components/schemas/CheckUpdatedEvent'
          derived_settings.updated: '#/components/schemas/DerivedSettingsUpdatedEvent'
          approval_chain.updated: '#/components/schemas/ApprovalChainUpdatedEvent'
          artifact.created: '#/components/schemas/ArtifactCreatedEvent'
          artifact.updated: '#/components/schemas/ArtifactUpdatedEvent'
          preview.updated: '#/components/schemas/PreviewUpdatedEvent'
          interaction.requested: '#/components/schemas/InteractionRequestedEvent'
          interaction.resolved: '#/components/schemas/InteractionResolvedEvent'
          auth.required: '#/components/schemas/AuthRequiredEvent'
          heartbeat: '#/components/schemas/HeartbeatEvent'
          error: '#/components/schemas/ErrorEvent'

    SessionUpdatedEvent:
      title: SessionUpdatedEvent
      description: Status, title, context, labels or cms_objects of the session changed.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, session]
          properties:
            type:
              type: string
              const: session.updated
            session:
              $ref: '#/components/schemas/Session'
            changed:
              type: array
              description: Names of the fields that changed, as a hint for clients.
              items:
                type: string

    RunStartedEvent:
      title: RunStartedEvent
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, run]
          properties:
            type:
              type: string
              const: run.started
            run:
              $ref: '#/components/schemas/Run'

    RunCompletedEvent:
      title: RunCompletedEvent
      description: Terminal. The last event of a successful run.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, run]
          properties:
            type:
              type: string
              const: run.completed
            run:
              $ref: '#/components/schemas/Run'
            usage:
              $ref: '#/components/schemas/Usage'

    RunFailedEvent:
      title: RunFailedEvent
      description: >-
        Terminal. `error` is byte-for-byte the same `Problem` document that
        `GET /sessions/{session_id}/runs/{run_id}` returns as `Run.error`, and the same one
        a synchronous call would have returned. A client that connected too late to see
        this event therefore loses nothing: it hydrates the identical failure from the run
        resource.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, run, error]
          properties:
            type:
              type: string
              const: run.failed
            run:
              $ref: '#/components/schemas/Run'
            error:
              $ref: '#/components/schemas/Problem'
            usage:
              $ref: '#/components/schemas/Usage'

    RunCancelledEvent:
      title: RunCancelledEvent
      description: >-
        Terminal. CMS writes that already happened are not rolled back; see the run's
        `cms_objects` on the session.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, run]
          properties:
            type:
              type: string
              const: run.cancelled
            run:
              $ref: '#/components/schemas/Run'
            usage:
              $ref: '#/components/schemas/Usage'

    MessageStartedEvent:
      title: MessageStartedEvent
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, message_id, role]
          properties:
            type:
              type: string
              const: message.started
            message_id:
              type: string
              format: uuid
            role:
              $ref: '#/components/schemas/MessageRole'

    MessageCompletedEvent:
      title: MessageCompletedEvent
      description: >-
        The message is final and persisted. A client may now fetch it from
        `GET /sessions/{id}/messages` and will get exactly the parts it streamed.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, message_id]
          properties:
            type:
              type: string
              const: message.completed
            message_id:
              type: string
              format: uuid
            part_count:
              type: integer
              minimum: 0
            usage:
              $ref: '#/components/schemas/Usage'

    PartStartedEvent:
      title: PartStartedEvent
      description: >-
        A part begins. `part` carries the initial shape, which for `text` is usually an
        empty string and for structured parts the skeleton that deltas then fill in.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, message_id, part_index, part]
          properties:
            type:
              type: string
              const: part.started
            message_id:
              type: string
              format: uuid
            part_index:
              type: integer
              minimum: 0
              description: Index of the part within the message, stable for the whole message.
            part:
              $ref: '#/components/schemas/MessagePart'

    PartDeltaEvent:
      title: PartDeltaEvent
      description: |
        Incremental update of one part.

        - For `text` and `status_note`, `delta` is a **string** to append to `text`.
        - For every structured part, `delta` is a **JSON merge patch** (RFC 7386)
          applied to the part object. Arrays are replaced wholesale by merge-patch
          semantics, which is why structured parts keep their arrays short and send the
          whole array when an item changes.

        `patch_format` names which of the two it is, so a client never has to guess from
        the JSON type.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, message_id, part_index, delta]
          properties:
            type:
              type: string
              const: part.delta
            message_id:
              type: string
              format: uuid
            part_index:
              type: integer
              minimum: 0
            delta:
              description: A string chunk, or a JSON merge patch object.
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true
            patch_format:
              type: string
              enum: [append, merge_patch]
              default: append

    PartCompletedEvent:
      title: PartCompletedEvent
      description: >-
        The part is final. `part` is authoritative: a client that missed or mis-applied
        deltas replaces its local copy with this.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, message_id, part_index, part]
          properties:
            type:
              type: string
              const: part.completed
            message_id:
              type: string
              format: uuid
            part_index:
              type: integer
              minimum: 0
            part:
              $ref: '#/components/schemas/MessagePart'

    StatusEvent:
      title: StatusEvent
      description: >-
        Short human-readable statement of what the agent is doing right now.
        Transient: not persisted as a message part, and a client may keep only
        the latest.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, text, kind]
          properties:
            type:
              type: string
              const: status
            text:
              type: string
              maxLength: 200
              examples:
                - Reading page "Garantiebedingungen"
            kind:
              type: string
              enum: [thinking, reading, searching, writing, calling_cms, waiting]
            step_id:
              type: string
              description: The step this status belongs to, when it belongs to one.

    ToolStartedEvent:
      title: ToolStartedEvent
      description: |
        An MCP tool call began. `tool` is the **bare wire name** exactly as the server lists
        it in `tools/list` and as `mcp/tools.json` spells it (`create_page`,
        `search_content`, `request_interaction`); `group` is the tool group from the MCP
        scope (`identity`, `search`, `content_read`, `content_write`, `constructs`, `admin`,
        or `genaix` for GenAIx's own in-process tools). The group is never a name prefix:
        `content_write_create_page` does not occur. Decided in `1.0.0-rc.2`; the examples
        and transcripts were corrected to it.

        `input_summary` is a short human sentence, never the raw arguments: arguments can
        contain the whole page content and must not be shown to the end user or
        written to logs verbatim.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, tool_call_id, tool, group, input_summary]
          properties:
            type:
              type: string
              const: tool.started
            tool_call_id:
              type: string
              description: >-
                Unique within the run. Correlates `tool.started` with `tool.completed` or
                `tool.failed`.
            tool:
              type: string
              examples:
                - create_page
            group:
              type: string
              enum: [identity, search, content_read, content_write, constructs, admin, genaix]
            input_summary:
              type: string
              maxLength: 500
            cms_objects:
              type: array
              description: CMS objects the call is about, known before it runs.
              items:
                $ref: '#/components/schemas/CmsObjectRef'
            step_id:
              type: string

    ToolCompletedEvent:
      title: ToolCompletedEvent
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, tool_call_id, ok, output_summary, duration_ms]
          properties:
            type:
              type: string
              const: tool.completed
            tool_call_id:
              type: string
            tool:
              type: string
            ok:
              type: boolean
              description: >-
                `false` for a tool that returned a structured refusal, for instance a
                permission denial, which is not an error of the run.
            output_summary:
              type: string
              maxLength: 500
            duration_ms:
              type: integer
              minimum: 0
            cms_objects:
              type: array
              items:
                $ref: '#/components/schemas/CmsObjectRef'
            result_count:
              type: integer
              description: >-
                For search, list and count tools: the `total` the tool reported when it
                did, else the number of items returned (since `1.0.0-rc.2`). Such calls add
                nothing to `cms_objects`.
            step_id:
              type: string

    ToolFailedEvent:
      title: ToolFailedEvent
      description: >-
        The tool call errored. The run may still recover: the agent sees the error and
        may retry or choose another route. Only `run.failed` ends the run.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, tool_call_id, error]
          properties:
            type:
              type: string
              const: tool.failed
            tool_call_id:
              type: string
            tool:
              type: string
            error:
              $ref: '#/components/schemas/Problem'
            duration_ms:
              type: integer
              minimum: 0
            step_id:
              type: string

    PlanUpdatedEvent:
      title: PlanUpdatedEvent
      description: The whole plan, every time. Never a delta.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, plan]
          properties:
            type:
              type: string
              const: plan.updated
            plan:
              $ref: '#/components/schemas/Plan'

    StepUpdatedEvent:
      title: StepUpdatedEvent
      description: >-
        The full step object including its substeps. Idempotent: applying the same event
        twice changes nothing. Clients key on `step.id`.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, step]
          properties:
            type:
              type: string
              const: step.updated
            step:
              $ref: '#/components/schemas/Step'
            parent_step_id:
              type: string
              description: >-
                Set when the event updates a substep in place rather than resending the
                parent. Clients that only handle top-level steps can ignore such events.

    CheckUpdatedEvent:
      title: CheckUpdatedEvent
      description: >-
        One check, full object, idempotent, keyed on `check.id`. Checks stream
        during generation rather than only at review time, so findings are
        available as soon as they are produced. Verbatim proofs arrive here as
        `check.verification`.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, check]
          properties:
            type:
              type: string
              const: check.updated
            check:
              $ref: '#/components/schemas/Check'

    DerivedSettingsUpdatedEvent:
      title: DerivedSettingsUpdatedEvent
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, derived_settings]
          properties:
            type:
              type: string
              const: derived_settings.updated
            derived_settings:
              $ref: '#/components/schemas/DerivedSettings'

    ApprovalChainUpdatedEvent:
      title: ApprovalChainUpdatedEvent
      description: The whole ordered chain, every time.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, approval_chain]
          properties:
            type:
              type: string
              const: approval_chain.updated
            approval_chain:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalStep'

    ArtifactCreatedEvent:
      title: ArtifactCreatedEvent
      description: The agent wrote a new file into the session filesystem.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, file]
          properties:
            type:
              type: string
              const: artifact.created
            file:
              $ref: '#/components/schemas/File'

    ArtifactUpdatedEvent:
      title: ArtifactUpdatedEvent
      description: An existing artifact was rewritten. `file.sha256` changed.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, file]
          properties:
            type:
              type: string
              const: artifact.updated
            file:
              $ref: '#/components/schemas/File'

    PreviewUpdatedEvent:
      title: PreviewUpdatedEvent
      description: >-
        Fires after every CMS write that affects the preview, so a client can
        reload it. Pages only in Phase One.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, cms_ref, preview_url, mode]
          properties:
            type:
              type: string
              const: preview.updated
            cms_ref:
              $ref: '#/components/schemas/CmsObjectRef'
            preview_url:
              type: string
              format: uri
            mode:
              type: string
              enum: [edit, view]
            changed_elements:
              type: array
              description: Tag keywords that changed, so the client can highlight them.
              items:
                type: string

    InteractionRequestedEvent:
      title: InteractionRequestedEvent
      description: >-
        The agent needs an answer. The run moves to `waiting_for_input` and the session
        to `waiting_for_input`. Answer through
        `POST /sessions/{id}/interactions/{interaction_id}` or through the next message's
        `reply_to_interaction`.

        `interaction.kind` selects the payload: `options` and `multi` for `choice`, `schema`
        for `form`, `proposed` and `missing` for `settings_review`. A `settings_review` is
        raised at most once per run and always before the first CMS write, so that no
        setting GenAIx inferred from the user's prose governs a write unconfirmed.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, interaction]
          properties:
            type:
              type: string
              const: interaction.requested
            interaction:
              $ref: '#/components/schemas/Interaction'

    InteractionResolvedEvent:
      title: InteractionResolvedEvent
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, interaction_id, by]
          properties:
            type:
              type: string
              const: interaction.resolved
            interaction_id:
              type: string
              format: uuid
            answer:
              $ref: '#/components/schemas/InteractionAnswer'
            message_id:
              type: string
              format: uuid
              description: >-
                The user message GenAIx stored from the answer, whose `parts` are the
                confirmed `setting` parts and whose `interaction_id` is this interaction.
                Set when a `settings_review` was resolved with `by: user`.

                This event is the only signal for that message: no `message.started`,
                `part.*` or `message.completed` frames are emitted for it, because it was
                not produced by the model and has no streamed parts. A client renders it
                from the `settings` in `answer`, which are exactly the stored parts, and
                finds it under this id in `GET /sessions/{session_id}/messages`.
            by:
              type: string
              enum: [user, timeout, cancel]

    AuthRequiredEvent:
      title: AuthRequiredEvent
      description: |
        The run needs an MCP connection that it cannot use, so it cannot continue.
        `connection_id` says which one and `connector` what kind it is. The run fails
        immediately after this event with `424` and
        `genaix_code: mcp_authorization_required`.

        The credential it looked for is the session's own, at
        `/sessions/{session_id}/authorizations/{connection_id}`, falling back to the
        caller's standing one at `/mcp/connections/{connection_id}/authorization`. This
        event means neither is usable: none registered, refused, or past its expiry.

        There is no pause-and-resume: the run does not wait in `waiting_for_input` for a
        credential. The client registers an authorization and re-sends the message that
        failed. `how_to_fix` names the route.

        This event is only emitted when a connection exists to name. A required connector
        type for which the installation offers no connection at all is a configuration
        error, not a credential problem: the run fails with `503` `service_unavailable`
        and no `auth.required` precedes it (since `1.0.0-rc.2`).
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, connection_id, connector, reason, how_to_fix]
          properties:
            type:
              type: string
              const: auth.required
            connection_id:
              type: string
              format: uuid
              description: >-
                The connection the run could not use, as listed by `GET /mcp/connections`.
            connector:
              type: string
              description: Its connector type, so a client can phrase the message without a lookup.
              examples:
                - cms
            reason:
              type: string
              description: >-
                `unauthorized` means no usable credential was found at either scope,
                `invalid` and `expired` that the one found is refused or past its expiry.
                `unreachable` means the server did not answer at all, which no credential
                can fix.
              enum: [unauthorized, invalid, expired, unreachable]
            how_to_fix:
              type: string
              description: >-
                Human-readable next step naming the route to call, safe to show to the end
                user. For the integrated path that route is
                `PUT /sessions/{session_id}/authorizations/{connection_id}`; a client
                working from a standing credential uses
                `PUT /mcp/connections/{connection_id}/authorization` instead.
              examples:
                - >-
                  This session has no valid credential for the connection "Acme GmbH demo
                  CMS". Create an API token on that system, register it with PUT
                  /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/authorizations/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69,
                  then send the message again.

    HeartbeatEvent:
      title: HeartbeatEvent
      description: >-
        Sent every 15 seconds of silence so proxies keep the connection open. Consumes a
        `seq` and is persisted, so `after` arithmetic needs no special case.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              const: heartbeat

    ErrorEvent:
      title: ErrorEvent
      description: >-
        An error the client should show. `recoverable: true` means the run continues;
        `false` means a terminal `run.failed` follows immediately.
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required: [type, error, recoverable]
          properties:
            type:
              type: string
              const: error
            error:
              $ref: '#/components/schemas/Problem'
            recoverable:
              type: boolean
