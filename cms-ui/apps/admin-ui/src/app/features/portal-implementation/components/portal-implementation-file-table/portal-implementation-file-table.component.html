@if (showSearch) {
  <gtx-search-bar
    class="search-bar"
    [query]="query"
    [placeholder]="'shared.search' | gtxI18n"
    (search)="updateSearchQuery($event)"
    (clear)="updateSearchQuery('')"
  ></gtx-search-bar>
}

<div class="entity-table-actions-bar">
  <gtx-button
    class="table-action-button reload-button"
    flat
    size="small"
    type="primary"
    [disabled]="disabled || loading"
    (click)="reload()"
    >
    <icon left>refresh</icon> {{ 'common.reload_table_button' | gtxI18n }}
  </gtx-button>
</div>

<gtx-progress-bar class="load-bar" [active]="loading"></gtx-progress-bar>

<gtx-table
  class="entity-table"

  [selectable]="false"
  [hideActions]="true"
  [disabled]="disabled"

  [columns]="columns"
  [rows]="rows"
  [totalCount]="totalCount"

  [page]="page"
  [perPage]="perPage"
  [sortBy]="sortBy"
  [sortOrder]="sortOrder"

  [renderers]="{
    edate: dateRenderer
  }"

  (pageChange)="changePageTo($event)"
  (sortByChange)="updateSortBy($event)"
  (sortOrderChange)="updateSortOrder($event)"
></gtx-table>

<ng-template #dateRenderer let-value="value">
  <span class="gtx-table-cell-text">
    {{ value | gtxI18nDate:'dateTimeDetailed' }}
  </span>
</ng-template>
