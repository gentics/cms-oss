                    authorizations:
                      - connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                        status: authorized
                        expires_at: '2026-10-08T09:14:22Z'
                    message_id: 7e4b1c08-2d59-4f36-b8a1-0c3e6d9f5a27
                    run_id: a9d2f760-3b48-4c15-8e07-6f1b9c4a2d83
                    events_url: /api/v1/sessions/2b7c4e19-6a30-4d85-9f12-8c0e5a3b7d64/events?after=0
