    get:
      operationId: listSessions
      tags: [sessions]
      summary: List the calling user's sessions
      description: |
        Returns only sessions owned by (installation token, `X-GCMS-Subject`), newest
        activity first. `archived` sessions are excluded unless `status=archived` is
        requested explicitly.
      parameters:
        - $ref: '#/components/parameters/XGcmsSubject'
        - name: status
          in: query
          description: Filter by session status. Repeat the parameter to allow several.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SessionStatus'
          style: form
          explode: true
          example: [active, waiting_for_input]
        - name: workflow
          in: query
          description: Filter by workflow id.
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: [content_create]
        - name: q
          in: query
          description: >-
