    put:
      operationId: putMcpAuthorization
      tags: [mcp]
      summary: Register this user's credential for one connection
      description: |
        Registers the credential GenAIx will use for this user on this connection. The body
        shape follows the connector type's `auth.type`:

        - `bearer`: `{auth_type: bearer, token, token_name?, expires_at?}`. The client
          obtained the token from the target system itself; GenAIx never creates credentials.
        - `oauth2`: `{auth_type: oauth2, action: start}`. GenAIx discovers the server's
          metadata, builds the redirect and answers `status: pending` with an
          `authorization_url`; the code exchange happens on a GenAIx-side callback, so the
          client never touches a code verifier. Not implemented by the CMS.

        GenAIx **verifies before storing**: it calls the connection's URL with the new
        credential and only accepts it if the call succeeds. `422` with
        `genaix_code: mcp_authorization_rejected` when the server refuses it, and nothing is
        stored, so a failed registration never replaces a working credential. `424` when the
        URL cannot be reached, also without storing.

        Idempotent: registering again replaces the stored credential. The secret is encrypted
        at rest, scoped to this (user, connection), and never returned by any route. Revoking
        the credential itself is done on the target system; `DELETE` here only makes GenAIx
        forget it.

        A credential registered with an `expires_at` that has already passed is verified
        like any other and, when the server accepts it, stored without the secret as
        `status: expired` rather than refused (since `1.0.0-rc.2`); a client sees the same
        answer it would see once the expiry passed.
      parameters:
        - $ref: '#/components/parameters/McpConnectionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpAuthorizationRequest'
            examples:
              bearer:
                summary: Register a CMS API token the client just created
                value:
                  auth_type: bearer
                  token: cmstok_9c4af1d2e87b4f06a3195d7c6b0e2f48
                  token_name: genaix-acme-gmbh-demo-cms
                  expires_at: '2027-01-05T00:00:00Z'
              bearer_minimal:
                summary: Minimal body
                value:
                  auth_type: bearer
                  token: cmstok_9c4af1d2e87b4f06a3195d7c6b0e2f48
              oauth2_start:
                summary: >-
                  Start the flow for a connector that implements MCP OAuth; the answer
                  carries the authorization_url
                value:
                  auth_type: oauth2
                  action: start
      responses:
        '200':
          description: Accepted, verified and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAuthorization'
              examples:
                registered:
                  value:
                    connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                    connector: cms
                    user:
                      subject: sub_c3f1a07d9e5b4826
                    status: authorized
                    auth_type: bearer
                    resource: https://cms.example.com/mcp
                    token_name: genaix-acme-gmbh-demo-cms
                    registered_at: '2026-10-07T09:20:11Z'
                    verified_at: '2026-10-07T09:20:12Z'
                    expires_at: '2027-01-05T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/McpConnectionNotFound'
        '422':
          description: >-
            The body failed validation, or the server refused the credential. Nothing was
            stored in either case.
          headers:
            X-GenAIx-Request-Id:
              $ref: '#/components/headers/XGenAIxRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                mcp_authorization_rejected:
                  summary: The CMS refused the token
                  value:
                    type: https://genaix.gentics.com/problems/mcp-authorization-rejected
                    title: MCP server refused the credential
                    status: 422
                    detail: >-
                      https://cms.example.com/mcp returned 401 for the supplied token. It
                      may be mistyped, already deleted, or issued by a different instance.
                      Nothing was stored; the previous authorization is unchanged.
                    genaix_code: mcp_authorization_rejected
                    instance: >-
                      /api/v1/mcp/connections/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69/authorization
                    request_id: 01K2M4P7TQ2R9V5T0B6C3E8H40
                    connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                    connector: cms
                    upstream:
                      service: cms-mcp
                      url: https://cms.example.com/mcp
                      status: 401
                      message: Invalid or expired API token.
                token_rejected:
                  summary: The target system did not accept the token
                  description: >-
                    GenAIx cannot tell whose token it is: it holds only an opaque subject and
                    never learns which person that is. Confirming that the token belongs to
                    the right person is the client's job, on the system that issued it.
                  value:
                    type: https://genaix.gentics.com/problems/mcp-authorization-rejected
                    title: MCP server refused the credential
                    status: 422
                    detail: >-
                      The target system refused the token: it is not valid for this
                      connection. Nothing was stored, and the previous credential is
                      untouched.
                    genaix_code: mcp_authorization_rejected
                    instance: >-
                      /api/v1/mcp/connections/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69/authorization
                    request_id: 01K2M4P7TQ2R9V5T0B6C3E8H41
                    connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                    connector: cms
                validation_failed:
                  summary: The body does not match the connector's auth type
                  value:
                    type: https://genaix.gentics.com/problems/validation-failed
                    title: Validation failed
                    status: 422
                    detail: 1 field is invalid.
                    genaix_code: validation_failed
                    instance: >-
                      /api/v1/mcp/connections/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69/authorization
                    request_id: 01K2M4P7TQ2R9V5T0B6C3E8H42
                    errors:
                      - pointer: /auth_type
                        detail: >-
                          Connector type cms declares auth.type bearer, so oauth2 is not
                          accepted here.
        '424':
          $ref: '#/components/responses/FailedDependency'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteMcpAuthorization
      tags: [mcp]
      summary: Make GenAIx forget this connection's credential
      description: |
        Deletes the stored credential for (user, connection). The authorization goes back to
        `unauthorized`, every workflow that requires the connector disappears from
        `capabilities.workflows` when no other authorized connection of that type remains,
        and a run that needs it fails with `424` and
        `genaix_code: mcp_authorization_required`.

        The connection itself survives, so re-registering a credential is one call. This
        **revokes nothing on the target system**: the credential keeps working until its owner
        deletes it there. Idempotent: deleting when nothing is registered is `204`.
      x-example-request: |
        DELETE /api/v1/mcp/connections/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69/authorization HTTP/1.1
        Authorization: Bearer sk_gnx_8Fqz1pWv7sR2mJhT4bXcY9dLaK0eNu3G
        X-GCMS-Subject: sub_c3f1a07d9e5b4826
      parameters:
        - $ref: '#/components/parameters/McpConnectionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '204':
          description: Forgotten, or there was nothing registered.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/McpConnectionNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a session
      description: |
        Creates a session owned by (installation token, `X-GCMS-Subject`). A session is
        one user task. `workflow` selects the behaviour profile and the shape of the
        workflow view and defaults to `free_chat`. It is fixed at creation: it is not a
        member of `SessionPatch`, so a `PATCH /sessions/{session_id}` carrying a
        `workflow` field is rejected as `422` with `genaix_code: validation_failed` like
        any other unknown property. To work under a different workflow, create a new
        session.

        ### Creating with the first message

        `message` is optional and is the same body as
        `POST /sessions/{session_id}/messages`. When it is present, one call does all of
        it: the session is created, `intent` is derived from the message's plain
        rendering, the message is appended as the first user turn, and its run starts.
        The `201` then carries `run_id`, `message_id` and `events_url` next to the
        session, so the client goes straight to the event stream. This is the normal path
        for a turn the user typed, and `parts` is the shape to send.

        When `message` is absent the session is created empty, with an empty `intent`, and
        the first turn is posted separately. Both flows are supported and neither is
        deprecated.

        ### Credentials for the first run

        `authorizations` registers the credentials this session will use, one per
        connection, before the session exists. Each is verified against its connection and
        the whole call fails if one is refused, so a `201` means the session can act. Sent
        together with `message`, it collapses the integrated start into a single round trip:
        the client creates a token on the target system, then creates the session with that
        token and the first turn in one call.

        A credential registered this way belongs to the session: it is used only by this
        session's runs and is deleted when the session reaches `published`, `discarded` or
        `archived`, when the client deletes it, or when it expires. Leaving `authorizations`
        out is fine when the caller holds a standing authorization on the connection, or
        when the client registers one later with
        `PUT /sessions/{session_id}/authorizations/{connection_id}`.

        ### Availability is a hint

        `workflow` must name an installed module; whether the caller can act in it right
        now is what `capabilities.workflows` in `GET /me` and `Workflow.available` report,
        and this call does not refuse a session on that ground (since `1.0.0-rc.2`). A
        session created without a usable credential for a required connector answers
        `auth.required` on its first run and fails it with `424`
        `mcp_authorization_required`; the client registers a credential and sends the turn
        again. Credentials sent in `authorizations` on this call satisfy the requirement for
        this session immediately, without a standing authorization. A required connector
        type for which the installation offers no connection at all (no configured default
        and none created) is an installation configuration error: the run fails with `503`
        `service_unavailable`, and no `auth.required` is emitted since there is no
        `connection_id` to name.

        ### Files need the two-call flow

        Files are **per session**: they live under
        `<base>/sessions/<session_id>/uploads/`, so there is nowhere to put them before
        the session id exists. A `message` on this call therefore cannot reference any,
        and `message.files` or a `file_ref` part in `message.parts` is `422` with
        `genaix_code: validation_failed`. A turn with attachments is three calls: create
        the session, upload to `POST /sessions/{session_id}/files`, then post the message
        with the returned file ids.

        ### Intent is derived

        `intent` is the user's original request in their own words, and GenAIx derives it:
        it is the plain rendering of the first user message, the same string `content`
        carries. It is read-only, it is empty until the first message arrives, and it
        cannot be set on this call or patched later. It is what the session list's `q`
        searches, next to `title`.
      parameters:
        - $ref: '#/components/parameters/XGcmsSubject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            examples:
              one_call_with_parts:
                summary: One call - create the session and send the first message as parts
                description: >-
                  The primary shape, and the whole integrated start in one round trip: the
                  client has just created a token on the target system and sends it with the
                  turn. `message.parts` is what the user composed, so
                  GenAIx verifies the credential, creates the session, derives
                  `intent` = `Create a landing page in @[Campaigns] in #[language: de],
                  based on @[Product launch 2025]. The title must read exactly This is our
                  Landingpage.`, appends the message and starts its run. The `201` carries
                  `run_id` and `events_url`.
                value:
                  workflow: content_create
                  title: Landing page - product launch
                  context:
                    node_id: 3
                    language: de
                    connection_ids: [c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69]
                  model: claude-sonnet-5
                  authorizations:
                    - connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                      auth_type: bearer
                      token: cmstok_5Rk9wQ2zX7mV0pB4nH8jL1aD6sF3gY
                      token_name: genaix-2b7c4e19-6a30-4d85-9f12-8c0e5a3b7d64
                      expires_at: '2026-10-08T09:14:22Z'
                  message:
                    parts:
                      - type: text
                        text: 'Create a landing page in '
                      - type: reference
                        ref:
                          type: folder
                          id: '4021'
                          node_id: 3
                          label: Campaigns
                      - type: text
                        text: ' in '
                      - type: setting
                        key: language
                        value: de
                        label: German
                      - type: text
                        text: ', based on '
                      - type: reference
                        ref:
                          type: page
                          id: '8871'
                          node_id: 3
                          label: Product launch 2025
                      - type: text
                        text: '. The title must read exactly '
                      - type: verbatim
                        text: This is our Landingpage
                        source: user
                        label: Page title
                      - type: text
                        text: '.'
                    options:
                      mode: execute
              one_call_plain_content:
                summary: One call - plain client variant, `content` instead of `parts`
                description: >-
                  Same effect from a client with no part-aware composer: `content` is the
                  message and becomes the session's `intent` verbatim.
                value:
                  workflow: content_research
                  message:
                    content: >-
                      Which pages on our portal mention the Acme GmbH terms of service? We
                      need to review all of them because of the update.
              s1_content_create:
                summary: >-
                  Two-call flow - create empty, because the first turn needs an upload
                description: >-
                  No `message`, so `intent` starts empty. The client uploads the source
                  PDF to the new session and then posts the first turn with the returned
                  file id.
                value:
                  workflow: content_create
                  title: Landing page - Acme GmbH terms of service update
                  context:
                    node_id: 3
                    folder_id: 42
                    language: de
                    references:
                      - type: folder
                        id: '42'
                        node_id: 3
                        label: Richtlinien
                      - type: page
                        id: '8871'
                        node_id: 3
                        label: Garantiebedingungen
                    guidelines: [tone-of-voice-de, seo-basics]
                    connection_ids: [c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69]
                  model: claude-sonnet-5
              s2_content_research:
                summary: Two-call flow - a research session with its context preset
                value:
                  workflow: content_research
                  context:
                    node_id: 3
                    language: de
              free_chat:
                summary: Minimal body
                value: {}
      responses:
        '201':
          description: >-
            Session created. When the call carried a `message`, the first user turn is
            stored and its run has started: `run_id`, `message_id` and `events_url` are
            present and `active_run_id` names the same run.
          headers:
            Location:
              description: URL of the new session.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
              examples:
                created_with_message:
                  summary: Created with the first message, run already started
                  description: >-
                    `intent` is the plain rendering of the message that came with the call,
                    `message_count` and `iteration` are already 1, the session's credential
                    is registered and verified, and the client follows `events_url`. The
                    token itself is not echoed back, here or anywhere else.
                  value:
                    id: 2b7c4e19-6a30-4d85-9f12-8c0e5a3b7d64
                    title: Landing page - product launch
                    workflow: content_create
                    inputs: {}
                    workflow_version: 1.2.0
                    status: active
                    intent: >-
                      Create a landing page in @[Campaigns] in #[language: de], based on
                      @[Product launch 2025]. The title must read exactly This is our
                      Landingpage.
                    context:
                      node_id: 3
                      language: de
                      references:
                        - type: folder
                          id: '4021'
                          node_id: 3
                          label: Campaigns
                        - type: page
                          id: '8871'
                          node_id: 3
                          label: Product launch 2025
                      connection_ids: [c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69]
                    owner:
                      subject: sub_c3f1a07d9e5b4826
                    model: claude-sonnet-5
                    created_at: '2026-10-07T09:14:22Z'
                    updated_at: '2026-10-07T09:14:22Z'
                    last_activity_at: '2026-10-07T09:14:22Z'
                    message_count: 1
                    iteration: 1
                    active_run_id: a9d2f760-3b48-4c15-8e07-6f1b9c4a2d83
                    cms_objects: []
