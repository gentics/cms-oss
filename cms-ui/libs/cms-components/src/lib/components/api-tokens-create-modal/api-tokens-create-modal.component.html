<gtx-api-token-properties [formControl]="control" />
<div class="modal-content">
    <h2>{{ 'api_token.new' | gtxI18n }}</h2>
    <gtx-api-tokens-create-form
      [apiTokenNames]="apiTokenNames"
      [control]="control"
      (validChange)="isFormVaid($event)"
    ></gtx-api-tokens-create-form>
</div>
<div class="modal-footer">
    <gtx-button
      type="primary"
      [disabled]="!formvalid || loading()"
      (click)="saveForm()"
      data-action="confirm"
      >
      {{ 'modal.create_button' | gtxI18n }}
    </gtx-button>
  <gtx-button
    type="secondary" flat
    (click)="cancelFn()"
    >
      {{ 'common.cancel_button'  | gtxI18n }}
  </gtx-button>
</div>
