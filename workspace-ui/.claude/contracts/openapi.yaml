components:
  securitySchemes:
    installationToken:
      type: http
      scheme: bearer
      bearerFormat: sk_gnx_<random>
      description: |
        The GenAIx installation token. One token per installation, kept server-side by the
        caller and never exposed to a browser. It identifies the **installation**, not the
        user; the user comes from the identity headers.

        Issued by a GenAIx administrator, shown exactly once and stored hashed. An unknown,
        revoked or malformed token is `401`. The token also selects the installation
        configuration GenAIx applies to the request.

  parameters:
    XGcmsSubject:
      name: X-GCMS-Subject
      in: header
      required: true
      description: |
        The **only** identity header, injected by the installation's trusted proxy and
        **required on every user route** (everything except `GET /ping` and
        `DELETE /subjects/{subject}`).

        It is an **opaque, installation-scoped pseudonymous subject**. GenAIx uses it as
        the owner key of sessions, files, connections and authorizations, and for nothing
        else: a session is owned by (installation token, subject), so the same person keeps
        their sessions across sign-ins while GenAIx never learns who they are. No user id,
        login, display name or group list is ever sent, and none is stored.

        The value may be a bare opaque string, or a compact JWS assertion carrying `sub`
        (the subject), `iss` (the installation), `iat` and a short `exp`. The producing side
        may put more into that payload; GenAIx does not decode, use or store anything
        beyond `sub`, `iss` and the timestamps.

        - When the installation is configured with the signing key, GenAIx **verifies the
          signature and the expiry**, takes `sub` as the subject, and rejects an unsigned,
          malformed, mis-issued or stale value with `401` and
          `genaix_code: identity_invalid`.
        - When no key is configured, the header is accepted as sent and used verbatim as
          the subject.

        GenAIx trusts the header in either case only because the installation token
        authenticated the caller. Missing or empty is `400` with
        `genaix_code: subject_missing`.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      example: sub_c3f1a07d9e5b4826
    McpConnectionId:
      name: connection_id
      in: path
      required: true
      description: >-
        Id of one of the caller's MCP connections, as listed by `GET /mcp/connections`. A
        connection of another user, or an unknown id, is `404`.
      schema:
        type: string
        format: uuid
      example: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
    SessionId:
      name: session_id
      in: path
      required: true
      description: Session id.
      schema:
        type: string
        format: uuid
      example: 9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
    RunId:
      name: run_id
      in: path
      required: true
      description: Run id, unique within the session.
      schema:
        type: string
        format: uuid
      example: c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94
    FileId:
      name: file_id
      in: path
      required: true
      description: Session file id.
      schema:
        type: string
        format: uuid
      example: 6b0d9e31-44a8-4c57-9f2e-8d1a3c7b5e02
    InteractionId:
      name: interaction_id
      in: path
      required: true
      description: Interaction id, as sent in `interaction.requested`.
      schema:
        type: string
        format: uuid
      example: e3f7b1a9-2c64-4d08-95b7-1a8e0c5d7f36
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor from the previous page's `next_cursor`. Do not construct or parse
        it. A cursor is valid for at least 24 hours; an expired or malformed cursor is
        `400` with `genaix_code: invalid_cursor`.
      schema:
        type: string
        maxLength: 512
      example: eyJhIjoiMjAyNi0xMC0wN1QwOToxNDoyMloiLCJpIjoiOWYxYjZlNGEifQ

  headers:
    XGenAIxRequestId:
      description: Correlation id of this request, also present in GenAIx logs and traces.
      schema:
        type: string
        maxLength: 64
      example: 01JZ8Q4M7X2R9V5T0B6C3E8H1K
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
      example: 30

  responses:
    BadRequest:
      description: >-
        Malformed request: a missing or unusable header, an unparseable body, or an
        invalid query parameter. Credentials were fine.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            subject_missing:
              summary: The identity header was not sent
              value:
                type: https://genaix.gentics.com/problems/subject-missing
                title: Subject header missing
                status: 400
                detail: >-
                  X-GCMS-Subject is required on every user route and was not sent.
                genaix_code: subject_missing
                instance: /api/v1/sessions
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1K
            invalid_cursor:
              summary: A stale pagination cursor
              value:
                type: https://genaix.gentics.com/problems/invalid-cursor
                title: Invalid pagination cursor
                status: 400
                detail: The cursor is malformed or older than 24 hours. Start from the first page.
                genaix_code: invalid_cursor
                instance: /api/v1/sessions
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1M
    Unauthorized:
      description: >-
        The installation token is missing, malformed, unknown or revoked, or the subject
        assertion in `X-GCMS-Subject` did not verify.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="genaix", error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_installation_token:
              value:
                type: https://genaix.gentics.com/problems/invalid-installation-token
                title: Invalid installation token
                status: 401
                detail: >-
                  The bearer token is not a known GenAIx installation token. It may have
                  been deleted; create a new one in the GenAIx administration UI and
                  reconfigure the CMS.
                genaix_code: invalid_installation_token
                instance: /api/v1/me
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1N
            identity_invalid:
              summary: The subject assertion did not verify
              description: >-
                Only an installation configured with the signing key reaches this: the
                assertion in `X-GCMS-Subject` was unsigned, malformed, issued by someone
                else, or past its `exp`. An installation with no key configured accepts the
                header verbatim and never returns this.
              value:
                type: https://genaix.gentics.com/problems/identity-invalid
                title: Subject assertion invalid
                status: 401
                detail: >-
                  The signed subject in X-GCMS-Subject expired at 2026-10-07T09:12:00Z.
                  Obtain a fresh assertion and retry.
                genaix_code: identity_invalid
                instance: /api/v1/sessions
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1P
    Forbidden:
      description: >-
        The object exists under this installation but belongs to a different subject.
        Distinct from `404`, which is used for unknown ids and for objects of other
        installations, so that no existence information leaks across installations.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            other_users_session:
              value:
                type: https://genaix.gentics.com/problems/session-forbidden
                title: Session belongs to a different subject
                status: 403
                detail: >-
                  Session 9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13 belongs to another subject of
                  this installation.
                genaix_code: session_forbidden
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1P
    NotFound:
      description: Unknown id, or an id belonging to a different installation.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            session_not_found:
              value:
                type: https://genaix.gentics.com/problems/session-not-found
                title: Session not found
                status: 404
                detail: No session with id 9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13.
                genaix_code: session_not_found
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1Q
    McpConnectionNotFound:
      description: >-
        `connection_id` is not a connection of the calling user. A connection belonging to a
        different user is indistinguishable from an unknown id, so nothing leaks about other
        users' connections.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mcp_connection_not_found:
              value:
                type: https://genaix.gentics.com/problems/mcp-connection-not-found
                title: MCP connection not found
                status: 404
                detail: >-
                  This subject has no connection with id
                  9e2f7a04-1b58-4c36-a0d9-3f7b1c5e8a42. GET /mcp/connections lists theirs.
                genaix_code: mcp_connection_not_found
                instance: >-
                  /api/v1/mcp/connections/9e2f7a04-1b58-4c36-a0d9-3f7b1c5e8a42/authorization
                request_id: 01K2M4P7TQ2R9V5T0B6C3E8H43
    Conflict:
      description: >-
        The request is valid but conflicts with the current state: a run is already
        active, the session is released, the interaction was already answered, or the
        workflow transition is not legal from here.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            run_already_active:
              summary: A run is still going
              value:
                type: https://genaix.gentics.com/problems/run-already-active
                title: A run is already active
                status: 409
                detail: >-
                  Run c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94 is still running. Cancel it
                  before sending another message.
                genaix_code: run_already_active
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1R
                run_id: c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94
            session_released:
              summary: The session is past generation
              value:
                type: https://genaix.gentics.com/problems/session-released
                title: Session is released
                status: 409
                detail: >-
                  The session is in status released and no longer accepts messages.
                  Reopen it first with POST /sessions/{id}/transitions {"action":"reopen"}.
                genaix_code: session_released
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1S
            transition_invalid:
              summary: Illegal workflow transition
              value:
                type: https://genaix.gentics.com/problems/workflow-transition-invalid
                title: Workflow transition not allowed
                status: 409
                detail: action publish requires status released, but the session is active.
                genaix_code: workflow_transition_invalid
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/transitions
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1T
            interaction_already_answered:
              summary: Double submit from two concurrent clients
              value:
                type: https://genaix.gentics.com/problems/interaction-already-answered
                title: Interaction already answered
                status: 409
                detail: >-
                  Interaction e3f7b1a9-2c64-4d08-95b7-1a8e0c5d7f36 was answered at
                  2026-10-07T09:24:01Z.
                genaix_code: interaction_already_answered
                instance: >-
                  /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/interactions/e3f7b1a9-2c64-4d08-95b7-1a8e0c5d7f36
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1V
    Gone:
      description: >-
        The resource existed but is no longer available: an expired interaction, or an
        event range that has been pruned.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            interaction_expired:
              value:
                type: https://genaix.gentics.com/problems/interaction-expired
                title: Interaction expired
                status: 410
                detail: >-
                  Interaction e3f7b1a9-2c64-4d08-95b7-1a8e0c5d7f36 expired at
                  2026-10-07T09:33:44Z. The agent was told the question timed out; send a
                  new message instead.
                genaix_code: interaction_expired
                instance: >-
                  /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/interactions/e3f7b1a9-2c64-4d08-95b7-1a8e0c5d7f36
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1W
            events_pruned:
              value:
                type: https://genaix.gentics.com/problems/events-pruned
                title: Events no longer available
                status: 410
                detail: >-
                  Events up to seq 1200 have been pruned. Re-hydrate from
                  GET /sessions/{id}/messages and reconnect with after=0.
                genaix_code: events_pruned
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/events
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1X
    PayloadTooLarge:
      description: The uploaded file is larger than `capabilities.upload_max_bytes`.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            file_too_large:
              value:
                type: https://genaix.gentics.com/problems/file-too-large
                title: File too large
                status: 413
                detail: The file is 41943040 bytes; the limit is 26214400 bytes.
                genaix_code: file_too_large
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/files
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1Y
                limit: 26214400
    UnprocessableEntity:
      description: >-
        The body parsed but failed validation. `errors` names the offending fields with
        JSON Pointers.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation_failed:
              value:
                type: https://genaix.gentics.com/problems/validation-failed
                title: Validation failed
                status: 422
                detail: 2 fields are invalid.
                genaix_code: validation_failed
                instance: /api/v1/sessions
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1Z
                errors:
                  - pointer: /workflow
                    detail: >-
                      design_studio_decompose is not a known workflow id. Allowed ids come
                      from GET /workflows.
                  - pointer: /context/references/0/type
                    detail: plain_text is not a ContextReference type. References are always typed.
            unknown_input_part:
              summary: An unknown part type on a user message
              description: >-
                Input parts are strict. An unknown part type is rejected rather than
                ignored, because dropping it would silently lose what the user expressed.
                The output side is the opposite: an unknown part on the event stream falls
                back to its `text`.
              value:
                type: https://genaix.gentics.com/problems/validation-failed
                title: Validation failed
                status: 422
                detail: 1 field is invalid.
                genaix_code: validation_failed
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H2A
                errors:
                  - pointer: /parts/3/type
                    detail: >-
                      voice_clip is not a UserPartType. A client may send text, verbatim,
                      reference, file_ref, setting or filter.
            unsupported_media_type:
              value:
                type: https://genaix.gentics.com/problems/unsupported-media-type
                title: Unsupported media type
                status: 422
                detail: >-
                  application/vnd.ms-excel is not accepted. See
                  capabilities.upload_media_types in GET /me.
                genaix_code: unsupported_media_type
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/files
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H20
    Locked:
      description: >-
        The target CMS object is locked by another user, so the write cannot proceed.
        Carries the lock owner in `cms_object` and `detail`.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            cms_object_locked:
              value:
                type: https://genaix.gentics.com/problems/cms-object-locked
                title: CMS object is locked
                status: 423
                detail: >-
                  Page 8871 "Garantiebedingungen" is locked by user j.huber since
                  2026-10-07T09:58:02Z. Ask them to close it, or continue without the
                  cross-link.
                genaix_code: cms_object_locked
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/transitions
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H22
                cms_object:
                  type: page
                  id: 8871
                  node_id: 3
                  name: Garantiebedingungen
                locked_by: j.huber
                locked_since: '2026-10-07T09:58:02Z'
    FailedDependency:
      description: >-
        A dependency failed: an MCP connection is unreachable or refused the registered
        credential, or the call behind a tool returned an error. `upstream` carries the detail
        so a client can report something actionable.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mcp_authorization_required:
              summary: A run needed the cms connection and the session's credential was refused
              value:
                type: https://genaix.gentics.com/problems/mcp-authorization-required
                title: MCP server authorization required
                status: 424
                detail: >-
                  The connection "Acme GmbH demo CMS" returned 401 for this session's
                  credential, so the authorization is now invalid. Create a new CMS API token
                  for this session and register it with PUT
                  /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/authorizations/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69,
                  then send the message again.
                genaix_code: mcp_authorization_required
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H23
                connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                connector: cms
                upstream:
                  service: cms-mcp
                  url: https://cms.example.com/mcp
                  status: 401
                  message: Invalid or expired API token.
            mcp_authorization_missing:
              summary: A run needed the cms connection and nothing was registered at either scope
              value:
                type: https://genaix.gentics.com/problems/mcp-authorization-required
                title: MCP server authorization required
                status: 424
                detail: >-
                  This session holds no credential for connection
                  c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69 and the caller has no standing one
                  either, so the agent cannot act on that CMS. Register one with PUT
                  /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/authorizations/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69,
                  then send the message again.
                genaix_code: mcp_authorization_required
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H28
                connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                connector: cms
            cms_request_failed:
              summary: The CMS REST call behind a tool failed
              value:
                type: https://genaix.gentics.com/problems/cms-request-failed
                title: CMS request failed
                status: 424
                detail: >-
                  create_page failed: the template 17 is not assigned to folder 57.
                genaix_code: cms_request_failed
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H24
                upstream:
                  service: cms-rest
                  tool: create_page
                  url: https://cms.example.com/rest/page/create
                  status: 400
                  message: Template with id 17 is not available in folder 57.
                  cms_response_code: INVALIDDATA
            mcp_unreachable:
              summary: The connection's CMS is down or the MCP module is not deployed
              value:
                type: https://genaix.gentics.com/problems/mcp-unreachable
                title: CMS MCP endpoint unreachable
                status: 424
                detail: >-
                  No response from https://cms.example.com/mcp after 10 s. The CMS may
                  be restarting, or its MCP endpoint is not deployed.
                genaix_code: mcp_unreachable
                instance: >-
                  /api/v1/mcp/connections/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69/authorization
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H25
                connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                connector: cms
                upstream:
                  service: cms-mcp
                  url: https://cms.example.com/mcp
                  message: connect timeout after 10000 ms
    TooManyRequests:
      description: Rate limit exceeded for this installation or user.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate_limited:
              value:
                type: https://genaix.gentics.com/problems/rate-limited
                title: Too many requests
                status: 429
                detail: 60 runs per hour per user. Retry in 30 seconds.
                genaix_code: rate_limited
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H26
                retry_after_seconds: 30
    ServiceUnavailable:
      description: >-
        GenAIx itself cannot serve the request: the model provider is unavailable, the
        database is down, or the instance is shutting down. Safe to retry.
      headers:
        X-GenAIx-Request-Id:
          $ref: '#/components/headers/XGenAIxRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            service_unavailable:
              value:
                type: https://genaix.gentics.com/problems/service-unavailable
                title: Service unavailable
                status: 503
                detail: The model provider is not responding. Retry in 15 seconds.
                genaix_code: service_unavailable
                instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
                request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H27
                retry_after_seconds: 15

  schemas:

    # ---------------------------------------------------------------- errors

    Problem:
      type: object
      title: Problem
      description: |
        RFC 9457 problem details. Every error response in this API uses this shape with
        content type `application/problem+json`.

        `type` is a stable URI under `https://genaix.gentics.com/problems/`. It is
        documentation, not a fetchable resource. `genaix_code` is the machine-readable
        code clients should branch on; it is a closed enum that grows additively.
      required: [type, title, status, genaix_code]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem type.
          examples:
            - https://genaix.gentics.com/problems/run-already-active
        title:
          type: string
          description: Short, human-readable, stable per `type`.
          examples:
            - A run is already active
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code, repeated for clients that only see the body.
          examples:
            - 409
        detail:
          type: string
          description: >-
            Human-readable explanation of *this* occurrence, safe to show to the end
            user. Never contains credentials.
        instance:
          type: string
          format: uri-reference
          description: The request path that produced the error.
        genaix_code:
          $ref: '#/components/schemas/GenaixCode'
        request_id:
          type: string
          maxLength: 64
          description: Same value as the `X-GenAIx-Request-Id` response header.
        errors:
          type: array
          description: Field-level validation errors, present on 422.
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer:
                type: string
                description: |
                  JSON Pointer (RFC 6901) into the request body. For a tagged union such
                  as a message part or an authorization body the pointer walks the body as
                  sent, never the discriminator branch (since `1.0.0-rc.2`): a bad member of
                  a `text` part is `/parts/0/format`, not `/parts/0/text/format`; an unknown
                  part `type` points at the item, `/parts/1`; a bad `token` on a `bearer`
                  authorization is `/token`, not `/bearer/token`.
                examples:
                  - /context/references/0/type
              detail:
                type: string
              code:
                type: string
                description: |
                  Optional machine-readable sub-code for this field. Values a client may
                  branch on (since `1.0.0-rc.2`; the list grows additively): `missing` (a
                  required member is absent), `file_not_found` (a part names a file that is
                  not in this session), `passage_not_found` (a `verbatim` part quoting a
                  file does not occur in its extracted text; pointer `/parts/N/text`),
                  `not_an_option` (a `settings_review` answer value is not one of the
                  key's `options`; pointer ends in `/value`), `invalid_url` (a connection
                  URL breaks the URL rules), `duplicate` (a second connection at the same
                  URL).
            additionalProperties: false
        upstream:
          type: object
          description: >-
            Present on 424. Describes the failing dependency without leaking
            credentials.
          properties:
            service:
              type: string
              enum: [cms-mcp, cms-rest, elasticsearch, model-provider]
            url:
              type: string
              format: uri
            tool:
              type: string
              description: The MCP tool whose call failed, if the failure happened inside one.
            status:
              type: integer
              description: HTTP status returned by the dependency.
            message:
              type: string
            cms_response_code:
              type: string
              description: The CMS `responseInfo.responseCode` when the CMS returned one.
          additionalProperties: false
        cms_object:
          $ref: '#/components/schemas/CmsObjectRef'
        locked_by:
          type: string
          description: Login of the user holding the lock. Present on 423.
        locked_since:
          type: string
          format: date-time
          description: When the lock was taken. Present on 423.
        run_id:
          type: string
          format: uuid
          description: The run involved, when the error concerns one.
        connection_id:
          type: string
          format: uuid
          description: >-
            The MCP connection involved. Present on `mcp_*` problems, so a client can point the
            user at the right authorization resource.
        connector:
          type: string
          description: >-
            The connector type involved. Present on `mcp_*` problems, and on
            `mcp_connection_limit` where no connection exists yet.
        failing_checks:
          type: array
          description: >-
            Present on `quality_gate_failed`: **every** failing gate-sourced check, blocking
            and non-blocking alike, as the same `Check` objects the event stream published.
            This is what a client renders.
          items:
            $ref: '#/components/schemas/Check'
        failing_gates:
          type: array
          description: >-
            Present on `quality_gate_failed`: the gate records of the **blocking** failures
            only, so a client can say which gate refused and on which attempt without a second
            call. Empty when nothing blocking is left and only acknowledgement is missing.
          items:
            $ref: '#/components/schemas/GateResult'
        acknowledgeable_checks:
          type: array
          description: >-
            Present on `quality_gate_failed`: ids of the **non-blocking** failing checks, which
            the client may pass back in `acknowledge_checks` to let the transition through.
            Blocking checks are never listed here, because they cannot be waived.
          items:
            type: string
        limit:
          type: integer
          description: >-
            The limit that was exceeded. Present on `413` (bytes) and on
            `mcp_connection_limit` (connections per connector type).
        retry_after_seconds:
          type: integer
          minimum: 0
          description: Mirrors the `Retry-After` header. Present on 429 and 503.
      additionalProperties: true
      examples:
        - type: https://genaix.gentics.com/problems/run-already-active
          title: A run is already active
          status: 409
          detail: Run c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94 is still running.
          genaix_code: run_already_active
          instance: /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/messages
          request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H1R

    GenaixCode:
      type: string
      title: GenaixCode
      description: |
        Machine-readable error code. Clients branch on this, not on `type` or `status`.
        New members are added in minor versions; a client that meets an unknown code
        falls back to `status`.
      enum:
        - malformed_request
        - invalid_cursor
        - subject_missing
        - identity_invalid
        - unsupported_accept
        - invalid_installation_token
        - session_forbidden
        - session_not_found
        - run_not_found
        - file_not_found
        - interaction_not_found
        - unknown_workflow
        - run_already_active
        - session_released
        - workflow_transition_invalid
        - interaction_already_answered
        - interaction_expired
        - events_pruned
        - file_too_large
        - unsupported_media_type
        - validation_failed
        - quality_gate_failed
        - cms_object_locked
        - mcp_connection_not_found
        - mcp_connection_limit
        - mcp_authorization_required
        - mcp_authorization_rejected
        - mcp_unreachable
        - cms_request_failed
        - model_error
        - model_rate_limited
        - rate_limited
        - service_unavailable
      examples:
        - run_already_active

    # ------------------------------------------------------- identity and me

    Ping:
      type: object
      title: Ping
      description: Result of the installation-token check.
      required: [ok, installation_id, token_name, api_version]
      properties:
        ok:
          type: boolean
          const: true
        installation_id:
          type: string
          format: uuid
        token_name:
          type: string
          description: The administrator-chosen display name of the installation token.
        training_allowed:
          type: boolean
          description: >-
            Whether generations from this installation may be used for curation and
            training. Snapshotted onto every session at creation.
        api_version:
          type: string
          description: The `info.version` of the contract this instance implements.
      additionalProperties: false

    Me:
      type: object
      title: Me
      description: >-
        Resolved identity, what this installation offers this user, and a one-line summary of
        each MCP connection they hold. Connector types live under `/mcp/connectors`, and the
        connections and their authorizations under `/mcp/connections`.
      required: [installation, user, mcp_connections, capabilities]
      properties:
        installation:
          type: object
          required: [id, name, cms_base_url]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            cms_base_url:
              type: string
              format: uri
              description: Base URL of the CMS this installation token is configured for.
          additionalProperties: false
        user:
          type: object
          description: >-
            The caller, as GenAIx knows them: an opaque subject and nothing else. There is
            no name, no login, no id and no group list, because none is ever sent. A client
            that wants to show who is signed in already knows.
          required: [subject]
          properties:
            subject:
              type: string
              description: >-
                The value of `X-GCMS-Subject`, or its `sub` claim when the header carried a
                signed assertion. This is the owner key of every session, connection and
                authorization the caller holds.
              examples:
                - sub_c3f1a07d9e5b4826
          additionalProperties: false
        mcp_connections:
          type: array
          description: >-
            One entry per connection this user holds, default first within each connector
            type. Summary only: `GET /mcp/connectors` describes the types,
            `GET /mcp/connections` adds reachability, and
            `GET /mcp/connections/{connection_id}/authorization` reports one authorization in
            full, including how to fix it. Empty when the user holds none yet, which the first
            `GET /mcp/connections` resolves when the installation configures a default.
          items:
            $ref: '#/components/schemas/McpConnectionSummary'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      additionalProperties: false

    McpConnectorAuthType:
      type: string
      title: McpConnectorAuthType
      description: |
        How a connector type expects to be authorized. Values and field names follow the MCP
        Authorization specification, revision 2026-07-28, so a connector can move from a
        static token to a full OAuth flow without renaming anything.

        - `none`: no credential. Nothing is registered on a connection of this type.
        - `bearer`: a token the **client** obtained from the target system itself and
          registered through `PUT /mcp/connections/{connection_id}/authorization`. GenAIx
          sends it as `Authorization: Bearer <token>` on outbound calls for that user.
        - `oauth2`: the full flow, with protected-resource metadata discovery (RFC 9728) and
          resource indicators (RFC 8707). GenAIx runs it **server-side**, so a client never
          handles a code verifier. No connector type in this release implements it; the shape
          is reserved so adding one later is additive.
      enum: [none, bearer, oauth2]

    McpConnectorAuth:
      type: object
      title: McpConnectorAuth
      description: >-
        What a connector type needs in order to be authorized, in the vocabulary of the MCP
        Authorization specification, revision 2026-07-28. For an `oauth2` connector GenAIx
        fills `resource`, `authorization_servers` and `scopes_supported` from the target
        system's protected-resource metadata (RFC 9728); for a `bearer` connector they are
        absent, or `resource` is simply the connection's canonical URI.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/McpConnectorAuthType'
        resource:
          type: string
          format: uri
          description: >-
            The canonical URI identifying this MCP server as a protected resource, RFC 8707
            `resource`. Sent unchanged as the `resource` parameter of the `oauth2` flow, and
            the value a token's audience is validated against. Normally equal to the server
            `url`.
        authorization_servers:
          type: array
          description: >-
            Authorization servers that may issue tokens for this resource, RFC 9728
            `authorization_servers` from the protected-resource metadata. A server does not
            have to be its own authorization server.
          items:
            type: string
            format: uri
        scopes_supported:
          type: array
          description: >-
            Scopes the protected resource advertises, RFC 9728 `scopes_supported`. What a
            given user actually got is `scopes_granted` on the authorization.
          items:
            type: string
        token_hint:
          type: string
          description: >-
            GenAIx extension, not part of the specification: a human-readable instruction
            for a `bearer` connector saying what kind of token this is and where the client
            gets one. Shown to whoever has to produce it.
          examples:
            - An API token of the target system, belonging to this user.
      additionalProperties: false

    McpConnectionStatus:
      type: object
      title: McpConnectionStatus
      description: |
        Whether the connection's URL answered GenAIx last time it was probed with an MCP
        `initialize`. Independent of authorization: a reachable connection can still be
        unauthorized, and an unreachable one cannot be verified at all. The probe is
        informational, so a connection may be created and kept while its server is down.

        A server that authenticates its transport, the CMS MCP server among them, answers an
        unauthenticated `initialize` with `401` before any MCP envelope. That counts as
        `reachable: true` with a `message` and **no `server_info`**; `server_info` is filled
        when a probe ran with a credential (a registration or a later verification). A
        client must not expect `server_info` on a connection nobody has authorized yet
        (since `1.0.0-rc.2`).
      required: [reachable, checked_at]
      properties:
        reachable:
          type: boolean
        checked_at:
          type: string
          format: date-time
        message:
          type: string
          description: Short diagnostic when `reachable` is false.
        server_info:
          type: object
          description: >-
            What the server said about itself in the `initialize` response. Useful for
            telling two CMS instances apart and for spotting a protocol mismatch.
          properties:
            name:
              type: string
            version:
              type: string
            protocol_version:
              type: string
              description: MCP protocol revision the server implements.
          additionalProperties: true
      additionalProperties: false

    McpConnector:
      type: object
      title: McpConnector
      description: >-
        A connector **type**: a kind of system GenAIx knows how to talk to, not an address.
        Read-only - types come from GenAIx configuration and cannot be added, removed or
        changed through this API. A user creates `McpConnection`s of a type, each with its own
        URL.
      required: [type, title, transport, auth, multiple]
      properties:
        type:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,31}$'
          description: >-
            Stable slug, used in `McpConnection.connector`, in
            `Workflow.required_connectors` and in `auth.required` events. Same pattern as the
            manifest's `required_connectors[].type`.
          examples:
            - cms
        title:
          type: string
        description:
          type: string
        transport:
          type: string
          enum: [streamable_http]
          description: >-
            Only MCP streamable HTTP in Phase One. An enum rather than a constant so other
            transports stay additive.
        auth:
          $ref: '#/components/schemas/McpConnectorAuth'
        multiple:
          type: boolean
          description: >-
            Whether a user may hold several connections of this type. `true` for `cms`,
            because GenAIx can be connected to more than one CMS; that is exactly why the URL
            belongs to the connection and not to the type.
        url_template:
          type: string
          description: >-
            The shape a URL of this type takes, for a client assembling one. Not binding and
            not a format to parse.
          examples:
            - '{cms_base_url}/mcp'
        default_url:
          type: string
          format: uri
          description: >-
            The address this installation is configured for, when it has one. Non-binding: it
            is the URL of the auto-created default connection, and a convenience for a client
            building one. Absent when the installation configures none.
        tool_groups:
          type: array
          description: >-
            Tool groups a connection of this type can expose. What a given user actually gets
            is role-bound and narrower.
          items:
            type: string
        required_by_workflows:
          type: array
          description: >-
            Workflow ids that cannot run without an authorized connection of this type, that
            is those declaring it in `required_connectors` without `optional: true`.
          items:
            type: string
      additionalProperties: false

    McpConnection:
      type: object
      title: McpConnection
      description: >-
        One user's connection to a concrete instance of a connector type: the type, the URL,
        a label, whether it is the default for that type, and its current reachability and
        authorization.
      required: [id, connector, url, label, default, created_at, status, authorization_status]
      properties:
        id:
          type: string
          format: uuid
        connector:
          type: string
          description: The connector type, matching an `McpConnector.type`.
          examples:
            - cms
        url:
          type: string
          format: uri
          description: >-
            Where this connection points. Supplied by the client, not derived by GenAIx.
            `https` is required except for `localhost` and `127.0.0.1`; credentials, query
            strings and fragments in the URL are rejected.
          examples:
            - https://cms.example.com/mcp
        label:
          type: string
          maxLength: 200
          description: >-
            Human-readable name, so a user with several connections of a type can tell them
            apart. Always present (since `1.0.0-rc.2`): the client's value, else the URL
            host; the auto-created default connection carries the installation's configured
            label.
          examples:
            - Acme GmbH demo CMS
        default:
          type: boolean
          description: >-
            Whether this is the connection a session uses for this connector type when
            `context.connection_ids` names none. Exactly one connection per type carries it
            while the user has any.
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/McpConnectionStatus'
        authorization_status:
          $ref: '#/components/schemas/McpAuthorizationStatus'
      additionalProperties: false

    McpConnectionCreate:
      type: object
      title: McpConnectionCreate
      required: [connector, url]
      properties:
        connector:
          type: string
          description: A connector type from `GET /mcp/connectors`. Unknown is `422`.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            The instance to connect to. `https` required, except `http` for `localhost` and
            `127.0.0.1`. No embedded credentials, no query string, no fragment.
        label:
          type: string
          maxLength: 200
        default:
          type: boolean
          default: false
          description: >-
            Make this the default for its connector type, moving the flag off the previous
            holder. The first connection of a type is the default regardless.
      additionalProperties: false

    McpConnectionPatch:
      type: object
      title: McpConnectionPatch
      description: >-
        Partial update. Changing `url` re-points the connection at a different system and
        therefore **drops the stored credential**, because a credential issued by the old
        system proves nothing about the new one.
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        label:
          type: string
          maxLength: 200
        default:
          type: boolean
      additionalProperties: false
      minProperties: 1

    McpAuthorizationStatus:
      type: string
      title: McpAuthorizationStatus
      description: |
        - `authorized`: a credential is registered and the server accepted it at
          `verified_at`.
        - `unauthorized`: nothing is registered for this user and server.
        - `pending`: an `oauth2` flow has been started and is waiting for the user to come
          back through the redirect. Only reachable for `auth_type: oauth2`.
        - `invalid`: a credential is registered and the server refused it.
        - `expired`: a credential is registered and is past its known expiry.

        Anything but `authorized` removes every workflow that requires the connector from
        `capabilities.workflows`, and makes a run that needs it fail with `424` and
        `genaix_code: mcp_authorization_required` - unless the session carries its own
        credential for the connection, which is checked first and is enough on its own.
      enum: [authorized, unauthorized, pending, invalid, expired]

    McpAuthorization:
      type: object
      title: McpAuthorization
      description: |
        One user's **standing** authorization of one MCP connection, verified live against
        the connection's URL when read. The credential itself is never part of this object.

        Standing means it belongs to the user rather than to a task: it survives every
        session and is used by any run that has no session credential for the connection.
        It is optional, and it is the path for the non-integrated GenAIx UI and for tooling,
        where there is no client minting a token per task. The integrated path registers a
        credential per session at `/sessions/{session_id}/authorizations/{connection_id}`,
        and where both exist the session one is used.
      required: [connection_id, connector, user, status, auth_type]
      properties:
        connection_id:
          type: string
          format: uuid
        connector:
          type: string
          description: The connection's connector type, repeated so a client needs no second call.
        user:
          type: object
          description: >-
            The subject this authorization belongs to, the same opaque owner key
            `X-GCMS-Subject` carries. GenAIx holds no other identity for it.
          required: [subject]
          properties:
            subject:
              type: string
          additionalProperties: false
        status:
          $ref: '#/components/schemas/McpAuthorizationStatus'
        auth_type:
          $ref: '#/components/schemas/McpConnectorAuthType'
        resource:
          type: string
          format: uri
          description: >-
            The connection's canonical resource URI, RFC 8707 `resource`, normally the
            connection `url`. Echoed here so the same string can be sent as the OAuth
            `resource` parameter without renaming.
        authorization_server:
          type: string
          format: uri
          description: >-
            The authorization server this credential came from, one of the connector's
            RFC 9728 `authorization_servers`. Present for `auth_type: oauth2`.
        scopes_granted:
          type: array
          description: >-
            Scopes this user's credential actually carries, as opposed to the
            `scopes_supported` the server advertises. Present for `auth_type: oauth2`.
          items:
            type: string
        token_name:
          type: string
          description: >-
            Name of the registered credential on the server side, for `bearer`.
            Display and bookkeeping only.
        registered_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
          description: When GenAIx last called the server with this credential.
        expires_at:
          type: string
          format: date-time
          description: Known expiry. Absent when the credential does not expire or the expiry is unknown.
        message:
          type: string
          description: Short diagnostic when `status` is not `authorized`.
        how_to_authorize:
          $ref: '#/components/schemas/McpHowToAuthorize'
      additionalProperties: false

    McpHowToAuthorize:
      title: McpHowToAuthorize
      description: >-
        What the client has to do to reach `authorized`, shaped by the server's auth type.
        Present whenever `status` is not `authorized`.
      oneOf:
        - type: object
          title: BearerTokenInstructions
          required: [type, instructions]
          properties:
            type:
              type: string
              const: bearer
            instructions:
              type: string
              description: Human-readable steps, safe to show to the end user.
            token_name:
              type: string
              description: >-
                The name the client should give the token it creates, so a later
                registration can find and replace it. Fixed format since `1.0.0-rc.2`:
                `genaix-<installation slug>` for a standing credential and
                `genaix-<session id>` for a session credential, the slug being the
                installation name lower-cased with runs of non-alphanumerics replaced by
                `-`. A client that keys its token bookkeeping on the name can rely on it.
              examples:
                - genaix-acme-gmbh-demo-cms
          additionalProperties: false
        - type: object
          title: OAuth2Instructions
          required: [type]
          properties:
            type:
              type: string
              const: oauth2
            authorization_url:
              type: string
              format: uri
              description: >-
                Where to send the user, present once the flow has been started with
                `PUT {"auth_type": "oauth2", "action": "start"}`. GenAIx built it after
                protected-resource and authorization-server metadata discovery, and it
                already carries the PKCE challenge, the `state` and the `resource`
                indicator. The client only redirects: the code verifier, the `state` and
                the `iss` check stay server-side, so nothing secret passes through the
                client.
            instructions:
              type: string
          additionalProperties: false

    McpAuthorizationRequest:
      title: McpAuthorizationRequest
      description: >-
        Body of `PUT /mcp/connections/{connection_id}/authorization`. `auth_type` must match
        the `auth.type` declared by the connection's connector type, otherwise the call is
        `422`.
      oneOf:
        - $ref: '#/components/schemas/BearerTokenAuthorizationRequest'
        - $ref: '#/components/schemas/OAuth2AuthorizationRequest'
      discriminator:
        propertyName: auth_type
        mapping:
          bearer: '#/components/schemas/BearerTokenAuthorizationRequest'
          oauth2: '#/components/schemas/OAuth2AuthorizationRequest'

    BearerTokenAuthorizationRequest:
      type: object
      title: BearerTokenAuthorizationRequest
      description: >-
        A bearer token the client obtained out of band, the default integration path of the
        MCP ecosystem. GenAIx verifies it against the server before storing it encrypted,
        injects it as `Authorization: Bearer` on that user's outbound calls, and never logs
        or returns it.
      required: [auth_type, token]
      properties:
        auth_type:
          type: string
          const: bearer
        token:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true
        token_name:
          type: string
          maxLength: 255
          description: >-
            The name the credential carries on the target system, for display and for
            replacing it later. Defaults to a name derived from the installation.
        expires_at:
          type: string
          format: date-time
          description: >-
            Expiry the client set when creating the token, so GenAIx can report `expired`
            without waiting for a refusal.
      additionalProperties: false

    OAuth2AuthorizationRequest:
      type: object
      title: OAuth2AuthorizationRequest
      description: |
        Starts the MCP OAuth flow for a server whose `auth.type` is `oauth2`. The only
        action is `start`: GenAIx performs protected-resource and authorization-server
        metadata discovery, generates the PKCE verifier, challenge and `state`, and answers
        `200` with `status: pending` and `how_to_authorize.authorization_url`. The client
        redirects the user there and nothing else.

        The code exchange happens on a GenAIx-side callback, which validates `state` and
        `iss` and flips the authorization to `authorized`. Deliberately not modelled as a
        client call: keeping the verifier, the state and the issuer check server-side is
        both safer and what every MCP host does.

        No Phase One server uses this.
      required: [auth_type, action]
      properties:
        auth_type:
          type: string
          const: oauth2
        action:
          type: string
          enum: [start]
          description: >-
            Only `start`. Reserved as an enum so a later `refresh` is additive.
        scopes:
          type: array
          description: >-
            Optional subset of the server's `scopes_supported` to request. Omitted means
            everything the module needs.
          items:
            type: string
      additionalProperties: false
      x-open-question: >-
        The callback route that completes the flow is implied by this design but not part of
        v1, because no Phase One MCP server supports oauth2. Simplest reading taken: it
        lives outside /api/v1 as a GenAIx-side redirect target, and is specified together
        with the first oauth2 server.

    McpConnectionSummary:
      type: object
      title: McpConnectionSummary
      description: >-
        One of the caller's MCP connections as `GET /me` reports it: enough to decide whether
        anything needs fixing, without the reachability detail that `/mcp/connections` adds.
      required: [id, connector, url, label, default, authorization_status]
      properties:
        id:
          type: string
          format: uuid
        connector:
          type: string
          description: Connector type, for example `cms`.
        label:
          type: string
        url:
          type: string
          format: uri
        default:
          type: boolean
        authorization_status:
          $ref: '#/components/schemas/McpAuthorizationStatus'
      additionalProperties: false

    Capabilities:
      type: object
      title: Capabilities
      description: >-
        What this installation offers to this user. A client reads it once at start-up
        to decide which workflows it may offer and how large an upload it may attempt.
      required: [workflows, upload_max_bytes, models]
      properties:
        workflows:
          type: array
          description: >-
            Workflow ids this caller may start: a subset of the ids in `GET /workflows`. The
            narrowing happens **server-side** and combines whether the caller holds an
            `authorized` connection for every non-optional entry of the workflow's
            `required_connectors`, the module's own rules, and the installation
            configuration. It does **not** involve group membership: GenAIx is not told which
            groups the caller is in, and permission is enforced by the target system on every
            tool call anyway. A client cannot reproduce the calculation and **MUST NOT** try:
            offer exactly the ids returned here, and re-read them after registering an
            authorization, because a connection that becomes authorized widens the list.
          items:
            type: string
        upload_max_bytes:
          type: integer
          format: int64
          description: Per-file upload limit. Default 26214400 (25 MB).
          examples:
            - 26214400
        upload_media_types:
          type: array
          description: Accepted media types for session uploads.
          items:
            type: string
        models:
          type: array
          description: Model ids the user may select per session or per message.
          items:
            type: string
        default_model:
          type: string
        events_retention_hours:
          type: integer
          minimum: 168
          description: >-
            How long this installation keeps session events available for replay through
            `GET /sessions/{session_id}/events`. Absent means no pruning, which is the
            Phase One behaviour: events live as long as the session. When present it is at
            least 168 (7 days), and a client that needs to resume after a longer gap
            re-hydrates from the message history instead of the stream.
          examples:
            - 720
        verbatim_units:
          type: array
          description: Verbatim granularities this installation can prove.
          items:
            type: string
            enum: [chars, blocks, files]
      additionalProperties: false

    # ------------------------------------------------------------- references

    ContextReference:
      type: object
      title: ContextReference
      description: |
        A typed pointer to something the agent should consider. Context is **never**
        plain text: an at-mention, a selection in a content tree, a guideline
        and an uploaded file all arrive as one of these.

        `id` is a string because CMS object ids are integers while session file ids are
        UUIDs and guideline ids are slugs. Clients send the id exactly as they received
        it.
      required: [type, id]
      properties:
        type:
          type: string
          enum:
            - node
            - folder
            - page
            - file
            - image
            - template
            - construct
            - guideline
            - language
            - session_file
            - url
            - document
        id:
          type: string
          maxLength: 512
          description: >-
            CMS object id, session file UUID, guideline slug, language code, URL, or the
            id of a `document`: a source outside the CMS and outside the session, such as
            a page of GenAIx's own knowledge corpus (since `1.0.0-rc.2`; a `citation` part
            over a non-CMS source points here, `label` carrying its title).
          examples:
            - '8871'
        label:
          type: string
          maxLength: 512
          description: Display label as the user saw it. Informational.
        node_id:
          type: integer
          description: Required for CMS object types, because ids are node-scoped in practice.
        global_id:
          type: string
          description: The CMS global id when known, for stable cross-installation reference.
      additionalProperties: false
      examples:
        - type: page
          id: '8871'
          node_id: 3
          label: Garantiebedingungen
        - type: session_file
          id: 6b0d9e31-44a8-4c57-9f2e-8d1a3c7b5e02
          label: neue-nutzungsbedingungen-ab-q3.pdf
        - type: guideline
          id: tone-of-voice-de
          label: Tone of voice (German)

    CmsObjectRef:
      type: object
      title: CmsObjectRef
      description: >-
        A CMS object the session created or touched. Same information as a
        `ContextReference` of a CMS type, plus what happened to it.
      required: [type, id]
      properties:
        type:
          type: string
          enum: [node, folder, page, file, image, template, construct, user, group, form]
        id:
          type: integer
          format: int64
        global_id:
          type: string
        node_id:
          type: integer
        name:
          type: string
        url:
          type: string
          description: >-
            Published or preview path of the object, when it has one. Taken from the CMS
            tool's `ObjectRef` in the order `url`, then `niceUrl`, then `path` (since
            `1.0.0-rc.2`).
        connection_id:
          type: string
          format: uuid
          description: >-
            The MCP connection through which this object was reached, so an object stays
            unambiguous when a user is connected to more than one CMS. Present on objects a
            session recorded; absent on a reference the client supplied.
        operation:
          type: string
          enum: [created, updated, linked, published, taken_offline, deleted, read]
          description: >-
            What the session did with it most recently. `read` is recorded for
            single-object reads (`get_page`, `get_template`, `get_file`, `get_image`,
            `get_page_tags`, `get_page_versions`, `render_preview`, `get_construct`,
            `get_datasource`); search, list, count and permission calls touch nothing and
            report a `result_count` on their `tool.completed` instead (since `1.0.0-rc.2`).
            A later read never demotes a write.
        at:
          type: string
          format: date-time
      additionalProperties: false

    SessionContext:
      type: object
      title: SessionContext
      description: >-
        Where the session works and what it must take into account. Set on create,
        replaced wholesale by `PATCH /sessions/{id}`, and extended per message through
        the message's own `references`.
      properties:
        node_id:
          type: integer
          description: CMS node the session works in.
        folder_id:
          type: integer
          description: Target folder, derived if absent.
        language:
          type: string
          description: Content language code, derived if absent.
          examples:
            - de
        template_id:
          type: integer
          description: Target template, derived if absent.
        publish_at:
          type: string
          format: date-time
          description: >-
            When the page is to be published, if the user decided it up front. Since
            `1.0.0-rc.2`; filled by a confirmed `settings_review` like the other three.
        references:
          type: array
          description: Everything the user pointed at, accumulated over the session.
          items:
            $ref: '#/components/schemas/ContextReference'
          default: []
        guidelines:
          type: array
          description: Guideline ids that apply to this session.
          items:
            type: string
          default: []
        connection_ids:
          type: array
          description: >-
            MCP connections this session works through. Omitted means the user's `default`
            connection of each connector type the workflow requires. Naming them explicitly is
            how a client picks which of several instances a session touches. A connection that
            is deleted or loses its authorization makes the next run fail with `424` and
            `genaix_code: mcp_authorization_required`.
          items:
            type: string
            format: uuid
          default: []
      additionalProperties: false
      examples:
        - node_id: 3
          folder_id: 42
          language: de
          template_id: 17
          references:
            - type: page
              id: '8871'
              node_id: 3
              label: Garantiebedingungen
          guidelines: [tone-of-voice-de, seo-basics]

    # ---------------------------------------------------------------- session

    SessionStatus:
      type: string
      title: SessionStatus
      description: |
        Session status machine:

        ```
        active <-> waiting_for_input
        active  -> released
        released -> published | review_requested | active | discarded
        any      -> archived
        ```

        `failed` is deliberately **not** here: a failure belongs to a run, and the
        session stays `active` so the user can retry.
      enum:
        - active
        - waiting_for_input
        - released
        - published
        - review_requested
        - discarded
        - archived

    SessionBase:
      type: object
      title: SessionBase
      description: >-
        The session fields themselves. `Session` is this, closed; `SessionCreated` is this
        plus the ids of the first message and its run. Nothing references `SessionBase`
        directly on the wire. Since `1.0.0-rc.2` `workflow_version`, `inputs` and
        `authorizations` are required, as every example already showed them; `intent` is
        present once the first message exists and `model` when the installation pins one.
      required:
        - id
        - workflow
        - workflow_version
        - inputs
        - status
        - context
        - owner
        - created_at
        - updated_at
        - last_activity_at
        - message_count
        - iteration
        - cms_objects
        - labels
        - authorizations
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
          description: >-
            User-set, or derived from the first user message when the client
            sent none.
        workflow:
          type: string
          description: Workflow module id. Immutable after creation.
          examples:
            - content_create
        workflow_version:
          type: string
          description: >-
            Version of the workflow module this session started under, recorded so the
            session keeps reporting against that revision after the installation upgrades.
          examples:
            - 1.2.0
        inputs:
          type: object
          description: >-
            The module inputs this session was started with, validated against the module's
            `inputs_schema`. Assembled from `context`, the attached files and the first
            message; stored so a run can be reproduced and a fixture can be generated from
            it.
          additionalProperties: true
        status:
          $ref: '#/components/schemas/SessionStatus'
        intent:
          type: string
          readOnly: true
          description: >-
            The user's original request in their own words: the plain rendering of the
            first user message, the same string that message's `content` carries. Derived
            by GenAIx, never sent by a client. Absent or empty until the first message
            arrives, which is the normal state of a session created without one. Searched,
            with `title`, by the session list's `q`.
        context:
          $ref: '#/components/schemas/SessionContext'
        owner:
          type: object
          description: >-
            The subject that owns the session, the opaque key from `X-GCMS-Subject`. GenAIx
            holds no name, login or id for it.
          required: [subject]
          properties:
            subject:
              type: string
              examples:
                - sub_c3f1a07d9e5b4826
          additionalProperties: false
        model:
          type: string
          description: Model id used for this session unless a message overrides it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
          description: Sort key when listing sessions.
        message_count:
          type: integer
          minimum: 0
        iteration:
          type: integer
          minimum: 0
          description: >-
            Number of user turns. The planning documents call this the iteration count.
        active_run_id:
          type: string
          format: uuid
          description: >-
            Present while a run is `queued`, `running`, `waiting_for_input` or `cancelling`.
            Its changes are implied by the run events (`run.started` sets it, the terminal
            run event clears it) and are not announced by a `session.updated` of their own
            (since `1.0.0-rc.2`); the closing `session.updated` before the terminal event
            lists it in `changed` together with `updated_at` and `last_activity_at`.
        summary:
          type: string
          description: Rolling one-paragraph summary of what the session achieved.
        cms_objects:
          type: array
          description: CMS objects this session created or touched.
          items:
            $ref: '#/components/schemas/CmsObjectRef'
        labels:
          type: array
          items:
            type: string
            maxLength: 64
        authorizations:
          type: array
          description: >-
            The MCP connections this session holds a credential for, in short form. Present
            on a session created with `authorizations` and on any session a client has
            registered one for. An empty array means the session has none of its own and
            falls back to the caller's standing authorizations.
          items:
            $ref: '#/components/schemas/SessionAuthorizationSummary'

    Session:
      title: Session
      description: One user task.
      allOf:
        - $ref: '#/components/schemas/SessionBase'
      unevaluatedProperties: false

    SessionCreated:
      title: SessionCreated
      description: |
        The `201` body of `POST /sessions`: the session, plus the ids the call produced
        when it carried a `message`.

        `run_id`, `message_id` and `events_url` are present exactly when a `message` was
        sent, and absent otherwise, so the two-call flow sees the same body a plain
        `Session` has always had. `run_id` is the same value as `active_run_id` while that
        run is alive; it stays meaningful in the response after the run ends, which
        `active_run_id` does not.
      allOf:
        - $ref: '#/components/schemas/SessionBase'
      properties:
        message_id:
          type: string
          format: uuid
          description: The stored first user message.
        run_id:
          type: string
          format: uuid
          description: The run started for that message.
        events_url:
          type: string
          format: uri-reference
          description: Convenience link to the event stream positioned before that run.
      unevaluatedProperties: false

    SessionAuthorizationStatus:
      type: string
      title: SessionAuthorizationStatus
      description: |
        - `authorized`: the credential is registered for this session and the connection
          accepted it at `verified_at`.
        - `invalid`: it is registered and the connection refuses it. The credential was
          revoked on the target system, or it never belonged to this user.
        - `expired`: `expires_at` has passed. GenAIx stops using it at that moment.

        There is no `unauthorized` member: a session that has no credential for a
        connection simply has no entry for it.
      enum: [authorized, invalid, expired]

    SessionAuthorizationCredential:
      type: object
      title: SessionAuthorizationCredential
      description: >-
        The credential fields of a session authorization. `SessionAuthorizationRequest` is
        this, closed; `SessionAuthorizationCreate` is this plus the connection it belongs
        to. Nothing references it directly on the wire.
      required: [auth_type, token]
      properties:
        auth_type:
          type: string
          enum: [bearer]
          description: >-
            `bearer` is the only value in Phase One. An enum rather than a constant so the
            `oauth2` path that already exists for standing authorizations stays additive
            here.
        token:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true
          description: >-
            The token, obtained by the client from the target system. GenAIx verifies it
            live, stores it encrypted and bound to this session, and never returns, logs or
            exposes it. The model never sees it: tokens are attached to outbound MCP calls
            by the harness, outside the model's context.
        token_name:
          type: string
          maxLength: 255
          description: >-
            The name the token carries on the target system, for display and for replacing
            it later. A session-scoped token is conventionally named after the session.
          examples:
            - genaix-9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
        expires_at:
          type: string
          format: date-time
          description: >-
            When the token stops being valid on the target system. GenAIx stops using the
            credential and deletes it at this moment without waiting for a refusal, and
            reports `expired` until the client registers a new one. Omitted means GenAIx
            learns of expiry only from a refusal, which is why a client should always send
            it.

    SessionAuthorizationRequest:
      title: SessionAuthorizationRequest
      description: >-
        Body of `PUT /sessions/{session_id}/authorizations/{connection_id}`. The path names
        the connection; this carries only the credential. Idempotent: registering again
        replaces what was there.
      allOf:
        - $ref: '#/components/schemas/SessionAuthorizationCredential'
      unevaluatedProperties: false

    SessionAuthorizationCreate:
      title: SessionAuthorizationCreate
      description: >-
        One entry of `SessionCreate.authorizations`. Same credential fields as
        `SessionAuthorizationRequest` plus the connection it is for, because there is no
        path segment to carry it on the create call.
      allOf:
        - $ref: '#/components/schemas/SessionAuthorizationCredential'
      required: [connection_id]
      properties:
        connection_id:
          type: string
          format: uuid
          description: >-
            One of the caller's connections, from `GET /mcp/connections`. `404` with
            `mcp_connection_not_found` when it is not theirs.
      unevaluatedProperties: false

    SessionAuthorization:
      type: object
      title: SessionAuthorization
      description: |
        One connection's authorization **for one session**, verified live against the
        connection's URL when written and when read. The credential itself is never part of
        this object and is never returned by any route.

        A session authorization is the narrow credential the integrated path uses: it is
        registered for this session, used only by this session's runs, and it dies with the
        session. That bounds what a GenAIx-side incident could expose to the sessions that
        are open at the time, and it makes revocation on the target system immediate.

        **Lifetime.** GenAIx stops using the credential and deletes the stored token when
        any of these happens first:

        - the session reaches `published`, `discarded` or `archived`;
        - the client calls `DELETE /sessions/{session_id}/authorizations/{connection_id}`;
        - `expires_at` passes.

        It is **kept** through `released` and `review_requested`, because publishing and
        requesting review still act on the CMS.

        **Precedence.** When a session authorization and a standing per-user authorization
        both exist for the same connection, the session one is used. The standing one is
        the fallback for clients that do not register per session.
      required: [connection_id, connector, status, registered_at]
      properties:
        connection_id:
          type: string
          format: uuid
        connector:
          type: string
          description: The connection's connector type, repeated so a client needs no second call.
          examples:
            - cms
        session_id:
          type: string
          format: uuid
          description: The session this credential is bound to.
        status:
          $ref: '#/components/schemas/SessionAuthorizationStatus'
        auth_type:
          type: string
          enum: [bearer]
        token_name:
          type: string
          description: The name the token carries on the target system, when the client sent one.
        expires_at:
          type: string
          format: date-time
          description: When the credential stops being valid, as the client declared it.
        registered_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
          description: When GenAIx last confirmed the credential with the connection.
        last_error:
          type: string
          description: >-
            What the connection said when it refused, present for `invalid`. Safe to show;
            it never contains the credential.
      additionalProperties: false

    SessionAuthorizationSummary:
      type: object
      title: SessionAuthorizationSummary
      description: >-
        The session's authorizations in short form, as carried on `Session` and on the
        workflow view. Enough to tell whether the session can still act on a connection;
        `GET /sessions/{session_id}/authorizations` has the detail.
      required: [connection_id, status]
      properties:
        connection_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SessionAuthorizationStatus'
        expires_at:
          type: string
          format: date-time
      additionalProperties: false

    SessionAuthorizationPage:
      type: object
      title: SessionAuthorizationPage
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionAuthorization'
      additionalProperties: false

    SessionCreate:
      type: object
      title: SessionCreate
      description: |
        `message` is optional and is the same body as
        `POST /sessions/{session_id}/messages`. Sending it creates the session, derives
        `intent` from the message's plain rendering, appends the message as the first user
        turn and starts its run, all in one call; the `201` is a `SessionCreated` carrying
        `run_id`, `message_id` and `events_url`. Leaving it out creates an empty session
        whose first turn is posted separately.

        `message.files` and `file_ref` parts inside `message.parts` are rejected with
        `422`: files are per session, so no file id can exist before this call returns.

        `intent` is **not** a member of this schema. It is derived from the first user
        message and is read-only.
      properties:
        workflow:
          type: string
          default: free_chat
          description: >-
            Workflow module id from `GET /workflows`. `422` with `unknown_workflow` when no
            module of that id is installed. Availability (`capabilities.workflows`,
            `Workflow.available`) is a hint for the client, not a creation rule (since
            `1.0.0-rc.2`): a session of a workflow the caller cannot yet act in is created,
            and its first run answers `auth.required` and fails with `424`
            `mcp_authorization_required` until a credential exists; a credential sent in
            `authorizations` on this call counts for this session at once.
        title:
          type: string
          maxLength: 300
        context:
          $ref: '#/components/schemas/SessionContext'
        model:
          type: string
          description: Must be one of `capabilities.models`.
        labels:
          type: array
          items:
            type: string
            maxLength: 64
        message:
          $ref: '#/components/schemas/MessageCreate'
        authorizations:
          type: array
          maxItems: 10
          description: >-
            Credentials to register on the new session, one per connection, verified before
            the session is created. Sending them here is what lets a client create the token
            on the target system, create the session and send the first message in a single
            round trip.
          items:
            $ref: '#/components/schemas/SessionAuthorizationCreate'
      additionalProperties: false

    SessionPatch:
      type: object
      title: SessionPatch
      description: >-
        Partial update. Absent fields are left alone. `context` is replaced wholesale when
        present. `workflow`, `status` and every other field of `Session` are absent on
        purpose and `additionalProperties` is `false`, so sending one is a `422`
        validation error rather than a silent no-op. Status changes go through
        `POST /sessions/{session_id}/transitions`; the workflow is fixed at creation.
      properties:
        title:
          type: string
          maxLength: 300
        context:
          $ref: '#/components/schemas/SessionContext'
        labels:
          type: array
          items:
            type: string
            maxLength: 64
      additionalProperties: false
      minProperties: 1

    TransitionRequest:
      type: object
      title: TransitionRequest
      required: [action]
      properties:
        action:
          type: string
          enum: [release, reopen, publish, request_review, discard, archive]
        comment:
          type: string
          maxLength: 4000
          description: >-
            Shown in the approval chain and stored as a system message in the session
            history.
        at:
          type: string
          format: date-time
          description: >-
            Only for `publish`: schedule the publication instead of publishing now.
            Passed through to the CMS publish-at timestamp.
        acknowledge_checks:
          type: array
          description: >-
            Ids of **non-blocking** failing checks the user has seen and accepts. They are
            **required** to get past them: a transition with unacknowledged non-blocking
            failures is refused with `409` and `genaix_code: quality_gate_failed`, listing
            them in `acknowledgeable_checks`. Repeating the call with those ids here lets the
            transition proceed and records the acceptance on each `Check` as
            `acknowledged_by` and `acknowledged_at`. A **blocking** check can never be
            acknowledged away: listing one has no effect and the call is refused again until
            the finding is fixed and the gate re-runs.
          items:
            type: string
          examples:
            - [chk-alt-text]
      additionalProperties: false

    TransitionAccepted:
      type: object
      title: TransitionAccepted
      description: A transition that starts a run.
      required: [run_id, session]
      properties:
        run_id:
          type: string
          format: uuid
        session:
          $ref: '#/components/schemas/Session'
      additionalProperties: false

    SessionPage:
      type: object
      title: SessionPage
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page. `null` on the last page.
      additionalProperties: false

    # -------------------------------------------------------------------- run

    RunStatus:
      type: string
      title: RunStatus
      description: |
        ```
        queued -> running -> completed
                     |  \-> waiting_for_input -> running
                     |--> failed
                     \--> cancelling -> cancelled
        ```
      enum:
        - queued
        - running
        - waiting_for_input
        - cancelling
        - completed
        - failed
        - cancelled

    Run:
      type: object
      title: Run
      description: One agent execution, started by a user message or by a transition.
      required: [id, status, started_at, step_count]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatus'
        trigger:
          type: string
          enum: [message, transition, retry]
          description: What started the run.
        message_id:
          type: string
          format: uuid
          description: The user message that started the run, when `trigger` is `message`.
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Present once the run reached a terminal status.
        error:
          $ref: '#/components/schemas/Problem'
        usage:
          $ref: '#/components/schemas/Usage'
        step_count:
          type: integer
          minimum: 0
        tool_call_count:
          type: integer
          minimum: 0
        cancel_reason:
          type: string
      additionalProperties: false

    CancelRequest:
      type: object
      title: CancelRequest
      properties:
        reason:
          type: string
          maxLength: 500
      additionalProperties: false

    Usage:
      type: object
      title: Usage
      description: Token and time accounting of a run or an assistant message.
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0
        model:
          type: string
        duration_ms:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
      additionalProperties: false

    # ------------------------------------------------------------------ files

    FileKind:
      type: string
      title: FileKind
      description: >-
        Which subdirectory of `<base>/sessions/<session_id>/` the file lives in:
        `uploads`, `artifacts` or `cms`.
      enum: [upload, artifact, cms_snapshot]

    FileMode:
      type: string
      title: FileMode
      description: |
        How an uploaded file's wording is treated.

        `verbatim` locks the upload's wording. GenAIx extracts the file's text, splits it
        into blocks and hashes each block; the `verbatim_identical` gate then verifies that
        every block the agent **reused** appears character-identical in the produced CMS
        content, and reports a `Check` with `verification.unit: blocks`. Putting the file
        into a message as a `file_ref` part with `mode: verbatim` declares the same thing
        for that turn.

        What "reused" means is fixed since `1.0.0-rc.2`: the file is a source the agent
        quotes from, not a document it must reproduce. A block counts as reused when the
        page carries it, its opening, or a stretch that resembles it; a shortened or
        re-worded copy is a deviation, an omitted block is not a deviation. A module may
        offer a stricter reading through its own inputs (a `verbatim_mode` of `whole_file`
        requires every block), and the S1 example, which locks a 14-page PDF and proves the
        one passage the page quotes with `unit: chars`, is the default reading. The block
        rule: blocks are blank-line separated runs of the extracted text with inner
        whitespace collapsed, Unicode NFC; a PDF's blank lines come from its layout, a
        Word document's paragraphs and table rows are blocks, HTML block-level elements are
        blocks; each hash is SHA-256 over the NFC UTF-8 of the block, nothing else
        normalised. A third-party gate that splits the target the same way agrees with
        GenAIx.

        `source` (the default) makes the file reference material: the agent may read,
        summarise and paraphrase it, and nothing about it is locked. Quoting from a
        `source` file is still possible and still verifiable - a `verbatim` part whose
        `source` is that file's id locks the passage it quotes.

        Extraction happens in GenAIx. PDF, Word and HTML become text before the agent sees
        them, the model never receives raw binary, and the hashes are taken from the same
        extracted text the gate later compares against.
      enum: [source, verbatim]
      default: source

    File:
      type: object
      title: File
      required: [id, kind, name, media_type, size, mode, sha256, created_at, created_by, download_url]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/FileKind'
        name:
          type: string
          description: Sanitised single path segment, de-duplicated on collision.
        media_type:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        mode:
          $ref: '#/components/schemas/FileMode'
        purpose:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Hash of the bytes as uploaded. It identifies the upload, and it is the proof
            for a file reused unchanged (`verification.unit: files`). Verbatim *wording*
            is proven against the extracted text instead, block by block.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          enum: [user, agent]
        artifact_type:
          type: string
          enum: [page_draft, construct, report, plan, gate_evidence, other]
          description: >-
            Present when `kind` is `artifact`. `gate_evidence` is the raw output of a quality
            gate, referenced by `GateResult.evidence_file_id`.
        cms_ref:
          $ref: '#/components/schemas/CmsObjectRef'
        download_url:
          type: string
          format: uri-reference
        run_id:
          type: string
          format: uuid
          description: The run that produced the file, for agent-created files.
      additionalProperties: false

    FilePage:
      type: object
      title: FilePage
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/File'
        next_cursor:
          type: [string, 'null']
      additionalProperties: false

    # --------------------------------------------------------------- messages

    MessageRole:
      type: string
      title: MessageRole
      enum: [user, assistant, system]

    Message:
      type: object
      title: Message
      description: |
        One turn. Both user and assistant turns are expressed as `parts`, so history and
        live stream share one renderer. System messages record transitions and their
        comments.

        The two sides use two registries. A **user** message carries `UserMessagePart`
        items: exactly the parts the client sent, in the order the user composed them. An
        **assistant** or **system** message carries `MessagePart` items. The plain text of
        a user message is not stored separately; it is reproducible from the parts with
        the rendering rules on `POST /sessions/{session_id}/messages`.
      required: [id, role, created_at, parts]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MessageRole'
        created_at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
          description: The run that produced an assistant message, or that a user message started.
        interaction_id:
          type: string
          format: uuid
          description: >-
            The interaction this message answers. Set on the user message GenAIx stores
            when a `settings_review` is resolved: its `parts` are exactly the confirmed
            `setting` parts, so the settings appear in the history as the user's own
            decision rather than as something the agent assumed.
        parts:
          type: array
          description: >-
            `UserMessagePart` items on a user message, `MessagePart` items on an assistant
            or system message. The `anyOf` covers both registries; `role` says which one
            applies.
          items:
            anyOf:
              - $ref: '#/components/schemas/MessagePart'
              - $ref: '#/components/schemas/UserMessagePart'
        references:
          type: array
          description: >-
            What the user pointed at. Derived from the message's `reference` parts when it
            has them.
          items:
            $ref: '#/components/schemas/ContextReference'
          default: []
        files:
          type: array
          description: >-
            Session file ids attached to a user message. Derived from the message's
            `file_ref` parts when it has them.
          items:
            type: string
            format: uuid
          default: []
        usage:
          $ref: '#/components/schemas/Usage'
      additionalProperties: false

    MessageCreate:
      type: object
      title: MessageCreate
      description: |
        A user turn. Send `parts`, the canonical ordered structure, or `content`, its
        plain rendering. At least one of the two is required, and `parts` wins when both
        are present.

        With `parts`, the server derives `content`, `references` and `files` from them.
        Without `parts`, `content` is the message and `references` and `files` carry what
        the user pointed at and attached.

        `parts` is validated **strictly**: a part whose `type` is outside `UserPartType`
        is `422` with `genaix_code: validation_failed` and a JSON Pointer at the part.
        The rendering rules and what GenAIx does with each part kind are on the operation.
      anyOf:
        - required: [parts]
        - required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32000
          description: >-
            The plain rendering of the message. Required when `parts` is absent. When
            `parts` is present the server derives this from the parts and ignores any
            value sent here.
        parts:
          type: array
          minItems: 1
          maxItems: 500
          description: >-
            The canonical structure of the message: the typed elements the user composed,
            in order. A closed registry - unknown part types are rejected, not ignored.
          items:
            $ref: '#/components/schemas/UserMessagePart'
        references:
          type: array
          description: >-
            What the user pointed at, for a client with no part-aware composer. Derived
            from the `reference` parts when `parts` is present, so a client sending parts
            leaves this out.
          items:
            $ref: '#/components/schemas/ContextReference'
        files:
          type: array
          description: >-
            Session file ids attached to this message. Derived from the `file_ref` parts
            when `parts` is present.
          items:
            type: string
            format: uuid
        reply_to_interaction:
          type: object
          description: >-
            Answer a pending interaction and continue in the same call. This is the one
            way to post a message while a run is waiting: the answer unblocks that run,
            the message joins it, and no new run is started. `answer` follows the kind of
            the interaction named here, so a `settings_review` is answered with
            `settings`.
          required: [interaction_id, answer]
          properties:
            interaction_id:
              type: string
              format: uuid
            answer:
              $ref: '#/components/schemas/InteractionAnswer'
          additionalProperties: false
        options:
          type: object
          properties:
            model:
              type: string
              description: Overrides the session model for this run. Must be in `capabilities.models`.
            mode:
              type: string
              enum: [plan_only, execute]
              default: execute
              description: >-
                `plan_only` makes the agent produce a plan and stop without writing to
                the CMS. `execute` lets it carry the plan out.
          additionalProperties: false
      additionalProperties: false

    MessageAccepted:
      type: object
      title: MessageAccepted
      required: [message_id, run_id, session_id]
      properties:
        message_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
          description: >-
            The run this message started, or - when the message carried
            `reply_to_interaction` for a run waiting on that interaction - the run the
            answer unblocked. A reply never starts a second run.
        session_id:
          type: string
          format: uuid
        events_url:
          type: string
          format: uri-reference
          description: Convenience link to the event stream positioned before this run.
      additionalProperties: false

    MessagePage:
      type: object
      title: MessagePage
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type: [string, 'null']
      additionalProperties: false

    # ------------------------------------------------------------------ parts

    PartType:
      type: string
      title: PartType
      description: |
        The message part registry of v1.0. Every member describes **data**, not a
        widget: the type says what the content means, never how to lay it out. A client
        is free to present a `table` as a chart or a `tree_view` as a flat list.

        A client **MUST** tolerate a value outside this list and **MUST** fall back to
        the `UnknownPart` rule: render the part's `text` field when present, otherwise
        skip the part silently.

        This registry is the **output** side: what an assistant or system message carries.
        What a client may *send* is the separate, closed `UserPartType` registry.
      enum:
        - text
        - status_note
        - tree_view
        - selectable_list
        - properties_list
        - image_grid
        - table
        - page_structure
        - construct_draft
        - api_call_log
        - citation
        - file_ref

    MessagePart:
      title: MessagePart
      description: |
        One element of a message. `type` discriminates. Parts carry data with a
        documented meaning and deliberately prescribe no presentation.

        **Forward compatibility (normative).** This `oneOf` is the set of part types
        defined in v1.0. A part whose `type` is not listed here is still valid on the
        wire. A client **MUST** apply the `UnknownPart` rule to it: render its `text`
        field when one is present, otherwise skip the part silently, and in neither case
        fail the message or drop the parts around it. The `discriminator` below exists
        for code generators; a generated client **MUST** keep a default branch.

        This is the **output** part model, used by assistant and system messages and by
        the `part.*` events. A user message carries `UserMessagePart` items instead, which
        are a closed set and are validated strictly on input.
      oneOf:
        - $ref: '#/components/schemas/TextPart'
        - $ref: '#/components/schemas/StatusNotePart'
        - $ref: '#/components/schemas/TreeViewPart'
        - $ref: '#/components/schemas/SelectableListPart'
        - $ref: '#/components/schemas/PropertiesListPart'
        - $ref: '#/components/schemas/ImageGridPart'
        - $ref: '#/components/schemas/TablePart'
        - $ref: '#/components/schemas/PageStructurePart'
        - $ref: '#/components/schemas/ConstructDraftPart'
        - $ref: '#/components/schemas/ApiCallLogPart'
        - $ref: '#/components/schemas/CitationPart'
        - $ref: '#/components/schemas/FileRefPart'
      x-part-type-registry:
        $ref: '#/components/schemas/PartType'
      x-unknown-part-fallback:
        $ref: '#/components/schemas/UnknownPart'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextPart'
          status_note: '#/components/schemas/StatusNotePart'
          tree_view: '#/components/schemas/TreeViewPart'
          selectable_list: '#/components/schemas/SelectableListPart'
          properties_list: '#/components/schemas/PropertiesListPart'
          image_grid: '#/components/schemas/ImageGridPart'
          table: '#/components/schemas/TablePart'
          page_structure: '#/components/schemas/PageStructurePart'
          construct_draft: '#/components/schemas/ConstructDraftPart'
          api_call_log: '#/components/schemas/ApiCallLogPart'
          citation: '#/components/schemas/CitationPart'
          file_ref: '#/components/schemas/FileRefPart'

    UnknownPart:
      type: object
      title: UnknownPart
      description: |
        **Not a wire type.** This schema states the normative fallback rule, which every
        client is required to implement. When a part's `type` is not a member of
        `PartType`, a client **MUST** treat the part as this schema: render `text` when
        present, otherwise skip the part silently. It **MUST NOT** fail the message,
        **MUST NOT** drop the remaining parts of the message, and **MUST NOT** show a
        raw JSON dump to the end user.

        This rule is what makes new part types additive rather than breaking. Producers
        **SHOULD** therefore always include a `text` field on any new part type, so that
        an older client degrades to something readable instead of nothing. The
        equivalent rule for the event stream is rule 1 of `info.description`, section
        "Forward compatibility".
      required: [type]
      properties:
        type:
          type: string
          description: Any value not in `PartType`.
        text:
          type: string
          description: Optional human-readable fallback the producer should always include.
      additionalProperties: true

    TextPart:
      type: object
      title: TextPart
      description: >-
        Prose. Streamed with `part.delta` carrying string chunks appended to `text`.
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
        format:
          type: string
          enum: [markdown, plain]
          default: markdown
      additionalProperties: false
      examples:
        - type: text
          format: markdown
          text: >-
            I read the update. The three substantive changes are the new free shipping
            threshold of 50 euro, a withdrawal period of 14 days from receipt of the
            goods, and warranty extended to 24 months.

    StatusNotePart:
      type: object
      title: StatusNotePart
      description: >-
        A short persisted note in the transcript, for things the agent did that deserve
        a line in the history but not a paragraph. Distinct from the transient `status`
        event, which is not persisted as a part.
      required: [type, text]
      properties:
        type:
          type: string
          const: status_note
        text:
          type: string
          maxLength: 500
        kind:
          type: string
          enum: [info, warning, skipped]
          default: info
      additionalProperties: false
      examples:
        - type: status_note
          kind: info
          text: Saved a snapshot of "Garantiebedingungen" for comparison.

    TreeViewPart:
      type: object
      title: TreeViewPart
      description: A hierarchy, used when the agent reports where in the content tree it
        will work.
      required: [type, nodes]
      properties:
        type:
          type: string
          const: tree_view
        label:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
      additionalProperties: false
      examples:
        - type: tree_view
          label: Candidate folders
          nodes:
            - id: '3'
              label: Acme GmbH
              type: node
              children:
                - id: '42'
                  label: Richtlinien
                  type: folder
                  ref:
                    type: folder
                    id: '42'
                    node_id: 3
                  children: []
                - id: '57'
                  label: Aktuelles
                  type: folder
                  ref:
                    type: folder
                    id: '57'
                    node_id: 3
                  children: []

    TreeNode:
      type: object
      title: TreeNode
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          description: CMS object type of this node.
        children:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
          default: []
        ref:
          $ref: '#/components/schemas/ContextReference'
        selected:
          type: boolean
      additionalProperties: false

    SelectableListPart:
      type: object
      title: SelectableListPart
      description: >-
        A list the user can pick from. A selection is sent back as a normal
        message, or as an interaction answer when the part accompanies an
        `interaction.requested` of kind `choice`.
      required: [type, items, multi]
      properties:
        type:
          type: string
          const: selectable_list
        label:
          type: string
        items:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
              description:
