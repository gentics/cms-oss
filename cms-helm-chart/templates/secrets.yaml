{{- $globalMariadb := (($.Values.global | default dict).mariadb) | default dict -}}
{{- $globalLicense := (($.Values.global | default dict).license) | default dict -}}
{{- $renderDbPassword := and $.Values.database.password (not $.Values.database.passwordSecret) (not $globalMariadb.enabled) -}}
{{- $renderLicense := and $.Values.cms.license.key (not $.Values.cms.license.secret) (not $globalLicense.key) -}}
{{- $renderNodeUserPassword := not $.Values.cms.nodeUserPasswordSecret -}}
{{- if or $renderDbPassword $renderLicense $renderNodeUserPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "cms.fullname" . }}
  labels:
    app: {{ template "cms.name" . }}
    chart: {{ template "cms.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  {{- if $renderDbPassword }}
  database-password: {{ .Values.database.password | b64enc | quote }}
  {{- end }}
  {{- if $renderLicense }}
  licensekey: {{ .Values.cms.license.key | b64enc | quote }}
  {{- end }}
  {{- if $renderNodeUserPassword }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "cms.fullname" .) }}
  {{- $nodeUserPassword := "" }}
  {{- if $.Values.cms.nodeUserPassword }}
    {{- $nodeUserPassword = $.Values.cms.nodeUserPassword }}
  {{- else if $existingSecret }}
    {{- $nodeUserPassword = index $existingSecret.data "node-user-password" | b64dec }}
  {{- else }}
    {{- $nodeUserPassword = randAlphaNum 24 }}
  {{- end }}
  node-user-password: {{ $nodeUserPassword | b64enc | quote }}
  {{- end }}
{{- end }}
