    post:
      operationId: createMcpConnection
      tags: [mcp]
      summary: Create a connection of a connector type
      description: |
        Creates a connection for this user: a connector type plus the URL of a concrete
        instance of it. The credential comes afterwards, through
        `PUT /mcp/connections/{connection_id}/authorization`.

        **URL rules.** `https` is required, except that `http` is allowed for `localhost` and
        `127.0.0.1` so a developer can point at a local CMS. Credentials embedded in the URL
        (`https://user:pass@host/...`) are rejected, because a credential belongs in the
        authorization, not in an address that gets logged. A query string or fragment is
        rejected as well. Violations are `422` with `genaix_code: validation_failed`.

        **The reachability probe is informational.** GenAIx sends an MCP `initialize` to the
        URL and records the outcome in `status`, but a probe that fails does **not** fail the
        call: the connection is created with `status.reachable: false` so a client can
        register a connection before the server is up. Only malformed input is refused.

        `409` with `genaix_code: mcp_connection_limit` when the user already holds
        `max_connections_per_connector` connections of this type, default 10. `409` when the
        connector's `multiple` is false and a connection of that type already exists. `422`
        with `validation_failed` for an unknown connector type, and (since `1.0.0-rc.2`)
        `422` with `validation_failed` at `/url` when this user already holds a connection
        of the same type at the same URL: two rows for one server would differ only in
        which credential wins.

        The first connection of a type is the default whether or not `default` is set.
        Passing `default: true` on a later one moves the flag off the previous holder.
      parameters:
        - $ref: '#/components/parameters/XGcmsSubject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpConnectionCreate'
            examples:
              cms:
                summary: Connect to the demo CMS
                value:
                  connector: cms
                  url: https://cms.example.com/mcp
                  label: Acme GmbH demo CMS
                  default: true
              second_cms:
                summary: A second CMS, not the default
                value:
                  connector: cms
                  url: https://staging.example.com/mcp
                  label: Staging
              localhost:
                summary: Plain http is allowed for localhost only
                value:
                  connector: cms
                  url: http://localhost:8080/mcp
                  label: Local dev CMS
      responses:
        '201':
          description: Created. `status` carries the probe result, whatever it was.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              example: /api/v1/mcp/connections/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnection'
              examples:
                created:
                  value:
                    id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                    connector: cms
                    url: https://cms.example.com/mcp
                    label: Acme GmbH demo CMS
                    default: true
                    created_at: '2026-10-07T09:14:20Z'
                    status:
                      reachable: true
                      checked_at: '2026-10-07T09:14:21Z'
                      server_info:
                        name: gentics-cms-mcp
                        version: 9.0.0-SNAPSHOT
                        protocol_version: '2026-07-28'
                    authorization_status: unauthorized
                created_unreachable:
                  summary: Registered before the server is up; the probe failed and that is fine
                  value:
                    id: 7f0b2a95-4c18-4e63-9d27-5a1c8e0b3f74
                    connector: cms
                    url: https://staging.example.com/mcp
                    label: Staging
                    default: false
                    created_at: '2026-10-09T07:55:02Z'
                    status:
                      reachable: false
                      checked_at: '2026-10-09T07:55:12Z'
                      message: connect timeout after 10000 ms
                    authorization_status: unauthorized
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            The per-user limit for this connector type is reached, or the type does not allow
            more than one connection.
          headers:
