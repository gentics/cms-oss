      operationId: postMessage
      tags: [messages]
      summary: Send a user message and start a run
      description: |
        Appends a user message to the session and starts exactly one run for it.

        ### What a user message is

        `parts` is the canonical structure of a user message: an ordered list of typed
        elements in the order the user composed them - text they typed, a folder or page
        they at-mentioned, a setting they picked, a quote that must survive word for
        word, a file they attached, a filter they selected. `content` is the **plain
        rendering** of those parts, so a client with no part-aware composer can send
        `content` alone and a client with one does not have to build the string itself.

        - `parts` present: the server derives `content` from the parts and ignores a
          `content` sent alongside it. `references` is derived from the `reference`
          parts and `files` from the `file_ref` parts.
        - `parts` absent: `content` is required, and `references` and `files` carry what
          the user pointed at and attached.

        The input side is **strict**. A part whose `type` is not a member of
        `UserPartType` is rejected with `422` and `genaix_code: validation_failed`,
        naming the offending part with a JSON Pointer. That is the deliberate opposite of
        the output side, where a part type a client does not know falls back to its
        `text`: an unknown part on output costs a client some presentation, an unknown
        part on input would silently drop something the user said.

        ### Plain rendering

        The rendering is what `content`, the history and the logs show, and it is the
        same for every producer:

        | Part | Renders as |
        | --- | --- |
        | `text` | the text itself |
        | `verbatim` | the text itself |
        | `reference` | `@[label]` |
        | `setting` | `#[key: value]` |
        | `file_ref` | `[[file name]]` |
        | `filter` | `#[label]` |

        Parts are concatenated in order with nothing inserted between them: the spacing
        belongs to the `text` parts. A literal `[` or `]` inside a label, a key, a value,
        a file name or a text is escaped as `\[` and `\]`, so the rendering stays
        unambiguous and can be read back. `[[file name]]` uses the name GenAIx holds for
        that session file, not a name the client supplies.

        ### What GenAIx does with the parts

        - `reference` parts are resolved through the session's MCP connection and the
          resolved objects are injected into the run's context, so the agent reads the
          object rather than its name.
        - `verbatim` parts are hashed, and the hashes feed the `verbatim_identical`
          quality gate, which compares them against what ended up in the CMS and reports
          a `Check` carrying `verification`.
        - `setting` parts become constraints on this run and are reflected in the run's
          `derived_settings`, so the agent stops re-deriving what the user decided.
        - `filter` parts become search tool inputs, so a research question searches what
          the user selected instead of what the model re-infers from prose.
        - `file_ref` parts attach session files; `mode: verbatim` puts the whole file
          under the same gate.

        ### Settings that govern a write

        A user may also just describe what they want, and GenAIx reads settings out of that
        text. It never acts on that reading alone. `node`, `folder`, `template`, `language`
        and `publish_at` decide where and how content is written, and before the first tool
        call that writes to the CMS each of them the run uses must come from a `setting`
        part in a message, from the session `context`, or from a `settings_review`
        interaction the user answered. Reads and searches run before that point. Every other
        setting key is advisory and never blocks.

        When a write-governing setting was inferred from the text, or is missing altogether,
        the run raises one batched `interaction.requested` of kind `settings_review`: at most
        one per run, listing in `proposed` what it derived - with the `source` of each value
        and the quoted `evidence` behind a text inference - and in `missing` what it still
        needs. Settings that came from a chip or from the session context are not asked
        again. The answer is a `SettingsAnswer`: `settings`, one real `setting` part per key,
        accepted or corrected. It goes to
        `POST /sessions/{session_id}/interactions/{interaction_id}` or, in the same round
        trip as the next turn, to `reply_to_interaction` below.

        **Who raises it** (since `1.0.0-rc.2`): either side, and a client sees one review
        per run either way. The agent may ask through its `request_interaction` tool with
        its own wording, in the user's language, and the options it found (the S1
        transcript shows this); when it reaches a write without having asked, the harness
        raises the same review itself before the first CMS write, with a neutral English
        `prompt`. A client renders `proposed`, `missing` and `options` and treats the
        `prompt` as the sentence above them, whichever side wrote it. GenAIx holds the
        write-tool call itself until the review is answered, so no write `tool.started`
        precedes the review's `interaction.resolved` on the stream.

        GenAIx then stores a **user message whose parts are exactly those confirmed `setting`
        parts**, carrying `interaction_id` of the review, so the history shows
        `#[folder: Richtlinien] #[language: de]` as the user's own decision.
        `interaction.resolved` carries that message's `message_id`, and the
        `derived_settings.updated` that follows lists every confirmed key in
        `corrected_by_user`.

        ### Responses

        Two response shapes, selected by the `Accept` header:

        - `Accept: application/json` (default) returns `202` with `message_id` and
          `run_id`. The client then follows `GET /sessions/{session_id}/events`. This is
          the recommended shape: the stream survives a lost HTTP connection, and one
          stream serves several concurrent clients.
        - `Accept: text/event-stream` returns the SSE stream of this run directly,
          starting at `run.started`. Events are byte-identical to the canonical stream.
          Convenience for command-line clients and the reference client; a disconnect
          loses nothing because the events are persisted and can be replayed from
          `GET /sessions/{session_id}/events?after=<seq>`.

        `409` with `genaix_code: run_already_active` when a run is still active; the
        client must cancel it first (`POST .../runs/{run_id}/cancel`). `409` with
        `session_released` when the session is `released`, `published`,
        `review_requested`, `discarded` or `archived` - reopen it first.

        `reply_to_interaction` is a shortcut that answers a pending interaction and
        continues in the same call, equivalent to
        `POST /sessions/{id}/interactions/{interaction_id}` followed by a new message.
        It exists so that answering a question and continuing the conversation
        can be a single round trip.

        It is also the **exception to `run_already_active`**. A run blocked in
        `waiting_for_input` is still an active run, so a plain message is refused with
        `409` while it waits; a message whose `reply_to_interaction.interaction_id` names
        that run's pending interaction is accepted instead. The answer resolves the
        interaction, the message is appended to the session, and both belong to the run
        that was waiting: no second run is started, and the `run_id` in the `202` is the
        unblocked run, not a new one. Naming an interaction that is not pending still
        fails - `404` when it is unknown, `409` with `interaction_already_answered` when it
        was resolved, `410` with `interaction_expired` when its `expires_at` has passed -
        and a `409` with `run_already_active` remains the answer to a plain message sent
        while any run is active.

        Verbatim content is declared at three granularities and `Verification.unit` names
        which one was proven: a `verbatim` part for a passage of text, typed or quoted out
        of an upload (`chars`); a whole upload, through `mode: verbatim` on the file or on
        its `file_ref` part, whose extracted text is hashed block by block (`blocks`); and
        the `page_structure` part's `verbatim` flag for one produced block (`blocks`).
        Text extraction runs in GenAIx, so a PDF or a Word document is verbatim-capable
        and the model never sees raw binary.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/XGcmsSubject'
