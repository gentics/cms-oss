  /sessions/{session_id}/events:
    get:
      operationId: streamSessionEvents
      tags: [events]
      summary: Canonical Server-Sent Events stream of a session
      description: |
        The one stream a client needs. Events are **persisted** with a total
        order per session (`seq`, starting at 1, gapless, never reused), so the stream
        is fully replayable and a reconnect loses nothing.

        ### Resuming

        Two equivalent ways to say "I have seen everything up to N":

        - `?after=N` query parameter.
        - `Last-Event-ID: N` request header, which browsers' `EventSource` sends
          automatically on reconnect.

        When both are present `Last-Event-ID` wins. The server first replays every
        persisted event with `seq > N` as fast as it can, then follows live. `after=0`
        (the default) replays the whole session from the beginning, which is what a
        fresh client wants when it does not hydrate history through
        `GET /sessions/{session_id}/messages`.

        ### Retention

        In Phase One the retention window is the **life of the session**: events are never
        pruned, so any `after` value is always replayable and `410` cannot occur. The
        status code is reserved so that pruning can be introduced later without a
        breaking change.

        An implementation that does prune **MUST** retain at least **7 days** of events
        per session, and **MUST** report its actual window as
        `capabilities.events_retention_hours` in `GET /me`. An absent
        `events_retention_hours` means no pruning.

        `410` with `genaix_code: events_pruned` is the answer when `after` points before
        the window. The client then re-hydrates through `GET /sessions/{id}/messages` and
        `GET /sessions/{id}/workflow` and reconnects with `after=0`.

        ### Lifetime

        By default the stream stays open for the session: it survives the end of a run
        and carries the next run's events too, so a client needs one connection per
        open session rather than one per run. With `?follow=false` the server closes the stream right after the
        terminal event of the currently active run (`run.completed`, `run.failed` or
        `run.cancelled`), which is what scripted clients want. If no run is active and
        `follow=false`, the stream closes after the replay.

        A `heartbeat` event is sent every 15 seconds of silence so that proxies and
        load balancers do not time the connection out. Heartbeats **do** consume a
        `seq` and are persisted, so `after` arithmetic stays simple.

        ### Filtering

        `?types=` limits the stream to the listed event types. `heartbeat`,
        `run.completed`, `run.failed`, `run.cancelled` and `error` are always delivered
        regardless of the filter, so a filtered client can still detect the end of a
        run. `?run_id=` limits the stream to one run.

        ### Server rules (normative since `1.0.0-rc.2`)

        These were the reference implementation's behaviour and are now the contract:

        1. The server subscribes to live events **before** it replays, so nothing that
           happens during the replay is lost or duplicated.
        2. A filtered-out event still advances the cursor: the `id` of the last frame sent
           may skip numbers, and the client's next `after` is that `id`.
        3. `follow=false` decides whether a run is active **after** the replay and closes
           on the first terminal run event it sends; with no active run at that point the
           stream closes right after the replay.
        4. An unknown name in `types=` matches nothing, mirroring client rule 1; `types=`
           accepts a comma-separated list and a repeated parameter alike.
        5. `run_id=` naming a run of another session is `404` with `run_not_found`.
        6. `410` `events_pruned` applies exactly when `after + 1` is below the lowest
           retained `seq`.

        ### Frame format

        ```
        id: 17
        event: part.delta
        data: {"seq":17,"ts":"2026-10-07T09:23:02Z","session_id":"...","run_id":"...","type":"part.delta","message_id":"...","part_index":1,"delta":"Ab dem naechsten Quartal gilt"}

        ```

        `id` is the decimal `seq`. `event` is the event type. `data` is always a single
        JSON object on one line containing at least `seq`, `ts`, `session_id` and
        `type`; `run_id` is present on every event that belongs to a run.

        ### Client rules (normative)

        1. A client **MUST** ignore an event whose `type` it does not know, and **MUST
           NOT** close the stream or discard later events because of it.
        2. A client **MUST** tolerate a message part whose `type` it does not know,
           rendering its `text` field when present and otherwise skipping it silently.
        3. A client **MUST** treat `plan.updated`, `step.updated`, `check.updated`,
           `derived_settings.updated` and `approval_chain.updated` as idempotent full
           replacements keyed by id, never as deltas. Applying the same event twice
           **MUST** be a no-op.
        4. A client **MUST** apply `part.delta` in `seq` order, and **MUST** treat
           `part.completed` as authoritative over its accumulated copy, so a client that
           missed deltas still ends up correct.
        5. A client **MUST** tolerate unknown enum members and unknown object properties.

        See `info.description`, section "Forward compatibility", for the full rule set
        these repeat.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/XGcmsSubject'
        - name: after
          in: query
          description: >-
            Replay persisted events with `seq` greater than this value, then follow
            live. 0 means replay everything.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
          example: 42
        - name: Last-Event-ID
          in: header
          description: >-
            Standard SSE resume header, sent automatically by `EventSource`. Same
            meaning as `after`, and takes precedence over it.
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
          example: '42'
        - name: follow
          in: query
          description: >-
            `true` (default) keeps the stream open for the whole session. `false`
            closes it after the terminal event of the active run, or right after the
            replay when no run is active.
          required: false
          schema:
            type: boolean
            default: true
        - name: run_id
          in: query
          description: Deliver only events of this run.
          required: false
          schema:
            type: string
            format: uuid
        - name: types
          in: query
          description: >-
            Deliver only these event types. Terminal run events, `error` and
            `heartbeat` are always delivered.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventType'
          style: form
          explode: false
          example: [status, step.updated, check.updated]
      responses:
        '200':
          description: The event stream.
          headers:
            Content-Type:
              schema:
                type: string
                const: text/event-stream
            Cache-Control:
              schema:
                type: string
                const: no-store
            Connection:
              schema:
                type: string
                const: keep-alive
            X-Accel-Buffering:
              description: >-
                Set to `no`. An intermediary must not buffer this response; buffering defeats
                the point of the stream.
              schema:
                type: string
                const: 'no'
            X-GenAIx-Request-Id:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE frames. Every `data` payload validates against one member of the
                  `Event` oneOf, equivalently against `schemas/events.schema.json`.
              examples:
                plan_and_step:
                  summary: A plan update followed by a step update
                  value: |
                    id: 11
                    event: plan.updated
                    data: {"seq":11,"ts":"2026-10-07T09:23:01Z","session_id":"9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13","run_id":"c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94","type":"plan.updated","plan":{"version":1,"summary":"New page in Richtlinien, four blocks, one verbatim legal quote, link from Garantiebedingungen.","items":[{"id":"p1","label":"Create page \"Neue Nutzungsbedingungen ab Q3\"","kind":"create","status":"pending","target":{"type":"folder","id":"42","node_id":3,"label":"Richtlinien"}},{"id":"p2","label":"Hero section","kind":"create","status":"pending"},{"id":"p3","label":"Three key changes","kind":"create","status":"pending"},{"id":"p4","label":"Verbatim legal quote","kind":"create","status":"pending"},{"id":"p5","label":"Webinar registration form","kind":"create","status":"pending"},{"id":"p6","label":"Link from \"Garantiebedingungen\"","kind":"link","status":"pending","target":{"type":"page","id":"8871","node_id":3,"label":"Garantiebedingungen"}}]}}

                    id: 12
                    event: step.updated
                    data: {"seq":12,"ts":"2026-10-07T09:23:02Z","session_id":"9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13","run_id":"c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94","type":"step.updated","step":{"id":"st-2","label":"Derive folder, template and language","status":"running","started_at":"2026-10-07T09:23:02Z","tool_calls":2}}

                    id: 13
                    event: heartbeat
                    data: {"seq":13,"ts":"2026-10-07T09:23:17Z","session_id":"9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13","type":"heartbeat"}

                interaction:
                  summary: An interaction request and its resolution
                  value: |
                    id: 28
                    event: interaction.requested
                    data: {"seq":28,"ts":"2026-10-07T09:23:44Z","session_id":"9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13","run_id":"c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94","type":"interaction.requested","interaction":{"id":"e3f7b1a9-2c64-4d08-95b7-1a8e0c5d7f36","kind":"choice","prompt":"Two templates allow all four constructs. Which one should the landing page use?","options":[{"id":"tpl-17","label":"Kampagnen-Landingpage","description":"Hero, text columns, quote, form embed. Used by 14 pages."},{"id":"tpl-21","label":"Themenseite","description":"Hero, text columns, quote. No form embed, the form would become a link."}],"multi":false,"requested_at":"2026-10-07T09:23:44Z","expires_at":"2026-10-07T09:33:44Z","blocking":true,"status":"pending","run_id":"c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94","step_id":"st-2"}}

                    id: 29
