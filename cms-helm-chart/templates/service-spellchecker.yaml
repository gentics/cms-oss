{{- if .Values.spellchecker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cms.fullname" . }}-spellchecker
  labels:
    service: {{ include "cms.fullname" . }}-spellchecker-service
spec:
  type: ClusterIP
  ports:
    - port: 8010
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gentics-cms-spellchecker
{{- end }}
