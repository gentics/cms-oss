apiVersion: v1
kind: Secret
metadata:
  name: {{ template "cms.fullname" . }}
  labels:
    app: {{ template "cms.name" . }}
    chart: {{ template "cms.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  {{- if and $.Values.database.password (not $.Values.database.passwordSecret) }}
  database-password: {{ .Values.database.password | b64enc | quote }}
  {{- end }}
  {{- if and $.Values.cms.license.key (not $.Values.cms.license.secret) }}
  licensekey: {{ .Values.cms.license.key | b64enc | quote }}
  {{- end }}
  {{- if and $.Values.cms.nodeUserPassword (not $.Values.cms.nodeUserPasswordSecret) }}
  node-user-password: {{ .Values.cms.nodeUserPassword | b64enc | quote }}
  {{- end }}
