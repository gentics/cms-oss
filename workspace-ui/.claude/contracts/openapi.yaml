  /sessions/{session_id}/authorizations:
    get:
      operationId: listSessionAuthorizations
      tags: [sessions, mcp]
      summary: The credentials this session holds
      description: |
        Every MCP connection this session has its own credential for, verified live against
        each connection's URL. The credentials themselves are never returned.

        A session authorization is the narrow credential of the integrated path: registered
        for one session, used only by that session's runs, deleted when the session is done
        with it. A client checks this before sending a turn, and after a reconnect, so it
        can register a fresh credential instead of letting the next run fail.

        A connection with no entry here falls back to the caller's standing authorization
        at `/mcp/connections/{connection_id}/authorization`, if one is registered. When
        both exist the session one wins.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '200':
          description: The session's authorizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthorizationPage'
              examples:
                one_cms:
                  summary: One CMS connection, authorized for this session
                  value:
                    items:
                      - connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                        connector: cms
                        session_id: 9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                        status: authorized
                        auth_type: bearer
                        token_name: genaix-9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                        expires_at: '2026-10-08T09:14:22Z'
                        registered_at: '2026-10-07T09:14:22Z'
                        verified_at: '2026-10-07T09:31:08Z'
                expired:
                  summary: The session's credential has run out
                  description: >-
                    The next run would fail with `mcp_authorization_required`. The client
                    creates a new token on the target system and registers it before sending
                    the turn.
                  value:
                    items:
                      - connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                        connector: cms
                        session_id: 9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                        status: expired
                        auth_type: bearer
                        token_name: genaix-9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                        expires_at: '2026-10-08T09:14:22Z'
                        registered_at: '2026-10-07T09:14:22Z'
                        verified_at: '2026-10-08T09:02:44Z'
                none:
                  summary: No session credential, falling back to the standing one
                  value:
                    items: []
        '400':
