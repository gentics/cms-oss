  /sessions/{session_id}/authorizations/{connection_id}:
    put:
      operationId: putSessionAuthorization
      tags: [sessions, mcp]
      summary: Register a credential for this session
      description: |
        Registers the credential this session will use for one connection. GenAIx verifies
        it live against the connection's URL, then stores it encrypted and bound to the
        session. `422` with `genaix_code: mcp_authorization_rejected` when the connection
        refuses it, and the previous credential, if any, is left untouched.

        **GenAIx never creates a credential.** The client obtains it from the target system
        and registers it here. The integrated path creates one token per workflow session,
        scoped to that session's lifetime, so nothing long-lived is ever stored.

        Idempotent: registering again replaces what was there, which is also how a client
        renews an expiring credential mid-session.

        The token is never returned by any route, never logged, and never reaches the
        model. The harness attaches it to outbound MCP calls; it is not part of any prompt,
        any event, or any message part.

        `409` with `genaix_code: session_released` when the session is `published`,
        `discarded` or `archived`: those sessions do not act any more, which is exactly why
        their credentials are deleted. `released` and `review_requested` still accept one,
        because publishing and requesting review still act on the CMS.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/McpConnectionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAuthorizationRequest'
            examples:
              session_token:
                summary: A token created for this session
                value:
                  auth_type: bearer
                  token: cmstok_5Rk9wQ2zX7mV0pB4nH8jL1aD6sF3gY
                  token_name: genaix-9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                  expires_at: '2026-10-08T09:14:22Z'
      responses:
        '200':
          description: Registered and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthorization'
              examples:
                authorized:
                  value:
                    connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                    connector: cms
                    session_id: 9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                    status: authorized
                    auth_type: bearer
                    token_name: genaix-9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13
                    expires_at: '2026-10-08T09:14:22Z'
                    registered_at: '2026-10-07T09:14:22Z'
                    verified_at: '2026-10-07T09:14:22Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/McpConnectionNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteSessionAuthorization
      tags: [sessions, mcp]
      summary: Forget this session's credential for a connection
      description: |
        Deletes the stored credential. The session falls back to the caller's standing
        authorization for that connection, if one is registered, and otherwise cannot act
        on it: the next run that needs it emits `auth.required` and fails with
        `mcp_authorization_required`.

        This **revokes nothing on the target system**. The token keeps working until its
        owner deletes it there or it expires. Idempotent: deleting when nothing is
        registered is `204`.

        GenAIx does the same deletion by itself when the session reaches `published`,
        `discarded` or `archived`, or when `expires_at` passes.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/McpConnectionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '204':
          description: Forgotten, or there was nothing registered.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sessions/{session_id}/workflow:
    get:
      operationId: getSessionWorkflow
      tags: [workflows]
      summary: The live workflow view of a session
      description: |
        The complete workflow state of a session in one snapshot: the plan, the steps with
        their substeps, the checks including verbatim proofs, the quality gates of the
        workflow module and what happened to each, the approval chain, the derived settings
        and the CMS objects touched.

        This is the **reconnect** counterpart of the `plan.updated`, `step.updated`,
        `check.updated`, `approval_chain.updated` and `derived_settings.updated` events.
        A client hydrates from here once and then keeps it current from the stream. Gate
        results have no event of their own: a gate publishes a `Check`, so `check.updated`
        keeps `gates` current too.

        `authorizations` is here for the same reason: a client that has been away needs to
        know whether the session can still act before it sends the next turn, and a
        session credential can have expired while it was gone.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '200':
          description: The workflow view.
          content:
            application/json:
