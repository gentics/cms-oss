apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cms.fullname" . }}
  labels:
    {{- include "cms.labels" . | nindent 4 }}
  {{- with .Values.cms.annotations}}
  annotations:
    {{- toYaml . | nindent 4}}
  {{- end }}
spec:
  replicas: {{ .Values.cms.replicaCount }}
  {{- if eq (.Values.cms.replicaCount | int) 1 }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "cms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cms.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cms.serviceAccountName" . }}
      securityContext:
        {{- if .Values.cms.podSecurityContext }}
        {{- toYaml .Values.cms.podSecurityContext | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- end }}
      containers:
      - name: cms
        image: "{{ include "cms.image" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.cms.securityContext }}
        securityContext:
        {{- toYaml .Values.cms.securityContext | nindent 12 }}
        {{- else if .Values.securityContext }}
        securityContext:
        {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
        {{- if .Values.lifecycle }}
        lifecycle:
        {{- toYaml .Values.lifecycle | nindent 12 }}
        {{- end }}
        env:
          - name: NODE_DB_HOST
            value: {{ include "cms.databaseHost" . | quote }}
          - name: NODE_DB_PORT
            value: "{{ .Values.database.port }}"
          - name: NODE_DB_USER
            value: "{{ .Values.database.username }}"
          - name: NODE_DB_PASSWORD
            valueFrom:
              {{- include "cms.databasePasswordRef" . | nindent 14 }}
          - name: NODE_DB_NAME
            value: "{{ .Values.database.name }}"
          - name: ADD_JAVA_OPTS
            value: "{{ .Values.cms.addJavaOpts }}"
          - name: PUBLISH_PATH
            value: data/publish
          - name: GIS_PATH
            value: data/publish/gis
          {{- if .Values.cms.configurationPaths }}
          - name: CONF_FILES
            value: {{ join "," .Values.cms.configurationPaths | quote }}
          {{- end }}
          {{- if .Values.cms.staticServePaths }}
          - name: STATIC_SERVE_LIST
            value: {{ join "," .Values.cms.staticServePaths | quote }}
          {{- end }}
          - name: NODE_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                {{- if $.Values.cms.nodeUserPasswordSecret }}
                name: {{ $.Values.cms.nodeUserPasswordSecret }}
                key: password
                {{- else }}
                name: {{ template "cms.fullname" . }}
                key: node-user-password
                {{- end }}
          {{- if .Values.cms.extraEnv }}
          {{- toYaml .Values.cms.extraEnv | nindent 10 }}
          {{- end }}
          {{- with .Values.customCert }}
          {{- if .secretName }}
          - name: USE_SYSTEM_CA_CERTS
            value: "1"
          {{- end }}
          {{- end }}
        volumeMounts:
          {{- range .Values.cmsExtraVolumes }}
          - name: {{ .name }}
            {{- toYaml .mount | nindent 12 }}
          {{- end }}
          {{- if .Values.cms.backup.enabled }}
          - mountPath: /backup
            name: backup
            subPath: db
            readOnly: true
          {{- end }}
          - mountPath: /cms/data
            name: data
            subPath: cms/data
          - mountPath: /cms/keys
            name: data
            subPath: cms/keys
          {{- if .Values.cms.supportLogin }}
          - mountPath: /cms/keys/support-login-public-key.jwk
            name: config-cms
            subPath: support-login-public-key.jwk
          {{- end }}
          {{- if not .Values.cms.persistence.onlyData }}
          - mountPath: /cms/conf
            name: data
            subPath: cms/conf
          - mountPath: /cms/ui-conf
            name: data
            subPath: cms/ui-conf
          - mountPath: /cms/packages
            name: data
            subPath: cms/packages
          - mountPath: /cms/content-packages
            name: data
            subPath: cms/content-packages
          - mountPath: /cms/logs
            name: data
            subPath: cms/logs
          - mountPath: /cms/publish
            name: data
            subPath: cms/publish
          - mountPath: /cms/scheduler-commands
            name: data
            subPath: cms/scheduler-commands
          {{- end }}
          {{- if .Values.cms.cache.persistence.enabled }}
          - mountPath: /cms/cache
            name: cache
          {{- end }}
          {{- if .Values.cmsExtraVolumeMounts }}
          {{- range .Values.cmsExtraVolumeMounts }}
          - mountPath: {{ .mountPath }}
            name: {{ .name }}
            subPath: {{ .subPath }}
          {{- end }}
          {{- end }}
          {{- if .Values.cmsConfigMapFiles }}
          {{- range $key, $value := .Values.cmsConfigMapFiles }}
          {{- if $value.mountPath }}
          - mountPath: {{ $value.mountPath }}
            name: config-cms
            subPath: "{{ $key }}"
            readOnly: true
          {{- end }}  
          {{- end }}
          {{- end }}
          {{- with .Values.customCert }}
          {{- if .secretName }}
          - name: cert-secret
            mountPath: "/certificates"
            readOnly: true
          {{- end }}
          {{- end }}
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP

        livenessProbe:
          {{- toYaml .Values.cms.livenessProbe | nindent 10 }}

        startupProbe:
          {{- toYaml .Values.cms.startupProbe | nindent 10 }}

        readinessProbe:
          {{- toYaml .Values.cms.readinessProbe | nindent 10 }}

        resources:
          {{- toYaml .Values.cms.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- include "cms.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.hostAliases }}
      hostAliases:
      {{- toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}
      volumes:
      {{- range .Values.cmsExtraVolumes }}
      - name: {{ .name }}
        {{- toYaml .volume | nindent 8 }}
      {{- end }}
      - name: config-cms
        configMap:
          name: {{ include "cms.fullname" . }}-config
      - name: data
      {{- if .Values.cms.persistence.enabled }}
        persistentVolumeClaim:
        {{- if .Values.cms.persistence.existingClaim }}
          claimName: {{ .Values.cms.persistence.existingClaim }}
        {{- else }}
          claimName: {{ include "cms.fullname" . }}-data
        {{- end }}
      {{- else }}
        emptyDir: {}
      {{- end }}
      - name: cache
      {{- if .Values.cms.cache.persistence.enabled }}
        persistentVolumeClaim:
        {{- if .Values.cms.cache.persistence.existingClaim }}
          claimName: {{ .Values.cms.cache.persistence.existingClaim }}
        {{- else }}
          claimName: {{ include "cms.fullname" . }}-cache
        {{- end }}
      {{- else }}
        emptyDir: {}
      {{- end }}
      {{- if .Values.cms.backup.enabled }}
      - name: backup
        persistentVolumeClaim:
          {{- if .Values.cms.backup.persistence.existingClaim }}
          claimName: {{ .Values.cms.backup.persistence.existingClaim }}
          {{- else }}
          claimName: {{ include "cms.fullname" . }}-backup
          {{- end }}
      {{- end }}
      {{- with .Values.customCert }}
      {{- if .secretName }}
      - name: cert-secret
        secret:
          secretName: {{ .secretName }}
      {{- end }}
      {{- end }}
