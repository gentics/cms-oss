  /subjects/{subject}:
    delete:
      operationId: deleteSubject
      tags: [identity]
      summary: Erase everything held for one subject
      description: |
        Deletes every session, message, event, uploaded file, artifact, MCP connection and
        authorization that belongs to one subject under this installation, and the subject
        record itself. Nothing is retained and nothing is recoverable.

        **The installation calls this when the person behind the subject is removed.** That
        is the only way it can happen: the subject is opaque and installation-scoped, so
        GenAIx cannot resolve a person to a subject and could never start the deletion on
        its own. The side that mints subjects is the side that knows when one should cease
        to exist.

        Authenticated by the installation token alone. It carries no `X-GCMS-Subject` of its
        own, because it is an installation acting on a subject rather than a user acting on
        their own data, and the subject to erase is in the path.

        Active runs of that subject are cancelled first. Credentials the subject registered
        are deleted here but are **not revoked on any target system**; their owner deletes
        them there, or they expire.

        Idempotent: a subject with nothing stored, or one that was never seen, is `204`.
      parameters:
        - name: subject
          in: path
          required: true
          description: The subject to erase, the same opaque value `X-GCMS-Subject` carries.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
          example: sub_c3f1a07d9e5b4826
      responses:
        '204':
          description: Everything held for that subject is gone, or there was nothing.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /mcp/connectors:
    get:
      operationId: listMcpConnectors
      tags: [mcp]
      summary: The connector types this installation offers
      description: |
        The read-only catalogue of connector **types**, and what each one needs in order to be
        authorized. A connector type is a kind of system, not an address: `cms` means "a
        Gentics CMS", and the address comes from the user's connection.

        **Types are defined by GenAIx configuration and cannot be added, removed or changed
        through this API.** There is no `POST`, `PUT` or `DELETE` here. What a user creates is
        a **connection** of a type, at `/mcp/connections`.

        `multiple` says whether a user may hold several connections of the type, which is why
        the URL belongs to the connection rather than the type.

        `url_template` and `default_url` are conveniences for a client building a URL: the
        template shows the shape, and `default_url` is the address this installation is
        configured for, when it has one. Neither is binding, and a client **MUST** use the
        `url` of the connection it actually works with.

        **Who creates the credential.** GenAIx does not. For a `bearer` connector the client
        obtains the token from the target system itself and registers it on the connection
        with `PUT /mcp/connections/{connection_id}/authorization`.
      parameters:
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '200':
          description: The connector types.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/McpConnector'
                additionalProperties: false
              examples:
                cms_only:
                  summary: Phase One - the CMS is the only connector type
                  value:
                    items:
                      - type: cms
                        title: Gentics CMS
                        description: >-
                          A Gentics CMS instance. Every content read and write goes through
                          it, as the calling user.
                        transport: streamable_http
                        multiple: true
                        url_template: '{cms_base_url}/mcp'
                        default_url: https://cms.example.com/mcp
                        auth:
                          type: bearer
                          token_hint: >-
                            An API token of the target CMS, belonging to this user and created
                            in that CMS.
                        tool_groups:
                          - identity
                          - search
                          - content_read
                          - content_write
                          - constructs
                          - admin
                        required_by_workflows:
                          - content_create
                          - content_research
                          - construct_create
                          - admin_user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
