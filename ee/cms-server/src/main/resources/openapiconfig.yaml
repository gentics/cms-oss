resourcePackages:
- com.gentics.contentnode.rest.resource
prettyPrint: true
cacheTTL: 0
openAPI:
  info:
    version: ${project.version}
    title: Gentics CMS EE REST API
    description: OpenAPI specification for Gentics CMS Enterprise
    contact:
      url: ${project.url}
  components:
    securitySchemes:
      bearerAuth:
        type: http
        description: CMS API Token
        scheme: bearer
      sessionSecret:
        type: apiKey
        description: CMS session secret
        name: GCN_SESSION_SECRET
        in: cookie
  security:
  - bearerAuth: []
  - sessionSecret: []