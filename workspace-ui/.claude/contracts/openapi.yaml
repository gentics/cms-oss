          description: Localised construct names, keyed by language code.
          additionalProperties:
            type: string
          examples:
            - de: Aenderungstabelle Nutzungsbedingungen
              en: Terms change table
        description:
          type: object
          additionalProperties:
            type: string
        category_id:
          type: integer
        node_ids:
          type: array
          items:
            type: integer
        parts:
          type: array
          items:
            type: object
            required: [keyword, type_id, editable]
            properties:
              keyword:
                type: string
              name:
                type: object
                additionalProperties:
                  type: string
              type_id:
                type: integer
                description: >-
                  CMS part type id of an editable part, one that `list_part_types` reports
                  as allowed. Never 43: the Handlebars template part is `template` below,
                  not an entry of `parts`, exactly as `create_construct` takes it (since
                  `1.0.0-rc.2`).
              editable:
                type: boolean
              mandatory:
                type: boolean
                default: false
              default:
                description: Default value, shape depends on the part type.
              hidden:
                type: boolean
                default: false
            additionalProperties: false
        template:
          type: string
          description: >-
            The Handlebars template source, the type 43 part of the construct. Part values
            are addressed as `cms.tag.parts.<keyword>`, the one spelling the CMS resolves.
        may_be_subtag:
          type: boolean
        may_contain_subtags:
          type: boolean
        auto_enable:
          type: boolean
        validation:
          type: object
          required: [ok]
          properties:
            ok:
              type: boolean
            issues:
              type: array
              items:
                type: object
                required: [severity, message]
                properties:
                  severity:
                    type: string
                    enum: [error, warning, info]
                  message:
                    type: string
                  line:
                    type: integer
                  column:
                    type: integer
                additionalProperties: false
          additionalProperties: false
        created_ref:
          $ref: '#/components/schemas/CmsObjectRef'
      additionalProperties: false
      examples:
        - type: construct_draft
          keyword: terms_change_table
          name:
            de: Aenderungstabelle Nutzungsbedingungen
            en: Terms change table
          category_id: 4
          node_ids: [3]
          parts:
            - keyword: heading
              name:
                de: Ueberschrift
                en: Heading
              type_id: 1
              editable: true
              mandatory: true
            - keyword: rows
              name:
                de: Zeilen
                en: Rows
              type_id: 21
              editable: true
          template: |
            <table class="terms-change">
              <caption>{{cms.tag.parts.heading}}</caption>
              <tbody>
                {{#each cms.tag.parts.rows}}<tr><th>{{this.old}}</th><td>{{this.new}}</td></tr>{{/each}}
              </tbody>
            </table>
          validation:
            ok: true
            issues:
              - severity: info
                message: >-
                  The template uses {{#each}} over a repeatable part; remember to set a
                  sensible default row count.

