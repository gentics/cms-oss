  /mcp/connections/{connection_id}:
    get:
      operationId: getMcpConnection
      tags: [mcp]
      summary: One connection
      description: >-
        The connection with a fresh reachability probe. `authorization_status` is the
        summary; `GET /mcp/connections/{connection_id}/authorization` has the detail and the
        remedy.
      parameters:
        - $ref: '#/components/parameters/McpConnectionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnection'
              examples:
                connection:
                  value:
                    id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                    connector: cms
                    url: https://cms.example.com/mcp
                    label: Acme GmbH demo CMS
                    default: true
                    created_at: '2026-10-07T09:14:20Z'
                    status:
                      reachable: true
                      checked_at: '2026-10-07T09:20:12Z'
                      server_info:
                        name: gentics-cms-mcp
                        version: 9.0.0-SNAPSHOT
                        protocol_version: '2026-07-28'
                    authorization_status: authorized
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/McpConnectionNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: patchMcpConnection
      tags: [mcp]
      summary: Change a connection's URL, label or default flag
      description: |
        Partial update. Absent fields are left alone.

        **Re-pointing drops the authorization.** Changing `url` means the connection now
        addresses a different system, and a credential issued by the old one proves nothing
        about the new one. GenAIx therefore deletes the stored credential, the
        `authorization_status` returns to `unauthorized`, and the client registers again.
        The response says so in `authorization_status`, and a `PATCH` that only changes
        `label` or `default` leaves the credential alone.

        The same URL rules as `POST` apply, and the probe is equally informational. Setting
        `default: true` moves the flag off the previous default of that connector type;
        `default: false` on the only connection of a type is refused with `422`, because a
        connector type always has a default while it has any connection.
      parameters:
        - $ref: '#/components/parameters/McpConnectionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpConnectionPatch'
            examples:
              rename:
                summary: Label only - the credential survives
                value:
                  label: Acme GmbH production CMS
              repoint:
                summary: New URL - the stored credential is dropped
                value:
                  url: https://cms2.example.com/mcp
              make_default:
                value:
                  default: true
      responses:
        '200':
          description: The updated connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnection'
              examples:
                repointed:
                  summary: After a URL change the connection needs a new credential
                  value:
                    id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                    connector: cms
                    url: https://cms2.example.com/mcp
                    label: Acme GmbH demo CMS
                    default: true
                    created_at: '2026-10-07T09:14:20Z'
                    status:
                      reachable: true
                      checked_at: '2026-10-09T10:31:04Z'
                    authorization_status: unauthorized
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/McpConnectionNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteMcpConnection
      tags: [mcp]
      summary: Delete a connection
      description: |
        Removes the connection and its stored credential. It **revokes nothing** on the
        target system: the credential keeps working until its owner deletes it there.

        Sessions that name the connection in `context.connection_ids` keep the id in their
        history, and a run that needs it fails with `424` and
        `genaix_code: mcp_authorization_required`. Deleting the default connection of a type
        promotes the oldest remaining one of that type, if any.
      x-example-request: |
        DELETE /api/v1/mcp/connections/c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69 HTTP/1.1
        Authorization: Bearer sk_gnx_8Fqz1pWv7sR2mJhT4bXcY9dLaK0eNu3G
        X-GCMS-Subject: sub_c3f1a07d9e5b4826
      parameters:
        - $ref: '#/components/parameters/McpConnectionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/McpConnectionNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # Standing, per-user authorization of a connection. Optional: the integrated path
  # registers a credential per session instead, at
  # /sessions/{session_id}/authorizations/{connection_id}, and that one takes precedence.
  /mcp/connections/{connection_id}/authorization:
    get:
      operationId: getMcpAuthorization
      tags: [mcp]
      summary: Check this user's authorization of one connection
      description: |
        The "is this connection working" call. GenAIx **verifies live**: it calls the
        connection's URL with the stored credential (`whoami`, falling back to
        `tools/list`) and reports what came back, rather than echoing what it stored
        earlier.

        `status` is `authorized`, `unauthorized` (nothing registered), `pending` (an
        `oauth2` flow is in progress), `invalid` (the server refused the credential) or
        `expired`. For anything but `authorized`, `how_to_authorize` says what to do: for
        `bearer` it points at `PUT` on this resource, for `oauth2` it carries the
        authorization URL to redirect to.

        The verification calls the server's `whoami`; a server that has none is verified by
        `tools/list` only when its connector declares `auth.type: none`, since on an
        authenticated transport a listing proves the credential and on an open one it proves
        nothing. What `whoami` answered is held by GenAIx for the verification only and is
        **not exposed** on this resource: a client that wants to confirm which user a
        credential belongs to asks the target system itself, with the same token, before
        registering it (since `1.0.0-rc.2`; the earlier `identity` sentence is withdrawn).

        `404` when `connection_id` is not a connection of this user. `424` when the
        connection's URL cannot be reached at all, since then nothing can be verified; the
        standing state is left as it was. The session-scoped listing at
        `/sessions/{session_id}/authorizations` never answers `424` for one dead connection:
        it keeps the stored `status` and `verified_at` of that entry untouched.
      parameters:
        - $ref: '#/components/parameters/McpConnectionId'
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '200':
          description: The verified authorization state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAuthorization'
              examples:
                authorized:
                  summary: Verified against the CMS a moment ago
                  value:
                    connection_id: c1d4e7b0-9a36-4f82-b5e1-0c8d3a7f2b69
                    connector: cms
                    user:
                      subject: sub_c3f1a07d9e5b4826
                    status: authorized
                    auth_type: bearer
                    resource: https://cms.example.com/mcp
                    token_name: genaix-acme-gmbh-demo-cms
