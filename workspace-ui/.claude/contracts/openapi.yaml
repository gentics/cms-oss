openapi: 3.1.0
info:
  title: GenAIx API
  version: 1.0.0-rc.2
  summary: Agentic content API for Gentics CMP 9.
  description: |
    The GenAIx API drives agentic content work against a Gentics CMS installation. A
    GenAIx **session** is one user task (create a landing page, research the content
    inventory, draft a construct). A session accumulates **messages**; each user
    message starts a **run**; a run emits an ordered **event** stream carrying the
    assistant's output as message parts plus the run's plan, steps, checks, derived
    settings and CMS preview state.

    The API is deliberately **client-agnostic**. It describes data and state, not
    screens: nothing in this contract names or assumes a particular layout, widget
    or navigation. Message parts are typed data with a documented meaning; how a
    client arranges them is its own decision.

    ## Authentication

    Every request carries `Authorization: Bearer sk_gnx_...`, the **installation token**,
    which identifies one GenAIx installation rather than a person. The end user comes from
    a single **identity header injected by the installation's trusted proxy**,
    `X-GCMS-Subject`. That is the whole header contract: one token, one subject, nothing
    else.

    The subject is **opaque and pseudonymous**, scoped to the installation. GenAIx uses it
    as an owner key and never learns which person it stands for: no user id, login, display
    name or group list is sent or stored. The value may be a compact JWS assertion, and an
    installation configured with the signing key has GenAIx verify the signature and expiry
    and reject anything unsigned or stale with `401` and `genaix_code: identity_invalid`.
    What else the producing side encodes in that payload is its own business; GenAIx does
    not decode it.

    GenAIx trusts the header only because the installation token authenticated the caller.
    Sessions are owned by the pair (installation token, subject): an unknown or
    foreign-installation session id is `404`, a session of a different subject under the
    same installation is `403`.

    `DELETE /subjects/{subject}` erases everything GenAIx holds for one subject. The
    installation calls it when the person behind that subject is removed, which is the only
    way that deletion can happen at all, since GenAIx cannot resolve a person to a
    subject.

    ## MCP connections

    The systems an agent acts on are reached over MCP, and the model has two levels.

    - A **connector** is a *kind* of system. Connector types are defined by GenAIx
      configuration and **cannot be added, removed or changed through this API**, so there is
      no `POST`, `PUT` or `DELETE` on `/mcp/connectors`.
    - A **connection** is a user's link to one concrete instance of a type, and **the URL
      belongs to the connection**. A user creates a connection of a type at
      `/mcp/connections`; `multiple` on the connector type says whether they may hold several.

    **GenAIx never creates a credential.** For a `bearer` connector the client obtains the
    token from the target system itself and registers it with GenAIx, which verifies it live,
    stores it encrypted, and attaches it to that connection's outbound calls. Every read and
    write therefore runs as that user on the target system, which audits it under the identity
    the credential carries. GenAIx's own audit lines carry the subject, the session id and the
    run id and nothing else; the side that minted the subject is the only one that can map it
    back to a person. The credential is never returned by any route, never logged, and never
    reaches the model: the harness attaches it outside the model's context, so it is in no
    prompt, no event and no message part.

    A credential is registered at one of two scopes.

    - **Per session**, at `/sessions/{session_id}/authorizations/{connection_id}`. This is the
      integrated path. The client creates one token per workflow session, names it after the
      session, gives it the installation's session authorization lifetime (24 hours by
      default) and asks the target system to delete the token row when it expires; the token
      request fields are `{name, expires, pruneOnExpiry}`. It is registered on the session,
      used only by that session's runs, and deleted when the session reaches `published`,
      `discarded` or `archived`, when the client deletes it, or when it expires - kept through
      `released` and `review_requested`, because publishing still acts on the target system.
      Nothing long-lived is stored, and a GenAIx-side incident exposes only the sessions open
      at the time.
    - **Standing, per user**, at `/mcp/connections/{connection_id}/authorization`. Optional,
      and the path for the non-integrated GenAIx UI and for tooling, where there is no client
      minting a token per task. It is independent of any browser session, so an agent session
      outlives the user's sign-in.

    Where both exist for the same connection, **the session authorization wins**.

    A session works through the connections in `context.connection_ids`, defaulting to the
    user's `default` connection of each connector type the workflow requires. When a run needs
    a connection it cannot use - no session credential and no standing one, or one that is
    invalid, expired or refused - GenAIx emits `auth.required` with the `connection_id`, the
    `connector` and a reason, and fails the run with `424` and
    `genaix_code: mcp_authorization_required`. The remedy is always the same: register an
    authorization, then re-send the message.

    ## Streaming

    `GET /sessions/{session_id}/events` is the canonical stream: Server-Sent Events,
    replay from a sequence number, `Last-Event-ID` support, heartbeat every 15
    seconds. `POST /sessions/{session_id}/messages` with `Accept: text/event-stream`
    returns the same event stream for the run it just started, as a convenience for
    simple clients. The full event catalogue is in the `x-sse-events` extension on
    both operations and in `schemas/events.schema.json`.

    ## Messages

    A user message is an ordered list of typed **parts**: text the user typed, a folder
    or page they at-mentioned, a setting they picked, a quote that must survive word for
    word, a file they attached, a search filter they selected. `content` is the plain
    rendering of those parts, so a client with no part-aware composer can send text
    alone. Input parts are a closed set and an unknown part type is rejected; output
    parts are open-ended and a client falls back to their `text`. The rendering rules are
    on `POST /sessions/{session_id}/messages`.

    ## Forward compatibility (normative)

    These rules are part of the contract. A client that breaks them is not
    conformant, and the server is free to add types without further notice.

    1. A client **MUST** ignore an event whose `type` it does not know. It **MUST
       NOT** fail, close the stream, or discard later events because of it.

    2. A client **MUST** tolerate a message part whose `type` it does not know. It
       **MUST** render the part's `text` field when one is present, and **MUST**
       otherwise skip the part silently. It **MUST NOT** fail the message, drop the
       remaining parts of the message, or show raw JSON to the end user. The
       `UnknownPart` schema documents this fallback.

    3. A client **MUST** tolerate a value outside any enum in this contract
       (`SessionStatus`, `RunStatus`, `EventType`, `PartType`, `GenaixCode`, check
       severities, step statuses) and **MUST** degrade to neutral handling rather
       than erroring.

    4. A client **MUST** ignore object properties it does not know.

    5. Adding an event type, a part type, an enum member, an optional property or a
       route is **not** a breaking change and may happen in any minor version after
       the release.

    ## Errors

    All errors are RFC 9457 `application/problem+json` documents. `type` is a URI
    under `https://genaix.gentics.com/problems/`, and the GenAIx-specific
    `genaix_code` field carries a stable machine-readable code. Responses carry
    `X-GenAIx-Request-Id`.

    ## Versioning policy

    This is `v1`, agreed between the contract parties and **frozen for development** as
    release candidate `1.0.0-rc.2`: implementations build against it as it stands. It may
    still change while implementation proceeds, but only by agreement between the parties,
    recorded in the changelog below, and a breaking change is made only where no additive
    form exists. At `1.0.0` the contract is frozen and all changes are additive: new
    optional fields, new enum members, new event types, new part types, new routes.
    Removing or renaming anything requires `v2`.

    Conventions: JSON field names are `snake_case`; timestamps are ISO 8601 with an
    explicit offset (`2026-10-07T09:14:22Z`); identifiers generated by GenAIx are
    UUIDv4 strings; CMS object ids are integers as the CMS REST API reports them.

    ## Changelog

    **1.0.0-rc.2** (2026-09-21) - **agreed** by all parties. What the first implementation against `rc.1`
    found the contract silent or inconsistent about, resolved. **Additive** on the wire:
    `QualityGate.triggers` (a gate bound to several steps or to a step and a transition;
    `when` / `step_id` keep the first trigger), `substeps` on the catalogue's step
    template (`StepTemplate`), `publish_at` on `DerivedSettings` and `SessionContext`,
    `document` as a `ContextReference` type (a citation over a non-CMS source),
    `model_rate_limited` as a `run.failed` code, and `McpConnection.label`,
    `Session.workflow_version`, `inputs` and `authorizations` now required as every
    example already showed them. **Decided**: `tool.started.tool` is the bare wire name of
    `mcp/tools.json` with `group` alongside, never `<group>_<name>` (examples and transcripts
    corrected); `Check.blocking` on a gate check is the manifest flag **and** a `fail`
    verdict, so a blocking gate's warning is acknowledgeable; one `Check` per gate execution
    and `attempt` counts every execution; `Check.evidence` is the gate's own object with the
    inline subset on top; the `WorkflowState.state` derivation table; the gates of a
    `release` run before the active run is cancelled; `session.updated` is not emitted for
    `active_run_id` alone; `publish` and `request_review` answer `202` with the session as it
    is when the call returns, and repeating `discard` / `archive` is `200` without an
    event; `request_review` reaches the CMS only for a user who cannot publish directly.
    **Clarified**: the event stream's server rules (subscribe before replay, filtered
    events advance the cursor, `follow=false`, unknown `types`, `410` arithmetic); a
    `settings_review` may be raised by the agent or by the harness, its answer updates
    `Session.context`, a review answered through `reply_to_interaction` stores two user
    messages, its `422`s; which write-governing keys a page-producing run needs;
    availability is a hint and session creation checks only that the module exists, a
    credential sent on create counts at once, a required connector without any connection
    is `503`; `server_info` only after an authenticated probe; `whoami` is the verification
    and its answer is not exposed (the `identity` sentence is withdrawn); the
    `how_to_authorize.token_name` format; a second connection at the same URL is `422`; a
    credential registered past its expiry is stored `expired`; the `424` of the standing
    read never touches the session listing; `CmsObjectRef.url` precedence, `result_count`
    and what a `read` in `cms_objects` is; the `mode: verbatim` reading (quoted passages,
    not the whole document) and the block rule; stored upload names and the media-type
    check; the `Problem.errors[].pointer` rule for tagged unions and the `code` vocabulary;
    the approval chain's anonymous user actor and its two resolutions; a reviewer's calls
    stay off the stream. Companion `mcp/tools.json` `1.0.0-rc.2` changes the CMS tool
    surface (five schemas made client-safe, per-tool listing, `list_templates` in phase
    one, `cms.tag.parts.<keyword>`, `X-GenAIx-Gate`).

    **1.0.0-rc.1** (2026-09-15) - the contract is **agreed** by all parties and frozen for
    development. No change to routes, schemas or events against `1.0.0-draft.8`; the version
    marks the checkpoint from which implementations build, and the versioning policy above
    says how a change is made from here.

    **1.0.0-draft.8** (2026-09-15) - a setting GenAIx **inferred** is now confirmed by the
    user before it can govern a write.

    The composer keeps free text and optional chips, and GenAIx keeps parsing that text
    itself, but a value it read out of the prose is a proposal until the user has seen it.
    The new `settings_review` interaction kind carries `proposed` - each item with `key`,
    `value`, `label`, a `source` of `text`, `context` or `default`, the quoted `evidence`
    behind a text inference and optional `options` when a choice exists - and `missing`, the
    settings the run needs and could not derive. It is answered with the new
    `InteractionAnswer` member `SettingsAnswer`, `{settings, comment?}`, whose `settings` are
    real `setting` parts, sent either to
    `POST /sessions/{id}/interactions/{interaction_id}` or as `reply_to_interaction` on the
    next message.
    On resolution GenAIx stores a **user message whose parts are exactly the confirmed
    `setting` parts**, so the history shows the decision as the user's own: the new optional
    `Message.interaction_id` points back at the review, `InteractionResolvedEvent` gains
    `message_id`, and the `derived_settings.updated` that follows lists every confirmed key
    in `corrected_by_user`.
    The rule is written on `DerivedSettings`, on `POST /sessions/{session_id}/messages` and
    on the interaction route: the write-governing settings `node`, `folder`, `template`,
    `language` and `publish_at` must come from a `setting` part, from the session context or
    from an answered `settings_review` before the first tool call that writes to the CMS.
    Read and search tools run before it, and other keys stay advisory. At most one review per
    run, batched, raised only when a write-governing setting was inferred from the text or is
    missing; settings that came from a chip or the session context are not asked again.

    **1.0.0-draft.7** (2026-09-14) - the caller is now a **pseudonymous subject**, and MCP
    credentials became **session-scoped**.

    Identity is one header, `X-GCMS-Subject`: an opaque, installation-scoped subject that is
    the owner key of everything GenAIx stores and tells it nothing about the person.
    `X-GCMS-User-Id`, `X-GCMS-User-Login` and `X-GCMS-User-Groups` are **removed**, with them
    the `user_id_missing` code, and no user id, login, display name or group list appears
    anywhere in the contract. The header may carry a compact JWS assertion; an installation
    configured with the signing key has GenAIx verify it and reject an unsigned or stale value
    with `401` and the new `identity_invalid`. `Me.user`, `Session.owner` and
    `McpAuthorization.user` are `{subject}` only, workflow narrowing no longer involves group
    membership, and the new installation-level `DELETE /subjects/{subject}` erases every
    session, file, connection and authorization of one subject when the installation removes
    the person behind it.
    `GET /sessions/{session_id}/authorizations` and
    `PUT|DELETE /sessions/{session_id}/authorizations/{connection_id}` register, list and
    forget the credential one session uses for one connection; `POST /sessions` takes
    `authorizations` next to `message`, so a client creates the token, the session and the
    first turn in one round trip. A session credential is deleted when the session reaches
    `published`, `discarded` or `archived`, when the client deletes it, or when
    `expires_at` passes, and is kept through `released` and `review_requested`. `Session`
    and the workflow view carry an `authorizations` summary. The per-user authorization at
    `/mcp/connections/{connection_id}/authorization` stays as an optional standing
    fallback; where both exist the session one wins. `auth.required` and
    `mcp_authorization_required` now also mean "this session has no valid credential for
    the connection this run needs".

    **1.0.0-draft.6** (2026-09-13) - a session can be **created with its first message**.
    `POST /sessions` accepts an optional `message`, the same body as
    `POST /sessions/{session_id}/messages`; the session is created, the message is
    appended as the first user turn and its run starts, and the `201` carries `run_id`,
    `message_id` and `events_url` alongside the session. The two-call flow is unchanged
    and stays the path for a turn that needs uploaded files. `intent` is now **derived and
    read-only**: it is the plain rendering of the first user message, empty until that
    message arrives, and `POST /sessions` no longer accepts it.

    **1.0.0-draft.5** (2026-09-13) - a user message is a list of **typed parts**.
    `POST /sessions/{session_id}/messages` takes `parts` as the canonical ordered
    structure (`text`, `verbatim`, `reference`, `file_ref`, `setting`, `filter`), with
    `content` as their plain rendering and `references` derived from the `reference`
    parts. Input parts are strict: a part type outside `UserPartType` is `422`
    `validation_failed`, while output parts keep the text fallback. The offset-based
    `verbatim` span array is gone from `MessageCreate` and from `Message`, replaced by
    `verbatim` parts. Message history carries the same user parts. The two verbatim paths
    for an uploaded file are now stated explicitly on `FileMode`, on the `file_ref` and
    `verbatim` parts and on `Verification`: a locked upload is hashed block by block
    (`unit: blocks`), a `verbatim` part quoting one of its passages is hashed as text
    (`unit: chars`), and extraction runs in GenAIx so the model never sees raw binary. The
    MCP endpoint path is `/mcp`, so every example URL is now
    `https://cms.example.com/mcp`.

    **1.0.0-draft.4** (2026-09-10) - documentation separated: integration guidance moved to
    the Integration guide, so this document describes GenAIx behaviour and contracts only.
    No contract change.

    **1.0.0-draft.3** (2026-09-10) - MCP access is modelled as connector **types** plus
    per-user **connections**, each connection carrying its own URL and its own credential.
    `/mcp/connectors` is read-only; `/mcp/connections` and
    `/mcp/connections/{connection_id}/authorization` are where a user's access is managed.
    `GET /me` reports `mcp_connections`. `Workflow.required_connectors`,
    `SessionContext.connection_ids` and `CmsObjectRef.connection_id` follow from it, as do
    the codes `mcp_connection_not_found` and `mcp_connection_limit`.

    **1.0.0-draft.2** (2026-09-10) - MCP access became a first-class resource, with the
    client registering the credential and GenAIx only verifying, storing and using it.
    Workflows became versioned **modules with quality gates**: `GET /workflows` publishes
    `version`, `inputs_schema`, `required_connectors`, `tool_groups` and `quality_gates`,
    the workflow view gained `gates`, `Check` gained `gate_id`, `kind` and `evidence`, and
    transitions gained `acknowledge_checks` and the `quality_gate_failed` refusal.
    Authorization field names follow the MCP Authorization specification, revision
    2026-07-28.

    **1.0.0-draft.1** (2026-09-09) - first contract: sessions, messages, runs, the SSE
    event model, message parts, files, workflow view, RFC 9457 errors.

  contact:
    name: GenAIx
    url: https://genaix.gentics.com/
  license:
    name: Proprietary
    identifier: LicenseRef-Gentics-ioflair-CMP9

servers:
  - url: https://{cms-host}/genaix/api/v1
    description: >-
      The API as published by a CMS installation. An intermediary supplies the installation
      token and the identity headers, and must pass Server-Sent Events through unbuffered.
    variables:
      cms-host:
        default: cms.example.com
        description: Host name of the Gentics CMS installation.
  - url: http://localhost:8080/api/v1
    description: >-
      Local mock of this contract. Accepts any bearer token starting with sk_gnx_ and any
      X-GCMS-Subject, and replays the scenario transcripts in `examples/`.

security:
  - installationToken: []

tags:
  - name: identity
    description: >-
      Who is calling, as an opaque subject, and what the installation offers them. Also the
      installation-level erasure of everything held for one subject.
  - name: mcp
    description: >-
      The MCP servers GenAIx uses and the per-user authorization of each one. Servers come
      from configuration; only their authorization is managed here.
  - name: sessions
    description: Sessions are user tasks. Create, list, inspect, patch, archive and transition them.
  - name: messages
    description: User turns and the stored assistant turns, both expressed as message parts.
  - name: runs
    description: One agent execution per user turn. Inspect status and usage, or cancel.
  - name: events
    description: The canonical Server-Sent Events stream of a session.
  - name: interactions
    description: Agent questions that block a run until the user answers.
  - name: files
    description: Per-session filesystem - uploads, agent artifacts and CMS snapshots.
  - name: workflows
    description: Workflow catalogue and the live workflow view of a session (plan, steps, checks, approvals).

# Single source of truth for the SSE event catalogue. Referenced by the x-sse-events
# extension of both GET /sessions/{session_id}/events and
# POST /sessions/{session_id}/messages through a YAML anchor, so the two can never drift
# and a code generator reading either operation sees all 27 event types.
x-sse-event-catalogue: &sse-event-catalogue
  - type: session.updated
    summary: Session status, title or context changed.
    schema:
      $ref: '#/components/schemas/SessionUpdatedEvent'
  - type: run.started
    summary: A run began.
    schema:
      $ref: '#/components/schemas/RunStartedEvent'
  - type: run.completed
    summary: A run finished successfully. Terminal. Carries usage.
    schema:
      $ref: '#/components/schemas/RunCompletedEvent'
  - type: run.failed
    summary: A run failed. Terminal. Carries a Problem.
    schema:
      $ref: '#/components/schemas/RunFailedEvent'
  - type: run.cancelled
    summary: A run was cancelled. Terminal.
    schema:
      $ref: '#/components/schemas/RunCancelledEvent'
  - type: message.started
    summary: An assistant message begins. Parts follow.
    schema:
      $ref: '#/components/schemas/MessageStartedEvent'
  - type: message.completed
    summary: An assistant message is final and persisted.
    schema:
      $ref: '#/components/schemas/MessageCompletedEvent'
  - type: part.started
    summary: A message part begins, with its initial shape.
    schema:
      $ref: '#/components/schemas/PartStartedEvent'
  - type: part.delta
    summary: >-
      Incremental update of a part - a text chunk for text-like parts, a JSON
      merge patch (RFC 7386) for structured parts.
    schema:
      $ref: '#/components/schemas/PartDeltaEvent'
  - type: part.completed
    summary: A part is final. Carries the authoritative full part.
    schema:
      $ref: '#/components/schemas/PartCompletedEvent'
  - type: status
    summary: Short human-readable statement of what the agent is doing right now.
    schema:
      $ref: '#/components/schemas/StatusEvent'
  - type: tool.started
    summary: An MCP tool call began.
    schema:
      $ref: '#/components/schemas/ToolStartedEvent'
  - type: tool.completed
    summary: An MCP tool call returned.
    schema:
      $ref: '#/components/schemas/ToolCompletedEvent'
  - type: tool.failed
    summary: An MCP tool call failed.
    schema:
      $ref: '#/components/schemas/ToolFailedEvent'
  - type: plan.updated
    summary: The visible work plan, versioned, full replacement.
    schema:
      $ref: '#/components/schemas/PlanUpdatedEvent'
  - type: step.updated
    summary: One step of the workflow view, full object, idempotent.
    schema:
      $ref: '#/components/schemas/StepUpdatedEvent'
  - type: check.updated
    summary: One check result, full object, idempotent. Verbatim proof lives here.
    schema:
      $ref: '#/components/schemas/CheckUpdatedEvent'
  - type: derived_settings.updated
    summary: The derived folder, template, language and filename, correctable by the user.
    schema:
      $ref: '#/components/schemas/DerivedSettingsUpdatedEvent'
  - type: approval_chain.updated
    summary: Ordered approval steps resolved from CMS permissions.
    schema:
      $ref: '#/components/schemas/ApprovalChainUpdatedEvent'
  - type: artifact.created
    summary: The agent wrote a file into the session filesystem.
    schema:
      $ref: '#/components/schemas/ArtifactCreatedEvent'
  - type: artifact.updated
    summary: An existing artifact changed.
    schema:
      $ref: '#/components/schemas/ArtifactUpdatedEvent'
  - type: preview.updated
    summary: Fires after every CMS write that affects the preview.
    schema:
      $ref: '#/components/schemas/PreviewUpdatedEvent'
  - type: interaction.requested
    summary: >-
      The agent needs an answer - a choice, free text, a confirmation, a form, or a review
      of the settings it derived. The run blocks.
    schema:
      $ref: '#/components/schemas/InteractionRequestedEvent'
  - type: interaction.resolved
    summary: The interaction was answered, timed out or cancelled.
    schema:
      $ref: '#/components/schemas/InteractionResolvedEvent'
  - type: auth.required
    summary: A run needs an MCP connection it cannot use, or that is unreachable.
    schema:
      $ref: '#/components/schemas/AuthRequiredEvent'
  - type: heartbeat
    summary: Keep-alive every 15 seconds of silence.
    schema:
      $ref: '#/components/schemas/HeartbeatEvent'
  - type: error
    summary: A non-terminal or terminal error, with a recoverable flag.
    schema:
      $ref: '#/components/schemas/ErrorEvent'

paths:
  /ping:
    get:
      operationId: ping
      tags: [identity]
      summary: Validate the installation token
      description: |
        Cheap credential check. Requires a valid installation token but **not** the identity
        headers, so a caller can verify its configuration before any user is involved.
      security:
        - installationToken: []
      responses:
        '200':
          description: The token is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
              examples:
                ok:
                  summary: Configured installation
                  value:
                    ok: true
                    installation_id: 7c1f0a52-6b84-4e3d-9a77-2f5e8c1b40d9
                    token_name: acme-gmbh-production
                    training_allowed: false
                    api_version: 1.0.0-rc.2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Identity, capabilities and dependency status
      description: |
        The first call a client makes. It returns the resolved identity, what this
        installation may do (workflows, upload limit, models), and one line per MCP
        connection this user holds saying whether it is authorized.

        An `authorization_status` other than `authorized` means every workflow that requires
        that connector type is unavailable unless another authorized connection of the type
        covers it, which is already reflected in `capabilities.workflows`. Read
        `GET /mcp/connections/{connection_id}/authorization` for the reason and the remedy,
        and `PUT` the same resource to register a credential. The same condition is reported
        mid-run as the `auth.required` event.

        `mcp_connections` can be empty on a brand new user. The first `GET /mcp/connections`
        fixes that when the installation configures a default URL for a connector type.
      parameters:
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '200':
          description: Resolved identity and capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                ready:
                  summary: The cms connection is authorized, so every workflow is available
                  value:
                    installation:
                      id: 7c1f0a52-6b84-4e3d-9a77-2f5e8c1b40d9
