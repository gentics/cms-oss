    delete:
      operationId: deleteSessionFile
      tags: [files]
      summary: Delete a file
      description: |
        Removes the file from the session filesystem. Messages that referenced it keep the
        id and should treat the target as missing.

        Two conflicts, distinguished by `genaix_code`:

        - `run_already_active` while a run is active, because the agent may be reading the
          file. Cancel the run with `POST /sessions/{session_id}/runs/{run_id}/cancel`
          first, or wait for it to finish.
        - `session_released` when the session status is `released`, `published`,
          `review_requested`, `discarded` or `archived`. The session filesystem is frozen
          together with the rest of the turn; reopen the session to change it.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/XGcmsSubject'
      x-example-request: |
        DELETE /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/files/6b0d9e31-44a8-4c57-9f2e-8d1a3c7b5e02 HTTP/1.1
        Authorization: Bearer sk_gnx_8Fqz1pWv7sR2mJhT4bXcY9dLaK0eNu3G
        X-GCMS-Subject: sub_c3f1a07d9e5b4826
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            A run is using the session filesystem, or the session has moved past
            generation.
          headers:
            X-GenAIx-Request-Id:
              $ref: '#/components/headers/XGenAIxRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                run_already_active:
                  summary: A run may still be reading the file
                  value:
                    type: https://genaix.gentics.com/problems/run-already-active
                    title: A run is already active
                    status: 409
                    detail: >-
                      Run c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94 is active and may be reading
                      this file. Cancel the run or wait for it to finish before deleting.
                    genaix_code: run_already_active
                    instance: >-
                      /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/files/6b0d9e31-44a8-4c57-9f2e-8d1a3c7b5e02
                    request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H2B
                    run_id: c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94
                session_released:
                  summary: The session filesystem is frozen with the session
                  value:
                    type: https://genaix.gentics.com/problems/session-released
                    title: Session is released
                    status: 409
                    detail: >-
                      The session is in status published. Its files are kept as the record
                      of how the content was produced and cannot be deleted. Reopen the
                      session first if you really need to change them.
                    genaix_code: session_released
                    instance: >-
                      /api/v1/sessions/9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13/files/6b0d9e31-44a8-4c57-9f2e-8d1a3c7b5e02
                    request_id: 01JZ8Q4M7X2R9V5T0B6C3E8H2C
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

