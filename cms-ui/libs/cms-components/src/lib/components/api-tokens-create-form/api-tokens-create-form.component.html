<form [formGroup]="form">
    <div class="flex-row row">
        <gtx-input
            class="columns small-12"
            [label]="('common.name' | gtxI18n) + ' *'"
            [required]="true"
            formControlName="name"
        ></gtx-input>
        <gtx-input
            class="columns small-12"
            [label]="('api_token.expires_at' | gtxI18n) + ' *'"
            [required]="false"
            type="date"
            formControlName="expires"
        ></gtx-input>
    </div>
</form>
