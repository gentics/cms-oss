  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: Workflow catalogue
      description: |
        The workflow **modules** this installation discovered at startup, with everything a
        client needs before a session exists: the step template to show before the agent
        reports anything, the MCP servers the module requires, the tool groups it may use,
        and the quality gates that will be enforced.

        `roles` is informational: it names the CMP roles the module is meant for, but
        authorization is always enforced by the CMS, never by this list.

        Phase One ids: `content_create` (S1), `content_research` (S2), `construct_create`
        (S3), `admin_user` (S4, optional) and `free_chat`. This route lists every module
        the installation has; `capabilities.workflows` in `GET /me` says which of them
        *this user* may start.
      parameters:
        - $ref: '#/components/parameters/XGcmsSubject'
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
                additionalProperties: false
              examples:
                catalogue:
                  summary: The Phase One modules
                  value:
                    items:
                      - id: content_create
                        version: 1.2.0
                        title: Create content from source material
                        description: >-
                          Turn an uploaded document and a prompt into an unpublished CMS
                          page draft, using only existing allowed constructs, with a
                          visible plan, correctable derived settings, a CMS preview and a
                          release/review/publish step.
                        scenario: S1
                        roles: [content_creator, chief_content_creator]
                        optional: false
                        required_connectors:
                          - type: cms
                            optional: false
                        tool_groups:
                          cms: [identity, search, content_read, content_write, constructs]
                          genaix: [harness, session_files]
                        models: [claude-sonnet-5, claude-opus-5]
                        inputs_schema:
                          type: object
                          required: [node_id]
                          properties:
                            node_id:
                              type: integer
                              title: Node
                            folder_id:
                              type: integer
                              title: Target folder
                            language:
                              type: string
                              title: Language
                            source_files:
                              type: array
                              title: Source documents
                              items:
                                type: string
                                format: uuid
                        steps_template:
                          - id: st-1
                            label: Read source material
                          - id: st-2
                            label: Derive folder, template and language
                            substeps:
                              - id: st-2-1
                                label: Resolve folder and language from context and text
                              - id: st-2-2
                                label: Check which templates allow the needed constructs
                          - id: st-3
                            label: Search existing content
                          - id: st-4
                            label: Propose plan
                          - id: st-5
                            label: Create page draft
                            substeps:
                              - id: st-5-1
                                label: Create page
                              - id: st-5-2
                                label: Fill hero
                              - id: st-5-3
                                label: Fill three key changes
                              - id: st-5-4
                                label: Insert verbatim legal quote
                              - id: st-5-5
                                label: Embed webinar form
                          - id: st-6
                            label: Verify and preview
                        quality_gates:
                          - id: no_duplicate
                            label: No near-duplicate page exists
                            kind: script
                            blocking: false
                            when: step_end
                            step_id: st-3
                            triggers:
                              - when: step_end
                                step_ids: [st-3]
                            description: >-
                              The best find_similar score stays below the threshold, or the
                              agent linked the closest match instead of duplicating it.
                          - id: constructs_allowed
                            label: Only constructs the template and node allow
                            kind: script
                            blocking: true
                            when: step_end
                            step_id: st-5
                            triggers:
                              - when: step_end
                                step_ids: [st-5]
                            description: >-
                              The construct keywords on the draft are a subset of what the
                              template allows intersected with what the node has assigned.
                          - id: verbatim_identical
                            label: Verbatim passages are character-identical
                            kind: script
                            blocking: true
                            when: step_end
                            step_id: st-5
                            triggers:
                              - when: step_end
                                step_ids: [st-5, st-6]
                              - when: before_release
                              - when: before_publish
                            description: >-
                              Reads the target tag back from the CMS and compares sha256 over
                              NFC-normalised UTF-8 against the locked source: the text of a
                              verbatim part, or every block of a verbatim upload's extracted
                              text. Normalisation stops at NFC, because anything more is the
                              gate tolerating a change.
                            timeout_seconds: 30
                          - id: references_exist
                            label: Every internal reference resolves
                            kind: script
                            blocking: true
                            when: step_end
                            step_id: st-5
                            triggers:
                              - when: step_end
                                step_ids: [st-5]
                            description: >-
                              Internal references are resolved through the CMS; external URLs
                              are reported, never fetched.
                          - id: draft_unpublished
                            label: The page is still an unpublished draft
                            kind: script
                            blocking: true
                            when: before_release
                            triggers:
                              - when: before_release
                            description: >-
                              Refuses the release if the page was published behind the
                              agent's back, so review starts from a draft.
                          - id: alt_text
                            label: Every image has alternative text
                            kind: script
                            blocking: false
                            when: step_end
                            step_id: st-5
                            triggers:
                              - when: step_end
                                step_ids: [st-5]
                            description: Enforces the guideline accessibility-basics.
                          - id: guideline_compliance
                            label: Guideline reviewer
                            kind: subagent
                            blocking: false
                            when: before_release
                            triggers:
                              - when: before_release
                            description: >-
                              A reviewer with read-only tools reads the preview, the page tags
                              and the guidelines and returns located findings. Non-blocking
                              because a reviewer verdict cannot be re-derived from evidence
                              the way a script verdict can.
                            timeout_seconds: 120
                          - id: release_self_check
                            label: Agent self-check before release
                            kind: prompt
                            blocking: false
                            when: before_release
                            triggers:
                              - when: before_release
                            description: >-
                              Advisory only. The agent states what it changed and what it is
                              unsure about; a prompt gate is never blocking.
                        produces: [page]
                      - id: content_research
                        version: 1.1.0
                        title: Research, inventory and reporting
                        description: >-
                          Answer natural-language questions over the content through the
                          Elasticsearch passthrough, permission-filtered, as a table or
                          list with object references.
                        scenario: S2
                        roles: [content_creator, chief_content_creator]
                        optional: false
                        required_connectors:
                          - type: cms
                            optional: false
                        tool_groups:
                          cms: [identity, search, content_read]
                          genaix: [harness, session_files]
                        steps_template:
                          - id: st-1
                            label: Understand the question
                          - id: st-2
                            label: Search content
                          - id: st-3
                            label: Verify hits
                          - id: st-4
                            label: Compile report
                        quality_gates:
                          - id: citations_resolve
                            label: Every citation resolves and the snippet is really there
                            kind: script
                            blocking: true
                            when: step_end
                            step_id: st-3
                            triggers:
                              - when: step_end
                                step_ids: [st-3, st-4]
                            description: >-
                              Every citation ref and table row reference resolves through
                              content_read, and each cited snippet occurs in the cited
                              object's current text.
                          - id: counts_reproducible
                            label: Stated counts reproduce
                            kind: script
                            blocking: true
                            when: step_end
                            step_id: st-4
                            triggers:
                              - when: step_end
                                step_ids: [st-4]
                            description: >-
                              Replaying each recorded search through count_content with the
                              search's own inputs reproduces every total and group_by bucket
                              the answer states.
                          - id: result_verification
                            label: Result verification reviewer
                            kind: subagent
                            blocking: false
                            when: before_release
                            triggers:
                              - when: before_release
                            description: >-
                              A reviewer re-runs a sample of the run's searches, confirms the
                              hits exist and the claims follow from them, and reports
                              discrepancies.
                            timeout_seconds: 120
                        produces: [report]
                      - id: construct_create
                        version: 1.0.3
                        title: Create a construct
                        description: >-
                          Draft a Tier 1 Handlebars construct, validate the template,
                          similarity-check the existing catalogue, create it through the
                          CMS REST API, assign it to nodes and render a preview.
                        scenario: S3
                        roles: [chief_content_creator]
                        optional: false
                        required_connectors:
                          - type: cms
                            optional: false
                        tool_groups:
                          cms: [identity, constructs, content_read, content_write]
                          genaix: [harness, session_files]
                        steps_template:
                          - id: st-1
                            label: Understand the requirement
                          - id: st-2
                            label: Check existing constructs
                          - id: st-3
                            label: Draft parts and template
                          - id: st-4
                            label: Validate template
                          - id: st-5
                            label: Create and assign
                          - id: st-6
                            label: Preview
                        quality_gates:
                          - id: handlebars_compiles
                            label: Handlebars template compiles
                            kind: script
                            blocking: true
                            when: step_end
                            step_id: st-4
                            triggers:
                              - when: step_end
                                step_ids: [st-4]
                            description: >-
                              The template compiles, uses no undefined helper and matches no
                              forbidden pattern. This is the existing validation tool promoted
                              to a gate, so it runs whether the model remembered or not.
                          - id: construct_similarity
                            label: No near-duplicate construct exists
                            kind: script
                            blocking: false
                            when: step_end
                            step_id: st-2
                            triggers:
                              - when: step_end
                                step_ids: [st-2]
                            description: >-
                              No existing construct exceeds the name or template similarity
                              threshold, or the user confirmed creating a new one anyway.
                          - id: parts_consistent
                            label: Parts and template agree
                            kind: script
                            blocking: true
                            when: step_end
                            step_id: st-4
                            triggers:
                              - when: step_end
