# Default values for cms.
global:
  nameOverride: ""
  fullnameOverride: ""

image:
  ## Registry and repository are combined to "registry/repository:tag".
  ## global.imageRegistry (umbrella mirror override) takes precedence over registry.
  ## Leave registry empty if your repository already contains the registry host.
  registry: "docker.gentics.com"
  repository: "gentics/cms-oss"
  #tag: 6.5.0
  pullPolicy: IfNotPresent
  ## ImagePullSecret, set to "" for no default PullSecret
  #pullSecret: docker-gentics-com

database:
  name: "cms"
  username: "node"
  # password: "node"
  # passwordSecret: "cms.database.secret"
  host: ""
  port: "3306"

# Add custom certificates to the jvm truststore
# customCert:
#   secretName: "my-certs"

cms:
  replicaCount: 1

# Custom annotations for the deployment
  #annotations:
  #  custom: "whatever"

  nodeUserPassword: ""
  #optionally - specify the secret name where the node user password is already stored (key need to be "password")
  #nodeUserPasswordSecret: "cms.nodeuser.secret"

  #configure gentics support login (Public/Private Key Auth)
  supportLogin: false

  # Configuration paths to be loaded
  configurationPaths:
    - extraconfig

  # Static content paths to be served
  #staticServePaths:
  #  - /cms/public/customer-config
  
  addJavaOpts: ""

  #extraEnv:
  #  - name: EXAMPLE_ENV
  #    value: "EXAMPLE_VALUE"

  # Resource requests/limits for the CMS container.
  # Passed through to the container as-is, so any field of the Kubernetes
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      cpu: 500m
    limits:
      cpu: 1000m
      memory: 2Gi
      cpu: 1000m

  # Override the global podSecurityContext/securityContext for the CMS pod only
  #podSecurityContext: {}
  #securityContext: {}

  ## Configure the service
  service:
    ## Specify a service type
    type: ClusterIP
    port: 80
    useHttp2: false

  ingress:
    enabled: false
    host: example.local
    annotations:
      # kubernetes.io/tls-acme: "true"
    #ingressClassName: nginx

    secretName: your-domain-tls
    tls: false

  persistence:
    enabled: true
    ## Whether CMS volumes (data, cache, backup) survive "helm uninstall".
    ## Unset: follows global.persistence.keepOnUninstall, defaulting to true (keep).
    ## Leave commented so the global umbrella switch stays effective.
    # keepOnUninstall: true
    #if false, also implementation (packages, config, ...) is persisted
    onlyData: false
    # Use existingClaim if you want to use a pre-exising claim. No new data volume will be requested
    # existingClaim: ""
    # If unset, the default StorageClass of the cluster is used.
    # Set to "-" to disable dynamic provisioning (storageClassName: "")
    # storageClass: ""
    annotations: {}
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  ## Persist cache to a persistent volume
  cache:
    persistence:
      enabled: false
      # Use existingClaim if you want to use a pre-exising claim. No new data volume will be requested
      # existingClaim: ""
      # If unset, the default StorageClass of the cluster is used.
      # Set to "-" to disable dynamic provisioning (storageClassName: "")
      # storageClass: ""
      annotations: {}
      accessModes:
        - ReadWriteOnce
      size: 5Gi

  backup:
    enabled: false
    
    # Daily at 22 pm
    schedule: "0 22 * * *"
    # Define the time limit for the backup in seconds
    timeLimitSeconds: 3600

    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

    #image:
    #  repository: "docker.gentics.com/gentics/cms-oss"
    #  tag: "6.1.0"
    #  pullPolicy: IfNotPresent
    #  pullSecret: docker-gentics-com

    resources:
      requests:
        memory: 500Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 250m

    # Override the global podSecurityContext/securityContext for the backup job only
    #podSecurityContext: {}
    #securityContext: {}

    ## Persist backup data to a persistent volume
    persistence:
      enabled: true
      # Use existingClaim if you want to use a pre-exising claim. No new backup volume will be requested
      # existingClaim: ""
      # If unset, the default StorageClass of the cluster is used.
      # Set to "-" to disable dynamic provisioning (storageClassName: "")
      # storageClass: ""
      annotations: {}
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    #allow to override default backup.sh script
    #backupScript: |-

  livenessProbe:
    httpGet:
      path: /
      port: http
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 6

  startupProbe:
    httpGet:
      path: /
      port: http
    timeoutSeconds: 1
    periodSeconds: 2
    successThreshold: 1
    failureThreshold: 90 #3min bootup time
   
  readinessProbe:
    httpGet:
      path: /rest/info/maintenance
      port: http
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3



  preUpgrade:
    enabled: false
    #nodeUser: "node"

    #image:
    #  repository: "docker.gentics.com/gentics/cms-oss"
    #  tag: "6.4.4"
    #  pullPolicy: IfNotPresent
    #  pullSecret: docker-gentics-com

    #allow to override default preUpgrade.sh script
    #script: |-

spellchecker:
  enabled: false
  ## Docker Hub image — registry intentionally empty; set global.imageRegistry
  ## only if your mirror also proxies Docker Hub.
  registry: ""
  repository: gentics/languagetool
  tag: latest
  ## Own pod spec, so it cannot inherit the CMS pod's pull secret.
  ## Unset falls back to image.pullSecret; set to "" to pull anonymously.
  #pullSecret: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Override the global podSecurityContext/securityContext for the spellchecker pod only
  #podSecurityContext: {}
  #securityContext: {}

# CMS ConfigMap files
# Override defaults or add more
# mountPath must be specified if it should be mounted into the CMS pod
cmsConfigMapFiles:
  # EXAMPLE: Mount custom cache config
  # cache.ccf:
  #   mountPath: /cms/conf/cache.ccf
  #   content: |
  #     jcs.default=
  #     ...

  # EXAMPLE: Mount custom log config
  # nodelog.yml:
  #   mountPath: /cms/conf/nodelog.yml
  #   content: |
  #     Configuration:
  #     ...

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

nodeSelector: {}
tolerations: []
affinity: {}

# Pod-level security context, applied to all pods of this chart
# (CMS, spellchecker and the backup job).
# Can be overridden per workload via cms.podSecurityContext,
# spellchecker.podSecurityContext and cms.backup.podSecurityContext
podSecurityContext: 
  runAsUser: null
  fsGroup: null
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault


# Container-level security context, applied to all containers of this chart.
# Can be overridden per workload via cms.securityContext,
# spellchecker.securityContext and cms.backup.securityContext
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Container lifecycle hooks for the CMS and spellchecker containers
#lifecycle:
