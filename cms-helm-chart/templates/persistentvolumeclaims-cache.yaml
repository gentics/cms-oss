{{- if and .Values.cms.cache.persistence.enabled (not .Values.cms.cache.persistence.existingClaim) }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "cms.fullname" . }}-cache

  {{- $keepAnnotations := include "gentics-common.pvcKeepAnnotations" (dict "root" . "local" (.Values.cms.persistence).keepOnUninstall) }}
  {{- if or $keepAnnotations .Values.cms.cache.persistence.annotations }}
  annotations:
    {{- with $keepAnnotations }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- with .Values.cms.cache.persistence.annotations }}
    {{ toYaml . }}
  {{- end }}
  {{- end }}

  labels:
    app: "{{ template "cms.name" . }}"
    chart: {{ template "cms.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
    app.kubernetes.io/name: {{ include "cms.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
  {{- range .Values.cms.cache.persistence.accessModes }}
    - {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cms.cache.persistence.size | quote }}
{{- if .Values.cms.cache.persistence.storageClass }}
{{- if (eq "-" .Values.cms.cache.persistence.storageClass) }}
  storageClassName: ""
{{- else }}
  storageClassName: {{ .Values.cms.cache.persistence.storageClass | quote }}
{{- end }}
{{- end }}
{{- end }}
