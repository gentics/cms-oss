                    data: {"seq":29,"ts":"2026-10-07T09:24:01Z","session_id":"9f1b6e4a-3c2d-4f7a-8b51-0d6e2a9c4f13","run_id":"c4e7a2b1-9d3f-4a86-b0c5-7e1f8d2a6b94","type":"interaction.resolved","interaction_id":"e3f7b1a9-2c64-4d08-95b7-1a8e0c5d7f36","answer":{"selected":["tpl-17"]},"by":"user"}

                settings_review:
                  summary: >-
